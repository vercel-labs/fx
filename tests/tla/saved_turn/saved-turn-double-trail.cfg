\* A second steering message may follow one the last request carried: a note then joins ahead of the carried one, and that request differs from the one before (RequestsExtend); the saved turn still equals the last request.
SPECIFICATION Spec
CONSTANTS
    MaxAtoms = 9
    MaxRequests = 4
    Notices = "none"
    Review = FALSE
    DoubleTrail = TRUE
    Bug = "none"
CONSTRAINT Bounded
INVARIANTS
    TypeOK
    NotesFirst
    ResultsTogether
    NothingDropped
    RoundTrip
    NextExtendsLast
PROPERTIES
    RequestsExtend
