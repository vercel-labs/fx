\* The design fx implements: a tool's notice joins once its step's results and feedback are in, the notice and the Stop hook's message are marked as fx's own steering, and a boundary's notes join before the steering the last step ended with: every rule holds.
SPECIFICATION Spec
CONSTANTS
    MaxAtoms = 9
    MaxRequests = 4
    Notices = "end"
    Review = TRUE
    Hook = TRUE
    DoubleTrail = FALSE
    Bug = "none"
CONSTRAINT Bounded
INVARIANTS
    TypeOK
    NotesFirst
    ResultsTogether
    NothingDropped
    RoundTrip
    NextExtendsLast
PROPERTIES
    RequestsExtend
