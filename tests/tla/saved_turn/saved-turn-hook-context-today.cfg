\* fx before H2b: a UserPromptSubmit hook's context joined the prompt with no marker, so the save
\* drops it and the next turn's request does not start with the turn's last request (NextExtendsLast).
SPECIFICATION Spec
CONSTANTS
    MaxAtoms = 9
    MaxRequests = 4
    Notices = "none"
    Review = FALSE
    Hook = TRUE
    DoubleTrail = FALSE
    Bug = "ctx_joined"
CONSTRAINT Bounded
INVARIANTS
    TypeOK
    NextExtendsLast
