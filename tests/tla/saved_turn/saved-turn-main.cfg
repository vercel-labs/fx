\* A known limit, not a design: this head sends a tool's notice and a Stop hook's message with no marker, so the save drops them (NothingDropped). Open PR 1829 marks both; when it lands, saved-turn.cfg describes fx and this config goes.
SPECIFICATION Spec
CONSTANTS
    MaxAtoms = 9
    MaxRequests = 4
    Notices = "plain"
    Review = TRUE
    Hook = TRUE
    DoubleTrail = FALSE
    Bug = "hook_plain"
CONSTRAINT Bounded
INVARIANTS
    TypeOK
    NotesFirst
    ResultsTogether
    NothingDropped
    RoundTrip
    NextExtendsLast
PROPERTIES
    RequestsExtend
