\* Mutation no-advance: Advance is FALSE.
\* The first team refuses every Gateway search tool and native search; the
\* second refuses none, so a block that outlives the team change shows.
CONSTANTS
    Agents = {main, child}
    RefusedByInit = {"exa", "native", "parallel"}
    RefusedByOther = {}
    MaxGen = 1
    MaxRequests = 2
    Advance = FALSE
    KeyByTeam = TRUE
    AtomicBlock = TRUE
SPECIFICATION Spec
CONSTRAINT StateBound
CHECK_DEADLOCK FALSE
INVARIANTS
    BoundedSends
    NoStaleSkip
    NoRepeatRefusal
    OneNotice
