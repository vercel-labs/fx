\* Mutant: design_a, but the tail shows only the open line, so a line that waits for a possible underline vanishes when its newline arrives. VisibleNeverShrinks must catch it.
SPECIFICATION Spec
CONSTANTS
    MaxLen = 7
    Variant = "mutant_drop_waiting"
    ScreenRows = 3
    ScrollLag = 0
    ChunkMax = 1
    W = 1
INVARIANTS
    TypeOK
PROPERTY
    VisibleNeverShrinks
