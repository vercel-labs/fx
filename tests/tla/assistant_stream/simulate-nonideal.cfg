SPECIFICATION Spec
CONSTANTS
    MaxLen = 7
    Variant = "design_a"
    ScreenRows = 3
    ScrollLag = 1
INVARIANTS
    TypeOK
    CommittedIsPrefixOfFinal
    FinalEqualsBatch
    HistoryOnlyCommitted
    NoUnfinalMark
    EveryWordVisible
