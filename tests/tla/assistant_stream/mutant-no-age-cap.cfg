\* Mutant: Reveal uses ceil(Len(Q)/W) without the age >= W - 1 cap.
\* BoundedStall must catch it once an 8-token burst (ChunkMax = 8, W = 2) drains 4 -> 2 -> 1 -> stalled = 3 > 2.
SPECIFICATION Spec
CONSTANTS
    MaxLen = 8
    Variant = "mutant_no_age_cap"
    ScreenRows = 2
    ScrollLag = 0
    ChunkMax = 8
    W = 2
INVARIANTS
    TypeOK
    BoundedStall
