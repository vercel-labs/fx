\* Every safety property of AgentWait's design, on traces of the real wait.
\* ConformsToSpec makes each recorded step a step of the model.
\* TraceData.tla is generated next to this file for each run.
SPECIFICATION TraceSpec
CHECK_DEADLOCK FALSE
INVARIANT
    StartsAtInit
    TypeOK
    OpenWaitHasNoMail
    MailKept
    NoMailLost
    WaitEndsWhenGone
    CallReturnsWhenGone
PROPERTY
    ConformsToSpec
    NoYieldWhileHeld
