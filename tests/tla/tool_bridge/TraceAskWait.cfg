\* Every safety property of AskWait's design, on traces of the real `fx tool ask` path.
\* ConformsToSpec makes each recorded step a step of the model.
\* TraceData.tla is generated next to this file for each run.
SPECIFICATION TraceSpec
CHECK_DEADLOCK FALSE
INVARIANT
    StartsAtInit
    TypeOK
    NoCrash
    OneShown
    SlotIsShown
    LockIsShown
    OpenOnlyInFirstCall
    NoQuestionWithoutUi
    QuestionEndsWhenGone
    CallReturnsWhenGone
PROPERTY
    ConformsToSpec
    NoYieldWhileOpen
