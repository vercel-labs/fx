\* Every safety property of ToolEdit's "bridge" design, on traces of the real
\* file path. ConformsToSpec makes each recorded step a step of the model.
\* TraceData.tla is generated next to this file for each run.
SPECIFICATION TraceSpec
CHECK_DEADLOCK FALSE
INVARIANT
    StartsAtInit
    TypeOK
    ExactReview
    NoStaleApply
    NoApplyAfterGone
    NoAskAfterGone
    ShownOnce
PROPERTY
    ConformsToSpec
