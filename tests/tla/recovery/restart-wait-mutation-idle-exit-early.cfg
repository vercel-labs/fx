\* Planted defect IdleExitEarly: the restart put off until idle exits while a turn still runs. The rule ExitOnlyWhenStopped must catch it (see check.sh).
SPECIFICATION Spec
CONSTANTS
    Agents = {"main", "inst", "sub"}
    Subagents = {"sub"}
    Faults = TRUE
    Bug = "none"
    IdleExit <- IdleExitEarly
INVARIANTS
    TypeOK
    IdleWaitHoldsNothing
    ExitOnlyWhenStopped
