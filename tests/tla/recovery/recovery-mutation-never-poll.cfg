\* Planted defect: a wait for a sign-in never resends by itself, so a login
\* that works again still waits for the user. PollBounded must catch it.
SPECIFICATION TSpec
CONSTANTS
    MaxFaults = 3
    Ladder = 3
    Bug = "never_poll"
    Ceiling = 4
    SendTicks = 2
    HandoffTicks = 2
    HealTicks = 6
    PollTicks = 3
INVARIANTS
    TTypeOK
    PollBounded
