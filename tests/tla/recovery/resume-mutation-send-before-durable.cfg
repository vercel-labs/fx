\* Planted defect send_before_durable: only SaveDurableBeforeSend may catch it.
\* The send goes out before the record's fsync.
SPECIFICATION Spec
CONSTANTS
    Policy = "proposed"
    AskProcs = {}
    MaxReq = 1
    MaxFaults = 3
    DeathCount = "seen"
    Bug = "send_before_durable"
INVARIANTS
    TypeOK
    OneResumer
    RecordBound
    SaveDurableBeforeSend
    BoundedClosing
PROPERTIES
    NoQuestionAfterCleanClose
    CloseKeepsRequest
    NotSticky
    NoQuestionAfterOneDeath
    CrashLoopAsks
    NoResumeAfterCommit
    NoResumeAfterEnd
    NoLostRequest
    OldAsks
    ResumesAfterClose
