\* Planted defect send_before_sync: only DeathCounted may catch it (see check.sh).
\* The send goes on the wire before its save is durable, so a crash loses it.
SPECIFICATION Spec
CONSTANTS
    MaxFaults = 3
    Fast = TRUE
    Bug = "send_before_sync"
INVARIANTS
    TypeOK
    NeverGivesUp
    NoFalseAlarm
    StatusHonest
    SaveBeforeSend
    DeathCounted
    NoResumeAfterEnd
    NothingAfterFinish
PROPERTIES
    NoHotRetry
    ResumesAfterClose
    CrashLoopAsks
    FastBeforeStop
    StopOnlyWhenRepeating
    Heals
