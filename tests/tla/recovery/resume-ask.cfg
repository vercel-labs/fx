\* The proposed closing design with a TUI and `fx ask` on one session: every rule must hold.
\* fx ask cancels on SIGINT or SIGTERM and never resumes on its own.
SPECIFICATION Spec
CONSTANTS
    Policy = "proposed"
    AskProcs = {2}
    MaxReq = 1
    MaxFaults = 3
    DeathCount = "seen"
    Bug = "none"
INVARIANTS
    TypeOK
    OneResumer
    RecordBound
    SaveDurableBeforeSend
    BoundedClosing
    CountsAgree
PROPERTIES
    NoQuestionAfterCleanClose
    CloseKeepsRequest
    NotSticky
    NoQuestionAfterOneDeath
    CrashLoopAsks
    NoResumeAfterCommit
    NoResumeAfterEnd
    NoLostRequest
    OldAsks
    ResumesAfterClose
