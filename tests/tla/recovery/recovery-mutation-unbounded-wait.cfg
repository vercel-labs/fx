\* Planted defect unbounded_wait: only WaitBounded may catch it (see check.sh).
\* A Retry-After longer than the ceiling is honored in full. HealTicks allows
\* the one extra tick that hint costs, so HealsWithin does not catch it too.
SPECIFICATION TSpec
CONSTANTS
    MaxFaults = 3
    Fast = TRUE
    Bug = "unbounded_wait"
    Ceiling = 4
    SendTicks = 2
    HealTicks = 7
INVARIANTS
    TTypeOK
    NeverGivesUp
    NoFalseAlarm
    StatusHonest
    SaveBeforeSend
    DeathCounted
    NoResumeAfterEnd
    NothingAfterFinish
    WaitBounded
    StatusFresh
    HealsWithin
PROPERTIES
    NoHotRetry
    ResumesAfterClose
    CrashLoopAsks
    FastBeforeStop
    StopOnlyWhenRepeating
