\* Planted defect no_closing: only ResumesAfterClose may catch it (see check.sh).
\* The closing save is not marked clean, so a close (SIGHUP, SIGTERM, or EOF
\* on the terminal) looks like a crash.
SPECIFICATION Spec
CONSTANTS
    MaxFaults = 3
    Fast = TRUE
    Bug = "no_closing"
INVARIANTS
    TypeOK
    NeverGivesUp
    NoFalseAlarm
    StatusHonest
    SaveBeforeSend
    DeathCounted
    NoResumeAfterEnd
    NothingAfterFinish
PROPERTIES
    NoHotRetry
    ResumesAfterClose
    CrashLoopAsks
    FastBeforeStop
    StopOnlyWhenRepeating
    Heals
