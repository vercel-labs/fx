\* Today, a sticky question: only NotSticky may catch it.
\* recovery.asked survives a clean quit (session_log.zig markRecoveryAsked), so every later
\* launch says fx quit unexpectedly until the turn is replaced.
SPECIFICATION Spec
CONSTANTS
    Policy = "today"
    AskProcs = {}
    MaxReq = 1
    MaxFaults = 3
    DeathCount = "seen"
    Bug = "none"
INVARIANTS
    TypeOK
    OneResumer
    SaveDurableBeforeSend
PROPERTIES
    NotSticky
    NoResumeAfterCommit
    NoLostRequest
