\* Planted defect no_lock: only OneResumer may catch it among the rules listed.
\* A second process opens the session without session.lock and resumes the same request.
\* It reads the live owner's record as an abrupt death and saves that count, and either
\* writer can resend or end what the other is working on, so NoQuestionAfterCleanClose,
\* CloseKeepsRequest, NoQuestionAfterOneDeath, CrashLoopAsks, NoResumeAfterCommit, and
\* NoResumeAfterEnd fail without the lock too. They are not listed. Every safety rule that
\* holds without the lock is; ResumesAfterClose holds too but is left out, as its check
\* takes a minute here.
SPECIFICATION Spec
CONSTANTS
    Policy = "proposed"
    AskProcs = {}
    MaxReq = 1
    MaxFaults = 3
    DeathCount = "seen"
    Bug = "no_lock"
INVARIANTS
    TypeOK
    OneResumer
    RecordBound
    SaveDurableBeforeSend
    BoundedClosing
PROPERTIES
    NotSticky
    NoLostRequest
    OldAsks
