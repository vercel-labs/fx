\* Today, "fx quit unexpectedly" after a clean close: only NoQuestionAfterCleanClose may catch it.
\* SIGHUP and SIGTERM re-raise without saving (app_lifecycle.zig), so owner.live stays and the
\* next launch asks (app_session_runtime.zig recoveryAutoContinueDecision).
SPECIFICATION Spec
CONSTANTS
    Policy = "today"
    AskProcs = {}
    MaxReq = 1
    MaxFaults = 3
    DeathCount = "seen"
    Bug = "none"
INVARIANTS
    TypeOK
    OneResumer
    SaveDurableBeforeSend
PROPERTIES
    NoQuestionAfterCleanClose
    NoResumeAfterCommit
    NoLostRequest
