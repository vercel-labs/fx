\* Planted defect: a resend while waiting for a sign-in that fails on the way
\* waits as an ordinary retry, so the next sign-in failure opens a second
\* sign-in. PollKeepsSignIn must catch it.
SPECIFICATION Spec
CONSTANTS
    MaxFaults = 3
    Ladder = 3
    Bug = "poll_drop_reasks"
INVARIANTS
    TypeOK
PROPERTIES
    PollKeepsSignIn
