\* The design with crashes: every rule must hold. TaskReported is checked only without crashes (childresume.cfg), because a crash that is not during the hold ends the work interrupted, as today.
SPECIFICATION Spec
CONSTANTS
    N = 3
    MaxRestarts = 2
    MaxCrashes = 2
    Bug = "none"
INVARIANTS
    TypeOK
    StepsOnce
    StepsInOrder
    OneReport
    NoReplacedReport
    OneContinuation
    YieldedTurnKeptOpen
