\* Today, a close never resumes: ResumesAfterClose, the only property listed, must fail.
\* After SIGHUP or SIGTERM the launch asks, and terminal EOF cancels the request, so nothing
\* sends it again unless the user does.
SPECIFICATION Spec
CONSTANTS
    Policy = "today"
    AskProcs = {}
    MaxReq = 1
    MaxFaults = 3
    DeathCount = "seen"
    Bug = "none"
INVARIANTS
    TypeOK
    OneResumer
    SaveDurableBeforeSend
PROPERTIES
    ResumesAfterClose
