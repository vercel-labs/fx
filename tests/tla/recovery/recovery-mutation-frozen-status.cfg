\* Planted defect frozen_status: only StatusHonest may catch it (see check.sh).
\* The retry warning stays up over a streaming answer.
SPECIFICATION Spec
CONSTANTS
    MaxFaults = 3
    Fast = TRUE
    Bug = "frozen_status"
INVARIANTS
    TypeOK
    NeverGivesUp
    NoFalseAlarm
    StatusHonest
    SaveBeforeSend
    DeathCounted
    NoResumeAfterEnd
    NothingAfterFinish
PROPERTIES
    NoHotRetry
    ResumesAfterClose
    CrashLoopAsks
    FastBeforeStop
    StopOnlyWhenRepeating
    Heals
