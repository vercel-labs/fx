\* Planted defect filter_answer_keeps_count: the user's answer keeps the content filter's count, so the next block asks at once.
\* Exactly one rule must catch it (see check.sh).
SPECIFICATION Spec
CONSTANTS
    MaxFaults = 3
    Ladder = 3
    Bug = "filter_answer_keeps_count"
INVARIANTS
    TypeOK
    NeverGivesUp
    NoFalseAlarm
    StatusHonest
    NoHotRetry
    SaveBeforeSend
PROPERTIES
    PollKeepsSignIn
    ResumesAfterClose
    CrashLoopStops
    FilterBounded
    AskingHostWaits
    CannotAskEnds
    AnswerGivesResends
    Heals
