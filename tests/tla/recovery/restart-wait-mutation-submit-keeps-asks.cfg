\* Planted defect SubmitKeepsAsks, fx before prompts went out at once: a prompt sent while the restart waits stays behind the held turns. The rule IdleWaitHoldsNothing must catch it (see check.sh).
SPECIFICATION Spec
CONSTANTS
    Agents = {"main", "inst"}
    Faults = TRUE
    Bug = "none"
    Submit <- SubmitKeepsAsks
INVARIANTS
    TypeOK
    IdleWaitHoldsNothing
    ExitOnlyWhenStopped
