\* fx before this change: Ctrl+G asks only the agents that are not subagents, so a subagent's turn goes past its boundary while the restart waits.
SPECIFICATION Spec
CONSTANTS
    Agents = {"main", "inst", "sub"}
    Subagents = {"sub"}
    Faults = TRUE
    Bug = "subagents_not_asked"
INVARIANTS
    TypeOK
    NoStopWhileCancellable
    NoTurnPassesBoundaryWhileWaiting
    HeldOnlyWhileRestartWaits
    NoUncancellableWait
    ExitOnlyWhenStopped
