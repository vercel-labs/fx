\* The design, no crashes: every rule must hold, and the task's report must come.
SPECIFICATION Spec
CONSTANTS
    N = 3
    MaxRestarts = 2
    MaxCrashes = 0
    Bug = "none"
INVARIANTS
    TypeOK
    StepsOnce
    StepsInOrder
    OneReport
    NoReplacedReport
    OneContinuation
    YieldedTurnKeptOpen
PROPERTY
    TaskReported
