\* Planted defect stop_before_fast: only FastBeforeStop may catch it (see check.sh).
\* fx's stop looks only one failure ahead, so it stops a Fast request before
\* the module drops Fast.
SPECIFICATION Spec
CONSTANTS
    MaxFaults = 3
    Fast = TRUE
    Bug = "stop_before_fast"
INVARIANTS
    TypeOK
    NeverGivesUp
    NoFalseAlarm
    StatusHonest
    SaveBeforeSend
    DeathCounted
    NoResumeAfterEnd
    NothingAfterFinish
PROPERTIES
    NoHotRetry
    ResumesAfterClose
    CrashLoopAsks
    FastBeforeStop
    StopOnlyWhenRepeating
    Heals
