\* Correct recovery on a discrete clock: every safety rule and time bound must
\* hold. Ceiling stands for the 30-second cap; HealTicks = Ceiling + SendTicks
\* is the tight bound (5 fails).
SPECIFICATION TSpec
CONSTANTS
    MaxFaults = 3
    Fast = TRUE
    Bug = "none"
    Ceiling = 4
    SendTicks = 2
    HealTicks = 6
INVARIANTS
    TTypeOK
    NeverGivesUp
    NoFalseAlarm
    StatusHonest
    SaveBeforeSend
    DeathCounted
    NoResumeAfterEnd
    NothingAfterFinish
    WaitBounded
    StatusFresh
    HealsWithin
PROPERTIES
    NoHotRetry
    ResumesAfterClose
    CrashLoopAsks
    FastBeforeStop
    StopOnlyWhenRepeating
