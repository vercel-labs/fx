\* Correct recovery on a discrete clock: every safety rule and time bound must
\* hold. Ceiling stands for the 30-second cap; HealTicks = Ceiling + SendTicks
\* is the tight bound (5 fails HealsWithin).
SPECIFICATION TSpec
CONSTANTS
    MaxFaults = 3
    Ladder = 3
    Bug = "none"
    Ceiling = 4
    SendTicks = 2
    HealTicks = 6
INVARIANTS
    TTypeOK
    NeverGivesUp
    NoFalseAlarm
    StatusHonest
    NoHotRetry
    SaveBeforeSend
    WaitBounded
    StatusFresh
    HealsWithin
