\* Planted defect torn_resets: only CrashLoopAsks may catch it (see check.sh).
\* A torn record starts the request fresh, as recovery.zig decode failure does today.
SPECIFICATION Spec
CONSTANTS
    MaxFaults = 3
    Fast = TRUE
    Bug = "torn_resets"
INVARIANTS
    TypeOK
    NeverGivesUp
    NoFalseAlarm
    StatusHonest
    SaveBeforeSend
    DeathCounted
    NoResumeAfterEnd
    NothingAfterFinish
PROPERTIES
    NoHotRetry
    ResumesAfterClose
    CrashLoopAsks
    FastBeforeStop
    StopOnlyWhenRepeating
    Heals
