\* fx today: a launch leaves an interrupted request for the user (AutoResumes).
SPECIFICATION Spec
CONSTANTS
    Policy = "today"
    MaxReq = 2
    MaxFaults = 3
    Bug = "none"
INVARIANTS
    TypeOK
    AutoResumes
    ResumeNeverAsks
    NoFalseCrash
    CrashLoopStops
    DoneNeverResent
    CancelNeverResumes
    OneWorker
    YieldContinues
