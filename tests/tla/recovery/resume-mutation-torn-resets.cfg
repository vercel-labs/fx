\* Planted defect torn_resets: only CrashLoopAsks may catch it.
\* A torn record starts fresh instead of counting one death, as recovery.zig decode does today.
SPECIFICATION Spec
CONSTANTS
    Policy = "proposed"
    AskProcs = {}
    MaxReq = 1
    MaxFaults = 3
    DeathCount = "seen"
    Bug = "torn_resets"
INVARIANTS
    TypeOK
    OneResumer
    RecordBound
    SaveDurableBeforeSend
    BoundedClosing
PROPERTIES
    NoQuestionAfterCleanClose
    CloseKeepsRequest
    NotSticky
    NoQuestionAfterOneDeath
    CrashLoopAsks
    NoResumeAfterCommit
    NoResumeAfterEnd
    NoLostRequest
    OldAsks
    ResumesAfterClose
