\* Today, terminal EOF loses the request: only CloseKeepsRequest may catch it.
\* EOF runs the normal shutdown (app_entry_runtime.zig TerminalInputClosed), which cancels
\* the request and clears its checkpoint, so nothing is left to resume.
SPECIFICATION Spec
CONSTANTS
    Policy = "today"
    AskProcs = {}
    MaxReq = 1
    MaxFaults = 3
    DeathCount = "seen"
    Bug = "none"
INVARIANTS
    TypeOK
    OneResumer
    SaveDurableBeforeSend
PROPERTIES
    CloseKeepsRequest
    NoResumeAfterCommit
    NoLostRequest
