\* Planted defect owner_fallback: only NoResumeAfterEnd may catch it.
\* The rejected alternative to the interrupted-turn notice: with no record, a snapshot and
\* no owner.live resume on their own, so a paused turn, whose record finish deleted, is
\* sent again.
SPECIFICATION Spec
CONSTANTS
    Policy = "proposed"
    AskProcs = {}
    MaxReq = 1
    MaxFaults = 3
    DeathCount = "seen"
    Bug = "owner_fallback"
INVARIANTS
    TypeOK
    OneResumer
    RecordBound
    SaveDurableBeforeSend
    BoundedClosing
PROPERTIES
    NoQuestionAfterCleanClose
    CloseKeepsRequest
    NotSticky
    NoQuestionAfterOneDeath
    CrashLoopAsks
    NoResumeAfterCommit
    NoResumeAfterEnd
    NoLostRequest
    OldAsks
    ResumesAfterClose
