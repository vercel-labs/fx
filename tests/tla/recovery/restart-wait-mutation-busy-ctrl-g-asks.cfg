SPECIFICATION Spec
CONSTANTS
    Agents = {"main", "inst"}
    Faults = TRUE
    Bug = "none"
    CtrlGBusy <- CtrlGBusyAsks
INVARIANTS
    TypeOK
    IdleWaitHoldsNothing
    ExitOnlyWhenStopped
