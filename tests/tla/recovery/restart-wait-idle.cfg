\* The design with prompts sent while the restart waits: they go out at once, and fx restarts when idle. Every rule must hold.
SPECIFICATION Spec
CONSTANTS
    Agents = {"main", "inst"}
    Faults = TRUE
    Bug = "none"
INVARIANTS
    TypeOK
    NoStopWhileCancellable
    HeldOnlyWhileRestartWaits
    NoUncancellableWait
    ExitOnlyWhenStopped
    IdleWaitHoldsNothing
PROPERTY
    WaitEnds
    IdleWaitEnds
