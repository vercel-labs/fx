\* Planted defect no_seq_binding: only NoResumeAfterCommit may catch it.
\* The launch resumes a record whose seq the log has passed, after a crash between the
\* commit and the record delete.
SPECIFICATION Spec
CONSTANTS
    Policy = "proposed"
    AskProcs = {}
    MaxReq = 1
    MaxFaults = 3
    DeathCount = "seen"
    Bug = "no_seq_binding"
INVARIANTS
    TypeOK
    OneResumer
    RecordBound
    SaveDurableBeforeSend
    BoundedClosing
PROPERTIES
    NoQuestionAfterCleanClose
    CloseKeepsRequest
    NotSticky
    NoQuestionAfterOneDeath
    CrashLoopAsks
    NoResumeAfterCommit
    NoResumeAfterEnd
    NoLostRequest
    OldAsks
    ResumesAfterClose
