\* Planted defect note_typed in design a2: a turn the person typed registers its
\* request and is noted to main, so a request that must stay with the person
\* reaches main. TLC must violate TypedStaysWithPerson.
SPECIFICATION Spec
CONSTANTS
    Kids = {"k1", "k2"}
    Design = "a2"
    FailedNote = "refuse"
    RegistryFull = FALSE
    Mutant = "note_typed"
INVARIANTS
    TypeOK
    TypedStaysWithPerson
CHECK_DEADLOCK TRUE
