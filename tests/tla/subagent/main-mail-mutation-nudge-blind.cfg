\* Planted defect nudge-blind: an empty reply's check ignores mail in the
\* hand-off, so the nudge goes out while a report is on its way (fx before the
\* wait). check.sh names the rule that must catch it.
SPECIFICATION Spec
\* Main out of turns ends a behavior.
CHECK_DEADLOCK FALSE
CONSTANTS
    Mail = {"m1", "m2", "m3"}
    MaxTurns = 4
    Joins = TRUE
    Commits = TRUE
    Handoff = TRUE
    Bug = "nudge_blind"
INVARIANTS
    TypeOK
    NoNudgeWithMail
