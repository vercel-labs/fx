\* The design: the request is registered before its note is posted, and only
\* a noted request is refused by the fallback; main's approve runs the exact
\* call through main's own check. No waiting request is left unanswered.
SPECIFICATION Spec
CONSTANTS
    Kids = {"k1", "k2"}
    Bug = "none"
INVARIANTS
    TypeOK
    Authority
    NoLostApprove
    FallbackOnlyAfterSeen
CHECK_DEADLOCK TRUE
