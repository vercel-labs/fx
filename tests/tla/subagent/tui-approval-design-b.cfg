\* Design b: main's answer is handed to the loop, which clears the child's
\* prompt and any lent copy in the step that submits (input_approval_runtime.zig:
\* 257-274), so no screen holds a request whose memory is freed. Every rule
\* must hold.
SPECIFICATION Spec
CONSTANTS
    Kids = {"k1", "k2"}
    Design = "b"
    FailedNote = "refuse"
    RegistryFull = FALSE
    Mutant = "none"
INVARIANTS
    TypeOK
    NoStaleLent
    NoStalePrompt
    AnswerOnce
    TypedStaysWithPerson
    Authority
    NoLostApprove
    NoPersonPromptForParentRouted
CHECK_DEADLOCK TRUE
