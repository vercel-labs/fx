\* Design b with FailedNote = "person": a note that cannot be posted leaves the
\* request with the person, whose answer is the loop's own step. Every rule must
\* hold.
SPECIFICATION Spec
CONSTANTS
    Kids = {"k1", "k2"}
    Design = "b"
    FailedNote = "person"
    RegistryFull = FALSE
    Mutant = "none"
INVARIANTS
    TypeOK
    NoStaleLent
    NoStalePrompt
    AnswerOnce
    TypedStaysWithPerson
    Authority
    NoLostApprove
    NoPersonPromptForParentRouted
CHECK_DEADLOCK TRUE
