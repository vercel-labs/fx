\* Non-ideal conditions: design b, a note that cannot post leaves the request
\* with the person, and the registry is already full, so a parent-started child
\* is refused at once. Random behaviors must find no error.
SPECIFICATION Spec
CONSTANTS
    Kids = {"k1", "k2"}
    Design = "b"
    FailedNote = "person"
    RegistryFull = TRUE
    Mutant = "none"
INVARIANTS
    TypeOK
    NoStaleLent
    NoStalePrompt
    AnswerOnce
    TypedStaysWithPerson
    Authority
    NoLostApprove
    NoPersonPromptForParentRouted
