\* The design where the host commits each finished turn in a step of its own
\* (the app): mail that missed a turn never starts the next one before the
\* commit, unless the gate gave up, and the gate never waits for nothing.
SPECIFICATION Spec
\* Main out of turns ends a behavior.
CHECK_DEADLOCK FALSE
CONSTANTS
    Mail = {"m1", "m2", "m3"}
    MaxTurns = 4
    Joins = TRUE
    Commits = TRUE
    Bug = "none"
INVARIANTS
    TypeOK
    JoinsOpenTurn
    EachOnce
    NoneLost
    InOrder
    WaitHonest
    CommitBeforeNextTurn
    GateNeverStuck
