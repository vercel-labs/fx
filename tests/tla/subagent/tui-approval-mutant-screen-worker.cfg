\* Planted defect screen_worker in design c: a screen that cannot open
\* submits its deny through the screen's own worker instead of the worker that
\* owns the request, so the deny is dropped or answers another request. TLC
\* must violate NoAnswerToNonOwner.
SPECIFICATION Spec
CONSTANTS
    Kids = {"k1", "k2"}
    Design = "c"
    FailedNote = "refuse"
    RegistryFull = FALSE
    Mutant = "screen_worker"
INVARIANTS
    TypeOK
    NoAnswerToNonOwner
CHECK_DEADLOCK TRUE
