\* Planted defect unbounded-wait: the worker waits for mail in the hand-off
\* with no bound. check.sh names the rule that must catch it.
SPECIFICATION Spec
\* Main out of turns ends a behavior.
CHECK_DEADLOCK FALSE
CONSTANTS
    Mail = {"m1", "m2", "m3"}
    MaxTurns = 4
    Joins = TRUE
    Commits = TRUE
    Handoff = TRUE
    Bug = "unbounded_wait"
INVARIANTS
    TypeOK
    WaitBounded
