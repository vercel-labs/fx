\* The design, deeper: three subagents, two spells each, a mailbox of two.
SPECIFICATION Spec
\* Every subagent closed with its notes read ends a behavior.
CHECK_DEADLOCK FALSE
CONSTANTS
    Children = {"c1", "c2", "c3"}
    MaxSpells = 2
    Cap = 2
    Bug = "none"
INVARIANTS
    TypeOK
    OnePerSpell
    OnlyCrossings
    NoRelayAfterClose
    EveryCrossingAccounted
    MailboxBounded
    NoSleepOnMail
    BlockedOnlyWhileOpen
PROPERTIES
    MailRead
