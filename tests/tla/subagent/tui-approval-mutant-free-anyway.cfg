\* Planted defect free_anyway in design a2: the worker frees the review memory
\* without waiting for the loop to clear the prompt, so a2's guard is gone and
\* the prompt outlives its memory. TLC must violate NoStalePrompt.
SPECIFICATION Spec
CONSTANTS
    Kids = {"k1", "k2"}
    Design = "a2"
    FailedNote = "refuse"
    RegistryFull = FALSE
    Mutant = "free_anyway"
INVARIANTS
    TypeOK
    NoStalePrompt
CHECK_DEADLOCK TRUE
