\* Design a with FailedNote = "person": a note that cannot be posted leaves the
\* request with the person instead of refusing it. The ordering that breaks
\* NoStalePrompt in design a is untouched by that choice, so TLC must still
\* violate NoStalePrompt: the note's own deny is applied off the loop.
SPECIFICATION Spec
CONSTANTS
    Kids = {"k1", "k2"}
    Design = "a"
    FailedNote = "person"
    RegistryFull = FALSE
    Mutant = "none"
INVARIANTS
    TypeOK
    NoStalePrompt
CHECK_DEADLOCK TRUE
