\* Design B: the view projects the oldest item from the child's live state and
\* stores nothing. Every rule must hold, with no settle.

SPECIFICATION Spec
CONSTANTS
    MainKids = {"a", "b"}
    InstKids = {"i"}
    ChildScreens = {"a"}
    Design = "b"
    Mutant = "none"
    Hazards = "all"
INVARIANTS
    TypeOK
    ShownWhenFree
    OneAtATime
    OldestFirst
    FooterQuietForShown
    ActionReachesOwner
    NoStaleShown
    HeldUnderAltScreen
    InstanceScope
    NoSecretToModel
    MainOnlyTellsOrStops
    OwnScreenActable
    ShownOnlyWhileWaiting
CHECK_DEADLOCK TRUE
