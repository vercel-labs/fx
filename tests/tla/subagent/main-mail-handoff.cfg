\* The design where the host hands a subagent's mail to its main loop before the
\* worker's queue (the app): an empty reply's check waits, at most a bound, for
\* mail in the hand-off, so the mail takes the nudge's place, and it never
\* waits for more than the bound.
SPECIFICATION Spec
\* Main out of turns ends a behavior.
CHECK_DEADLOCK FALSE
CONSTANTS
    Mail = {"m1", "m2", "m3"}
    MaxTurns = 4
    Joins = TRUE
    Commits = TRUE
    Handoff = TRUE
    Bug = "none"
INVARIANTS
    TypeOK
    JoinsOpenTurn
    EachOnce
    NoneLost
    InOrder
    WaitHonest
    CommitBeforeNextTurn
    GateNeverStuck
    NoNudgeWithMail
    WaitBounded
