\* Planted defect stuck-gate: a commit leaves the gate's count as it was, so
\* the gate waits for an acknowledgement that cannot come. check.sh names the
\* rule that must catch it.
SPECIFICATION Spec
\* Main out of turns ends a behavior.
CHECK_DEADLOCK FALSE
CONSTANTS
    Mail = {"m1", "m2", "m3"}
    MaxTurns = 4
    Joins = TRUE
    Commits = TRUE
    Bug = "stuck_gate"
INVARIANTS
    TypeOK
    GateNeverStuck
