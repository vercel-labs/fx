    Kids = {"k1", "k2"}
    Design = "a2"
    FailedNote = "refuse"
    RegistryFull = FALSE
    Mutant = "none"
INVARIANTS
    TypeOK
    NoStaleLent
    NoStalePrompt
    AnswerOnce
    TypedStaysWithPerson
    Authority
    NoLostApprove
    NoPersonPromptForParentRouted
