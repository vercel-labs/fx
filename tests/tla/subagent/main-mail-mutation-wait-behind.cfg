\* Planted defect wait-behind: the worker keeps waiting for mail that older work
\* keeps out of the turn, the lost wake-up of a check that reads no state. check.sh
\* names the rule that must catch it.
SPECIFICATION Spec
\* Main out of turns ends a behavior.
CHECK_DEADLOCK FALSE
CONSTANTS
    Mail = {"m1", "m2", "m3"}
    MaxTurns = 4
    Joins = TRUE
    Commits = TRUE
    Handoff = TRUE
    Bug = "wait_behind"
INVARIANTS
    TypeOK
    NoPointlessWait
