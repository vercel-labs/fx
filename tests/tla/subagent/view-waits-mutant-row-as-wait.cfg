\* A planted view that shows the status row instead of the wait: a row that
\* outlived its wait looks like a child that still waits.
SPECIFICATION Spec
CONSTANTS
    MainKids = {"a", "b"}
    InstKids = {"i"}
    ChildScreens = {"a"}
    Design = "b"
    Mutant = "row-as-wait"
    Hazards = "all"
INVARIANTS
    TypeOK
    ShownOnlyWhileWaiting
CHECK_DEADLOCK TRUE
