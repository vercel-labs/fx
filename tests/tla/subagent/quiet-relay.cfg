\* The design: two subagents, two spells each, a mailbox of one.
SPECIFICATION Spec
\* Every subagent closed with its notes read ends a behavior.
CHECK_DEADLOCK FALSE
CONSTANTS
    Children = {"c1", "c2"}
    MaxSpells = 2
    Cap = 1
    Bug = "none"
INVARIANTS
    TypeOK
    OnePerSpell
    OnlyCrossings
    NoRelayAfterClose
    EveryCrossingAccounted
    MailboxBounded
    NoSleepOnMail
    BlockedOnlyWhileOpen
PROPERTIES
    MailRead
