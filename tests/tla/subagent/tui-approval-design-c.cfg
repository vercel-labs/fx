\* Design c: the prompt takes its copy of the review under the worker's mutex,
\* while the request still waits, main's answer is resolved on main's thread,
\* the person's answer withdraws the binding, and a failed note refuses. Design
\* b: main's answer is handed to the loop, which clears the child's prompt and
\* any lent copy in the step that submits (input_approval_runtime.zig:257-274),
\* so no screen holds a request whose memory is freed. Every rule must hold.
SPECIFICATION Spec
CONSTANTS
    Kids = {"k1", "k2"}
    Design = "c"
    FailedNote = "refuse"
    RegistryFull = FALSE
    Mutant = "none"
INVARIANTS
    TypeOK
    NoStaleLent
    NoStalePrompt
    AnswerOnce
    TypedStaysWithPerson
    Authority
    NoLostApprove
    NoPersonPromptForParentRouted
CHECK_DEADLOCK TRUE
