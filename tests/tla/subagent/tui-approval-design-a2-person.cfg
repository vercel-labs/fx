\* Design a2 with FailedNote = "person": a note that cannot be posted leaves
\* the request with the person, and the prompt clears when the person answers.
\* Every rule must hold.
SPECIFICATION Spec
CONSTANTS
    Kids = {"k1", "k2"}
    Design = "a2"
    FailedNote = "person"
    RegistryFull = FALSE
    Mutant = "none"
INVARIANTS
    TypeOK
    NoStaleLent
    NoStalePrompt
    AnswerOnce
    TypedStaysWithPerson
    Authority
    NoLostApprove
    NoPersonPromptForParentRouted
CHECK_DEADLOCK TRUE
