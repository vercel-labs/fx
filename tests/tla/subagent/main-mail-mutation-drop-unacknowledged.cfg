\* Planted defect drop-unacknowledged: a finish the loop drops unsaved leaves the
\* gate's count as it was, so the gate waits for a commit that cannot come.
\* check.sh names the rule that must catch it.
SPECIFICATION Spec
\* Main out of turns ends a behavior.
CHECK_DEADLOCK FALSE
CONSTANTS
    Mail = {"m1", "m2", "m3"}
    MaxTurns = 4
    Joins = TRUE
    Commits = TRUE
    Bug = "drop_unacknowledged"
INVARIANTS
    TypeOK
    GateNeverStuck
