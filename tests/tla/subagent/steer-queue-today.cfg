\* fx before this design: one list for every subagent, settled entries counted.
\* It also keeps a closed subagent's entries; steer-queue-today-close.cfg checks
\* that alone, since both defects are reached at the same depth.
SPECIFICATION Spec
\* Every subagent closed, or main out of messages, ends a behavior.
CHECK_DEADLOCK FALSE
CONSTANTS
    Children = {"c1", "c2"}
    Cap = 2
    MaxSends = 6
    Bug = "today"
INVARIANTS
    TypeOK
    RefusedOnlyWhenFull
    WaitingBounded
    EntriesFromThisWork
    IdleHoldsNoUnread
