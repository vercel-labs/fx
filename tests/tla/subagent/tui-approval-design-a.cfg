\* Design a: no lend of a parent-routed request, and main's answer resolved and
\* submitted in one step on main's thread, which the loop learns of only at its
\* next sync (app_worker_runtime.zig:809-830). The worker frees the review memory
\* as soon as its call has the answer, so the child's prompt still shows a
\* request whose memory is gone. TLC must violate NoStalePrompt.
SPECIFICATION Spec
CONSTANTS
    Kids = {"k1", "k2"}
    Design = "a"
    FailedNote = "refuse"
    RegistryFull = FALSE
    Mutant = "none"
INVARIANTS
    TypeOK
    NoStalePrompt
CHECK_DEADLOCK TRUE
