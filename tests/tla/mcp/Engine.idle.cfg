\* Idle stop bounds: one server, two calls, two tries in a row, one host drop, and the idle
\* timer on. Engine.cfg leaves it off, so the cost of the two-server smoke stays what it was;
\* this config is small enough to run beside it.
CONSTANTS
    Servers = {1}
    Calls = {1, 2}
    Owner <- IdleOwner
    MaxAttempts = 2
    MaxHost = 1
    IdleStop = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT PermissionBeforeCall
INVARIANT DeniedEndsThere
INVARIANT IdleEndsNothing
INVARIANT IdleStopsNoList
INVARIANT LazyConnect
INVARIANT BoundedReconnect
INVARIANT StatusConsistent
INVARIANT AskedHasNeed
INVARIANT RetryOnlyAfterFailure
INVARIANT StayedBeforeFreshTries
PROPERTY Isolation
PROPERTY WaitsForOneStart
PROPERTY EveryCallEnds
PROPERTY NeedServed
PROPERTY RetriesEnd
