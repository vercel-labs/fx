\* The code before the fix: the engine matched the bytes of a form's names and
\* choices, so a name the server wrote with an escape never matched the answer
\* the host wrote back. The model finds it: FitAccepted fails, with an answer
\* that fits the form refused. Expected exit 12 (a safety violation).
CONSTANTS
    Reqs = {1}
    Compare = "raw"
    MaxPending = 1
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT FitAccepted
