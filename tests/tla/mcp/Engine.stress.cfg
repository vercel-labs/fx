\* Stress bounds: two servers, four calls (two each), three tries in a row, one host drop,
\* two lost calls in a row. IdleStop FALSE is the engine without the idle stop, as the smoke
\* config runs it; Engine.idle.cfg covers the idle stop on its own.
CONSTANTS
    Servers = {1, 2}
    Calls = {1, 2, 3, 4}
    Owner <- SmokeOwner
    MaxAttempts = 3
    MaxHost = 1
    IdleStop = FALSE
    LostLimit = 2
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT PermissionBeforeCall
INVARIANT DeniedEndsThere
INVARIANT LazyConnect
INVARIANT BoundedReconnect
INVARIANT StatusConsistent
INVARIANT AskedHasNeed
INVARIANT RetryOnlyAfterFailure
INVARIANT StayedBeforeFreshTries
PROPERTY Isolation
PROPERTY WaitsForOneStart
PROPERTY EveryCallEnds
PROPERTY NeedServed
PROPERTY RestartOnlyAfterLosses
