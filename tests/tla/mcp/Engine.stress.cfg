\* Stress bounds: two servers, four calls (two each), three tries in a row, one host drop.
CONSTANTS
    Servers = {1, 2}
    Calls = {1, 2, 3, 4}
    Owner <- SmokeOwner
    MaxAttempts = 3
    MaxHost = 1
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT PermissionBeforeCall
INVARIANT DeniedEndsThere
INVARIANT LazyConnect
INVARIANT BoundedReconnect
INVARIANT StatusConsistent
INVARIANT AskedHasNeed
INVARIANT RetryOnlyAfterFailure
INVARIANT StayedBeforeFreshTries
PROPERTY Isolation
PROPERTY EveryCallEnds
PROPERTY NeedServed
