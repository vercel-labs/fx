\* Smoke bounds: three requests: the first is initialize, the second a normal request, the third a listen. Time runs 2 ticks, a grace is 1, two lines are refused.
CONSTANTS
    Ids = {1, 2, 3}
    InitIds = {1}
    ListenIds = {3}
    MaxProgress = 1
    Timed = TRUE
    GraceOn = TRUE
    GraceTicks = 1
    MaxTime = 2
    MaxRefusals = 2
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT IdsNeverReused
INVARIANT AtMostOneOutcome
INVARIANT OutcomeIffDone
INVARIANT PeerOutcomesFromPeer
INVARIANT CancelledByClientOnly
INVARIANT CancelValid
INVARIANT NeverCancelInitialize
INVARIANT ProgressScoped
INVARIANT ListenNeverTimesOut
INVARIANT EndedOnlyListen
INVARIANT GraceOnlyInFlight
INVARIANT TimersAreGraces
INVARIANT TimersBounded
INVARIANT MalformedOnlyIfGraced
INVARIANT NoGraceForInitOrListen
INVARIANT NoGraceForLaterCalls
INVARIANT GraceClearedOnlyByOwnProgress
INVARIANT ProgressProtects
INVARIANT WordsFixed
INVARIANT SoonAfterRefusal
PROPERTY EveryRequestEnds
