\* The code before the fix: the engine compared a member's name as written, so
\* a name the server wrote with an escape matched no field. The model finds it:
\* AgreeOrRefused fails, with the engine reading the field as absent while
\* std.json reads it once. Expected exit 12 (a safety violation).
CONSTANTS
    KeyRead = "raw"
    MaxMembers = 1
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT AgreeOrRefused
