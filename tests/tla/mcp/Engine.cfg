\* Smoke bounds: two servers, three calls (two to server 1), two tries in a row, one host drop.
\* IdleStop FALSE is the engine without the idle stop, so this config costs what it did
\* before it; Engine.idle.cfg checks the idle stop on its own.
CONSTANTS
    Servers = {1, 2}
    Calls = {1, 2, 3}
    Owner <- SmokeOwner
    MaxAttempts = 2
    MaxHost = 1
    IdleStop = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT PermissionBeforeCall
INVARIANT DeniedEndsThere
INVARIANT IdleEndsNothing
INVARIANT LazyConnect
INVARIANT BoundedReconnect
INVARIANT StatusConsistent
INVARIANT AskedHasNeed
INVARIANT RetryOnlyAfterFailure
INVARIANT StayedBeforeFreshTries
PROPERTY Isolation
PROPERTY WaitsForOneStart
PROPERTY EveryCallEnds
PROPERTY NeedServed
PROPERTY RetriesEnd
