\* Stated: a request in flight at a refused line, and silent, ends within the grace. The code before the grace has none (GraceOn = FALSE), so the request waits for its own deadline.
CONSTANTS
    Ids = {1, 2, 3}
    InitIds = {1}
    ListenIds = {3}
    MaxProgress = 1
    Timed = TRUE
    GraceOn = FALSE
    GraceTicks = 1
    MaxTime = 2
    MaxRefusals = 2
SPECIFICATION Spec
INVARIANT SoonAfterRefusal
