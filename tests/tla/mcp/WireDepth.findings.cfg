\* Stated: whatever an entry point accepts, every writer can write. Before this change there was no limit
\* but the engine's (Limit = EngineLimit), so a message 257 levels deep was accepted and a writer aborted.
CONSTANTS
    Limit = 2581
    Capacity = 256
    EngineLimit = 2581
    MaxDepth = 2600
SPECIFICATION Spec
INVARIANTS
    NoWriterOverflow
