\* For the deadlock mutant in mutants.py: every safety invariant except
\* OnlyRunnersHold, which any parent that keeps its slot breaks at once,
\* and only WaitersRun, so a temporal violation names that property.
SPECIFICATION Spec
CONSTANT MaxDepth = 3
CONSTANT MaxNodes = 4
CONSTANT Slots = 1
INVARIANTS
    TypeOK
    SlotsBounded
    TreeBudget
    DepthBounded
    NoOrphan
    AncestorsOutliveDescendants
PROPERTIES
    WaitersRun
