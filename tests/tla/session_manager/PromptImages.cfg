\* Two images, so one can be saved while the other fails, and either can be
\* attached again in a later turn of the source or the fork. Two items per
\* session and three requests reach every planted bug in mutants.py.
CONSTANTS
    Digests = {d1, d2}
    MaxRequests = 3
    MaxItems = 2
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    NoteNamesBlob
    RefHasBlob
    ItemKeepsImages
    RequestSendsAll
