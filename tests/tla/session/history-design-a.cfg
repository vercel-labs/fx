  Turns = 4
  BigTurn = 4
  Big = 3
  Damaged = 0
  Continued = 3
  Budget = 1
  MaxLive = 1
  MaxCrashes = 1
  MaxReloads = 1
  OldClient = FALSE
  Other = "none"
  MaxOther = 0
  Cut <- NoCut
  Design = "a"
  Mutant = "none"
INVARIANTS
  TypeOK
  BottomBounded
  LoadBounded
  TranscriptExact
  BottomIsNewest
  LiveBelowHistory
  TrustedOnly
  WholeTurns
  NoSilentGap
  PromptSeesFullHistory
  OldClientUnchanged
  BusyShowsNothing
