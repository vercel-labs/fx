\* Every safety law of ImageRoute, on traces of the real core. Answered is a
\* liveness property and cannot be judged on a finite trace: here
\* ConformsToSpec makes each reply clear the request it answers, and
\* MCImageRoute.cfg proves Answered over the whole model. TraceData.tla is
\* generated next to this file for each run.
SPECIFICATION TraceSpec
CHECK_DEADLOCK FALSE
INVARIANT
    StartsAtInit
    TypeOK
    Bounded
    VisionImpliesNative
    UnknownNeverInline
    OneSnapshot
    RouteModeCoherent
    NativeExcludesFallback
    NoSilentWithhold
    RequiredWhenPending
    FailExactlyWhenUnroutable
    ResolveOnlyWhenNeeded
    AskedBeforeUnknown
    NotifyOnlyWhenDown
    DecideOnlyWhenReady
    TurnResets
    PendingWaitsForReply
PROPERTY
    ResolveOncePerTurn
    NotifyOncePerTurn
    DuplicateRequestIsQuiet
    StaleReplyIsQuiet
    ConformsToSpec
