\* The reader only scrolls older and the log answers each read with the true
\* count: the reader reaches the start of the log. MaxTokens covers one read per
\* block, so running out of tokens cannot stand in for reaching the start.
CONSTANTS
    MaxSeq = 3
    Ids = {1, 2}
    MaxCycles = 2
    Window = 2
    Step = 1
    Slice = 1
    MaxTokens = 3
    Saved = TRUE
    OnlyOlder = TRUE
SPECIFICATION Spec
INVARIANT
    TypeOK
    HeldIsRecentCycles
    LiveNeverDropped
    DropOnlySaved
    PaintOnceInOrder
    ReprintInOrder
    ReprintSliceBound
    CtrlOWindowBound
    OneReadInFlight
    NoReadWhenUnsaved
    RecoveredFromLog
    DropBetweenTurns
    ScreenHoldsHeld
PROPERTY
    CtrlOReachesStart
