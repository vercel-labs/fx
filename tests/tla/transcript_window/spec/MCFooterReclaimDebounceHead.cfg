\* The head before the debounce repair: SIGTERM and SIGHUP draw the exit frame
\* only when no resize debounce is pending, and a resize starts one during
\* which no frame commits, so a signal inside it ends fx with the rows a surface
\* holds still held. TLC must report ExitKeepsRows violated.
CONSTANTS
    MaxRows = 7
    Burst = 2
    BaseCap = 3
    Extra = 2
    MaxResizes = 1
    Release = "base"
    SignalExits = "debounce_blocked"
SPECIFICATION Spec
INVARIANT
    TypeOK
    FooterAtBottom
    HistoryOnce
    OwedRowsHeld
    ExitKeepsRows
