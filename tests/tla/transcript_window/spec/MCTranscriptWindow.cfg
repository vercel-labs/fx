\* A saved session with every fault: crashes, lost, duplicate, stale and garbage log replies, compactions mid-turn and between turns, resizes during reprints, and session clears (/new, /clear, /resume).
CONSTANTS
    MaxSeq = 3
    Ids = {1, 2}
    MaxCycles = 2
    Window = 2
    Step = 1
    Slice = 1
    MaxTokens = 2
    Saved = TRUE
    OnlyOlder = FALSE
SPECIFICATION Spec
INVARIANT
    TypeOK
    LiveNeverDropped
    DropOnlyOldSession
    PaintOnceInOrder
    ReprintInOrder
    ReprintSliceBound
    CtrlOWindowBound
    OneReadInFlight
    NoReadWhenUnsaved
    RecoveredFromLog
    ScreenHoldsHeld
PROPERTY
    HeldIsCurrentSession
    UpdateIsLocal
    OpenReadsNothing
    StaleReadIgnored
    PaintedOnce
    ReadBounded
    OldSessionDroppedOnChange
    NoDropDuringSession
    CompactionKeepsHistory
    ReprintFinishes
