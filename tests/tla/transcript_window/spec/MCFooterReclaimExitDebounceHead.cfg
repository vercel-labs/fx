\* The head before the exit repair: only the signal close ended a pending resize
\* debounce, during which no frame commits. /quit, suspend, and a fresh session
\* drew their exit frame only when none was pending, so one typed inside the
\* debounce erased the footer with the rows a surface holds still held. TLC must
\* report ExitKeepsRows violated.
CONSTANTS
    MaxRows = 7
    Burst = 2
    BaseCap = 3
    Extra = 2
    MaxResizes = 1
    Release = "base"
    SignalExits = "settle"
    ExitFrames = "signal_only"
SPECIFICATION Spec
INVARIANT
    TypeOK
    FooterAtBottom
    HistoryOnce
    OwedRowsHeld
    ExitKeepsRows
