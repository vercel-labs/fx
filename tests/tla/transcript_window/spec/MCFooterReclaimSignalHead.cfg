\* The head before the signal repair: SIGTERM and SIGHUP restore the terminal
\* at once, so fx ends with the rows a surface holds still held. TLC must
\* report ExitKeepsRows violated.
CONSTANTS
    MaxRows = 7
    Burst = 2
    BaseCap = 3
    Extra = 2
    MaxResizes = 1
    Release = "base"
    SignalExits = "erase"
SPECIFICATION Spec
INVARIANT
    TypeOK
    FooterAtBottom
    HistoryOnce
    OwedRowsHeld
    ExitKeepsRows
