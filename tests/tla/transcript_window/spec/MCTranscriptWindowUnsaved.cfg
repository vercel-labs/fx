\* A --no-save session: no log, so no reads, saves or crashes to resume from.
CONSTANTS
    MaxSeq = 3
    Ids = {1, 2}
    MaxCycles = 2
    Window = 2
    Step = 1
    Slice = 1
    MaxTokens = 2
    Saved = FALSE
    OnlyOlder = FALSE
SPECIFICATION Spec
INVARIANT
    TypeOK
    HeldIsRecentCycles
    LiveNeverDropped
    DropOnlySaved
    PaintOnceInOrder
    ReprintInOrder
    ReprintSliceBound
    CtrlOWindowBound
    OneReadInFlight
    NoReadWhenUnsaved
    RecoveredFromLog
    DropBetweenTurns
    ScreenHoldsHeld
PROPERTY
    UpdateIsLocal
    OpenReadsNothing
    StaleReadIgnored
    PaintedOnce
    PreviousCycleDropped
    ReprintFinishes
