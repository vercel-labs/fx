\* The graph spec-to-code replays edge by edge (--no-save session): three
\* blocks, one live id, one compaction, one read token, a two-block window.
\* Small enough to take every edge; MCTranscriptWindow.cfg covers the rest.
CONSTANTS
    MaxSeq = 3
    Ids = {1}
    MaxCycles = 1
    Window = 2
    Step = 1
    Slice = 1
    MaxTokens = 1
    Saved = FALSE
    OnlyOlder = FALSE
SPECIFICATION Spec
INVARIANT
    TypeOK
    HeldIsRecentCycles
    LiveNeverDropped
    DropOnlySaved
    PaintOnceInOrder
    ReprintInOrder
    ReprintSliceBound
    CtrlOWindowBound
    OneReadInFlight
    NoReadWhenUnsaved
    RecoveredFromLog
    DropBetweenTurns
    ScreenHoldsHeld
