\* Every safety law of TranscriptWindow, on traces of the real core. The
\* liveness properties (PreviousCycleDropped, ReprintFinishes,
\* CtrlOReachesStart) cannot be judged on a finite trace; MCTranscriptWindow.cfg
\* and MCCtrlOReachesStart.cfg prove them over the whole model. The constants
\* are large enough that no trace reaches a bound; code-to-spec.ts sets Saved
\* and the harness config to match each run. TraceData.tla is generated next
\* to this file for each run.
CONSTANTS
    MaxSeq = 400
    Ids = {1, 2, 3, 4, 5, 6}
    MaxCycles = 100
    Window = 3
    Step = 2
    Slice = 2
    MaxTokens = 400
    Saved = TRUE
    OnlyOlder = FALSE
SPECIFICATION TraceSpec
CHECK_DEADLOCK FALSE
INVARIANT
    StartsAtInit
    TypeOK
    HeldIsRecentCycles
    LiveNeverDropped
    DropOnlySaved
    PaintOnceInOrder
    ReprintInOrder
    ReprintSliceBound
    CtrlOWindowBound
    OneReadInFlight
    NoReadWhenUnsaved
    RecoveredFromLog
    DropBetweenTurns
    ScreenHoldsHeld
PROPERTY
    UpdateIsLocal
    OpenReadsNothing
    StaleReadIgnored
    PaintedOnce
    ReadBounded
    ConformsToSpec
