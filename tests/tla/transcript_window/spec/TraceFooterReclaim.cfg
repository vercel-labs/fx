\* footer-runtime-to-spec.ts replaces the CONSTANTS block with the geometry
\* the runtime showed (BaseCap and Extra) and the trace bounds.
CONSTANTS
    MaxRows = 100
    Burst = 40
    BaseCap = 21
    Extra = 9
    MaxResizes = 0
    Release = "base"
SPECIFICATION TraceSpec
INVARIANT
    StartsAtInit
    TypeOK
    FooterAtBottom
    HistoryOnce
    OwedRowsHeld
    ExitKeepsRows
PROPERTY
    ConformsToSpec
