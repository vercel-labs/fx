\* The head before the invalid-anchor repair: SIGTERM and SIGHUP draw the exit
\* frame only from a stable anchor, so after a resize while an alternate screen
\* covers the main one (the anchor invalid, no frame to recover it) fx ends with
\* the rows a surface holds still held. TLC must report ExitKeepsRows violated.
CONSTANTS
    MaxRows = 7
    Burst = 2
    BaseCap = 3
    Extra = 2
    MaxResizes = 1
    Release = "base"
    SignalExits = "stable_only"
SPECIFICATION Spec
INVARIANT
    TypeOK
    FooterAtBottom
    HistoryOnce
    OwedRowsHeld
    ExitKeepsRows
