\* fx before the fix: the margin is subtracted with a checked `-`, so a saved
\* expiry below MinInt + Skew aborts fx. NoAbort catches it.
SPECIFICATION Spec
CONSTANTS
    Providers = {"codex", "grok", "mcp"}
    Expiries <- AllExpiries
    Margins <- AllMargins
    Bound = 128
    Skew = 6
    Now = 60
    ClearAtTake = TRUE
    Saturating = FALSE
    SignOutBadReply = TRUE
    SaveRotated = TRUE
    SendAdd = "saturate"
INVARIANTS
    TypeOK
    NoDoubleFree
    NoAbort
    NoLeak
    StatusReadsExpiry
    SendReadsExpiry
    BadReplySignsOut
    RotatedTokenSaved
CHECK_DEADLOCK FALSE
