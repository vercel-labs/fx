\* Planted bug: a refresh that rotated the token saves the old one. RotatedTokenSaved catches it.
SPECIFICATION Spec
CONSTANTS
    Providers = {"codex", "grok"}
    Expiries <- AllExpiries
    Bound = 128
    Skew = 6
    Now = 60
    ClearAtTake = TRUE
    Saturating = TRUE
    SignOutBadReply = TRUE
    SaveRotated = FALSE
INVARIANTS
    TypeOK
    NoDoubleFree
    NoAbort
    NoLeak
    StatusReadsExpiry
    BadReplySignsOut
    RotatedTokenSaved
CHECK_DEADLOCK FALSE
