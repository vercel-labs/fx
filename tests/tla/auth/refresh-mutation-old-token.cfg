\* Planted bug: a refresh that rotated the token saves the old one. RotatedTokenSaved catches it.
SPECIFICATION Spec
CONSTANTS
    Providers = {"codex", "grok", "mcp"}
    Expiries <- AllExpiries
    Margins <- AllMargins
    Bound = 128
    Skew = 6
    Now = 60
    ClearAtTake = TRUE
    Saturating = TRUE
    SignOutBadReply = TRUE
    SaveRotated = FALSE
    SendAdd = "saturate"
INVARIANTS
    TypeOK
    NoDoubleFree
    NoAbort
    NoLeak
    StatusReadsExpiry
    SendReadsExpiry
    BadReplySignsOut
    RotatedTokenSaved
CHECK_DEADLOCK FALSE
