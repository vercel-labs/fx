\* fx before this fix: an MCP request adds the saved skew to the clock with a
\* checked `+`, so a skew near MaxInt aborts fx. NoAbort catches it.
SPECIFICATION Spec
CONSTANTS
    Providers = {"codex", "grok", "mcp"}
    Expiries <- AllExpiries
    Margins <- AllMargins
    Bound = 128
    Skew = 6
    Now = 60
    ClearAtTake = TRUE
    Saturating = TRUE
    SignOutBadReply = TRUE
    SaveRotated = TRUE
    SendAdd = "plain"
INVARIANTS
    TypeOK
    NoDoubleFree
    OneHolder
    NoAbort
    NoLeak
    StatusReadsExpiry
    SendReadsExpiry
    BadReplySignsOut
    RotatedTokenSaved
CHECK_DEADLOCK FALSE
