\* Planted bug: the sum wraps (`+%`) instead of stopping at the limit, so a skew
\* at MaxInt reads a login that is hours from its expiry as not due.
\* SendReadsExpiry catches it.
SPECIFICATION Spec
CONSTANTS
    Providers = {"codex", "grok", "mcp"}
    Expiries <- AllExpiries
    Margins <- AllMargins
    Bound = 128
    Skew = 6
    Now = 60
    ClearAtTake = TRUE
    Saturating = TRUE
    SignOutBadReply = TRUE
    SaveRotated = TRUE
    SendAdd = "wrap"
INVARIANTS
    TypeOK
    NoDoubleFree
    OneHolder
    NoAbort
    NoLeak
    StatusReadsExpiry
    SendReadsExpiry
    BadReplySignsOut
    RotatedTokenSaved
CHECK_DEADLOCK FALSE
