\* fx before the fix: the rotated token stays in the reply until the lifetime
\* check passes, so a failed check frees it twice. NoDoubleFree catches it.
SPECIFICATION Spec
CONSTANTS
    Providers = {"codex", "grok"}
    Expiries <- AllExpiries
    Bound = 128
    Skew = 6
    Now = 60
    ClearAtTake = FALSE
    Saturating = TRUE
    SignOutBadReply = TRUE
    SaveRotated = TRUE
INVARIANTS
    TypeOK
    NoDoubleFree
    NoAbort
    NoLeak
    StatusReadsExpiry
    BadReplySignsOut
    RotatedTokenSaved
CHECK_DEADLOCK FALSE
