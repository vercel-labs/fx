\* Ideal conditions: every fetch succeeds, no process dies, no file is
\* damaged and the clock never jumps. Two processes, two identities, sign-in
\* switches included.
SPECIFICATION Spec
CONSTANTS
    Procs = {p1, p2}
    Idents = {a, b}
    None = None
    FLOOR = 1
    TIMER = 3
    DAY = 4
    MAXT = 6
    SKEW = 0
    HOSTILE = FALSE
    CORRUPT = FALSE
    MAXFAULTS = 2
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    ShowsOwnIdentity
    OwedNeverWaitsOnFloor
    RAlwaysWorks
    TodayIsToday
    FinishedOncePerDay
PROPERTIES
    FetchRules
    OpenRespectsFloor
    CacheNeverRegresses
    SuccessShowsToday
    FinishedStaysShown
