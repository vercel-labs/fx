\* Non-ideal conditions on the drivable spec: failed fetches, processes
\* killed and restarted, an unreadable cache file and one backward clock
\* correction. Every property must still hold.
SPECIFICATION DriveSpec
CONSTANTS
    Procs = {p1, p2}
    Idents = {a, b}
    None = None
    FLOOR = 1
    TIMER = 3
    DAY = 4
    MAXT = 5
    SKEW = 2
    HOSTILE = TRUE
    CORRUPT = TRUE
    MAXFAULTS = 2
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    ShowsOwnIdentity
    OwedNeverWaitsOnFloor
    RAlwaysWorks
    TodayIsToday
    FinishedOncePerDay
PROPERTIES
    FetchRules
    OpenRespectsFloor
    CacheNeverRegresses
    SuccessShowsToday
    FinishedStaysShown
