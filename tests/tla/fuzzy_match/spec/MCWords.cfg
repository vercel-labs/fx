\* One name field and queries of up to four characters: two words whose tiers
\* differ, such as `ab a` against `a1b`, so the worse word decides the item
\* (R1, R5). The other name configs stop at three characters, where a word that
\* matches only fuzzily cannot sit next to a second word.
SPECIFICATION Spec
CONSTANTS
    Alphabet = {"a", "b", "1", "s+20"}
    MaxQuery = 4
    MaxField = 3
    Kinds <- OneName
INVARIANT
    TypeOK
    MatchIsDeclarative
    Narrowing
    KeepsTokenMatches
