\* A word-and-letters limit of two characters (R12), so queries of three
\* characters cross it: `a b` matches the name `a-b` by words under the limit
\* and only as typed over it, against a name and a text field.
SPECIFICATION Spec
CONSTANTS
    Alphabet = {"a", "b", "s+20", "s+2d"}
    MaxQuery = 3
    MaxField = 2
    Kinds <- NameAndText
    MaxFuzzyChars <- SmallFuzzyLimit
INVARIANT
    TypeOK
    MatchIsDeclarative
    Narrowing
    KeepsSubstringMatches
    KeepsTokenMatches
    LongQueriesMatchAsTyped
    PunctuationMatchesAsTyped
    CaseInsensitive
