\* One name field: the engine's whole step-by-step definition against the
\* declarative rules, and every law about one name field. The alphabet has a
\* letter in both cases, a second letter, a digit, a hyphen, a space, and a
\* non-ASCII letter, so it reaches every rule.
SPECIFICATION Spec
CONSTANTS
    Alphabet = {"a", "A", "b", "1", "s+2d", "s+20", "u+e9"}
    MaxQuery = 3
    MaxField = 3
    Kinds <- OneName
INVARIANT
    TypeOK
    RunIsDeclarative
    GreedyIsComplete
    MatchIsDeclarative
    Narrowing
    PunctuationMatchesAsTyped
    KeepsSubstringMatches
    KeepsTokenMatches
    CaseInsensitive
