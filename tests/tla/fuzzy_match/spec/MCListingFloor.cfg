\* Two items whose fields hold two characters, so one item can match a query
\* as typed while another matches it only by words: `a-` is exact for `a-`
\* and words for `a`. MCListing's one-character fields cannot, so this is the
\* config that shows a filtered listing preferring as-typed matches (R11).
SPECIFICATION Spec
CONSTANTS
    Alphabet = {"a", "s+2d"}
    MaxQuery = 2
    MaxField = 2
    NumItems = 2
INVARIANT
    TypeOK
    ListingSortedStable
    LegacyRowsFirst
    FilteredKeepsOrder
    FilteredPrefersAsTyped
