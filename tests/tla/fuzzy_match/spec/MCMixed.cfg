\* A name field and a text field: field kinds, the lowest-index tiebreak, and
\* that adding a field never lowers a tier.
SPECIFICATION Spec
CONSTANTS
    Alphabet = {"a", "A", "b", "s+2d", "s+20"}
    MaxQuery = 3
    MaxField = 2
    Kinds <- NameAndText
INVARIANT
    TypeOK
    MatchIsDeclarative
    Narrowing
    PunctuationMatchesAsTyped
    KeepsSubstringMatches
    KeepsTokenMatches
    CaseInsensitive
    MoreFieldsNeverWorse
