\* One text field: text fields never give exact, prefix, or a fuzzy match.
SPECIFICATION Spec
CONSTANTS
    Alphabet = {"a", "A", "b", "1", "s+2d", "s+20", "u+e9"}
    MaxQuery = 3
    MaxField = 3
    Kinds <- OneText
INVARIANT
    TypeOK
    MatchIsDeclarative
    Narrowing
    PunctuationMatchesAsTyped
    KeepsSubstringMatches
    KeepsTokenMatches
    CaseInsensitive
    TextNeverFuzzy
