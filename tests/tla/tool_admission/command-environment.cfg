\* The design: the packet names the environment, the shell, and whether
\* startup definitions apply, and an unnamed shell is held for incomplete
\* review evidence without a reviewer call.
SPECIFICATION Spec
CONSTANTS
    Commands = {"routine", "reviewed"}
    Shells = {"zsh", "bash", "none"}
    MaxCalls = 2
    Bug = "none"
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    ReviewerSeesInterpreter
    StartupDisclosed
    UnnamedShellNeverRuns
    CompleteOnlyWhenNamed
    ReviewSetUnchanged
    OneReviewPerCall
