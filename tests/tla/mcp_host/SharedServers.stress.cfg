\* Stress: two sessions, calls 1 and 3 from "a" and call 2 from "b", both versions, two owner crashes.
CONSTANTS
    Sessions = {"a", "b"}
    Calls = {1, 2, 3}
    CallSession <- TwoSessions
    Versions = {"2025", "2026"}
    MaxCrash = 2
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT OneOwner
INVARIANT QuestionToCaller
INVARIANT IdleEndsNothing
INVARIANT ExitEndsOwnOnly
PROPERTY LostNotRetried
PROPERTY EveryCallEnds
PROPERTY ServerFollowsSessions
PROPERTY ServerFollowsUsers
