\* Smoke: one profile server, one project server that never answers; one host.
CONSTANTS
    Servers = {"a", "p"}
    Project = {"p"}
    Reachable = {"a"}
    NeedsAuth = {}
    MaxReloads = 3
    MaxLeases = 1
SPECIFICATION Spec
INVARIANTS
    TypeOK
    HeldNeverSpawned
    StartedAfterFirstFrame
    RefreshedLineAgrees
    QuitSignalsEveryServer
    RemovedNotRunning
    OneProcessPerServer
    AtMostOneOwner
PROPERTIES
    KeptServersKeepRunning
    ApprovedServersSettle
    EveryStopEnds
