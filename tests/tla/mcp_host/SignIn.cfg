\* Smoke: two logins, two hosts, one lease, a loopback (not bridged) sign-in.
CONSTANTS
    MaxLogins = 2
    MaxHosts = 2
    MaxLeases = 1
    Bridge = FALSE
    CheckFirst = TRUE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    RedeemOnlyLiveState
    ListenerTakesOnlyItsOwn
    NoListenerWithoutHost
    OneSignInPerHost
    IndicatorImpliesListener
    OneSignInPerServer
    FlowHasListener
    NoPendingWithoutHost
    SignedInOnlyAfterCheck
    NoticeMatchesAnswer
    RefusedNeverSaved
    NeverTakeRefused
    AnsweredKeptAndReported
    HeldNeverReplaced
    LoggedOutNeverSaved
PROPERTIES
    KeptSignInGoesOn
    EveryLoginEnds
    IndicatorClears
    ConfirmingEnds
