\* Stated: no add or remove writes a profile whose servers key looks misspelled. A dry run before `update` reads the file outside the lock, so a key that appears in between is written over. fx does not use that design: the check runs inside `update`, under the lock.
CONSTANTS
    Names = {"a"}
    Classes = {"ok", "bad", "auth"}
    Checked = TRUE
    KeyScan = "complete"
    GuardRemove = TRUE
    Atomic = FALSE
SPECIFICATION Spec
INVARIANTS
    NoRewriteOfMisspelled
