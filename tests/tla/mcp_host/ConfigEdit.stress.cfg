\* Stress: three servers, and no deep file state: NoWriteOfDeep is about one file, and the smoke config checks it. Safety only.
CONSTANTS
    Names = {"a", "b", "c"}
    Classes = {"ok", "bad", "auth"}
    Checked = TRUE
    KeyScan = "complete"
    GuardRemove = TRUE
    Atomic = TRUE
    Deep = FALSE
SPECIFICATION Spec
INVARIANTS
    AddedIsLoaded
    RefusedLeavesFile
    NoRewriteOfMisspelled
    NoWriteOfDeep
    HintMatchesHeldName
    OthersKept
    InspectKeepsGood
    InspectNotesSkipped
    TypeOK
