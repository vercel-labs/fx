\* Stated: in full access no rule hides or blocks an MCP tool on any path. Today's code splits: search and a small server's open use the mode's rules, every other path (open of a tool, run, fx mcp call, the per-step refresh, and a subagent's integrations list) reads the host's rules in every mode.
CONSTANTS
    Tools = {"a", "b"}
    OwnRules = {"open_tool", "run", "bridge_list", "bridge_search", "bridge_help", "bridge_call", "refresh", "integrations"}
SPECIFICATION Spec
INVARIANTS
    FullAccessIgnoresRules
