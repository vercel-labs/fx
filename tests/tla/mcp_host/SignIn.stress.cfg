\* Stress: three logins, three hosts, a bridged sign-in. Safety only.
CONSTANTS
    MaxLogins = 3
    MaxHosts = 3
    MaxLeases = 1
    Bridge = TRUE
    CheckFirst = TRUE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    RedeemOnlyLiveState
    ListenerTakesOnlyItsOwn
    NoListenerWithoutHost
    OneSignInPerHost
    IndicatorImpliesListener
    OneSignInPerServer
    FlowHasListener
    NoPendingWithoutHost
    SignedInOnlyAfterCheck
    NoticeMatchesAnswer
    RefusedNeverSaved
    NeverTakeRefused
    AnsweredKeptAndReported
    HeldNeverReplaced
    LoggedOutNeverSaved
PROPERTIES
    KeptSignInGoesOn
