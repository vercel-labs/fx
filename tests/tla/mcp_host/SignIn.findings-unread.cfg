\* Stated: a refused new login is refused even when fx couldn't read its saved logins. If the branch added for an unreadable store (PR #1793) answered the 401 to the check request before the sign-in did, it would swallow the refusal: the sign-in would end by its timeout with the refused token kept and reported as signed in.
CONSTANTS
    MaxLogins = 2
    MaxHosts = 2
    MaxLeases = 1
    Bridge = FALSE
    CheckFirst = TRUE
    UnreadFirst <- UnreadFirstYes
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    RefusedNeverSaved
