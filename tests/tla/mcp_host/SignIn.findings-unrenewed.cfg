\* Stated: a new login the server refuses is refused even when the refresh its 401 starts gets no usable answer (a 5xx, a 429, no answer). If the host read that failed refresh as a check that couldn't be made, as fx did before, the sign-in would end with the refused token saved and reported as signed in.
CONSTANTS
    MaxLogins = 2
    MaxHosts = 2
    MaxLeases = 1
    Bridge = FALSE
    CheckFirst = TRUE
    RefreshFailAsUnchecked <- RefreshFailAsUncheckedYes
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    RefusedNeverSaved
