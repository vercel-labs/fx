\* Stated: no add or remove writes a profile whose servers key looks misspelled, whatever its size. The scan fx runs at load gives up on a big file, so an edit that used it would write one: the person ruled that design out.
CONSTANTS
    Names = {"a"}
    Classes = {"ok", "bad", "auth"}
    Checked = TRUE
    KeyScan = "bounded"
    GuardRemove = TRUE
    Atomic = TRUE
SPECIFICATION Spec
INVARIANTS
    NoRewriteOfMisspelled
