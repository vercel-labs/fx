\* Stated: no add or remove writes a profile whose servers key looks misspelled, whatever its size. The scan fx runs at load gives up on a big file, so an edit that used it would write one. fx does not use that design: its check reads every key.
CONSTANTS
    Names = {"a"}
    Classes = {"ok", "bad", "auth"}
    Checked = TRUE
    KeyScan = "bounded"
    GuardRemove = TRUE
    Atomic = TRUE
    Deep = FALSE
SPECIFICATION Spec
INVARIANTS
    NoRewriteOfMisspelled
