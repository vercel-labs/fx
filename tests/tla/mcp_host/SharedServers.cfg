\* Two sessions, one call each, both protocol versions, one owner crash.
CONSTANTS
    Sessions = {"a", "b"}
    Calls = {1, 2}
    CallSession <- TwoSessions
    Versions = {"2025", "2026"}
    MaxCrash = 1
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT OneOwner
INVARIANT QuestionToCaller
INVARIANT IdleEndsNothing
INVARIANT ExitEndsOwnOnly
INVARIANT ReadyMeansServing
PROPERTY LostNotRetried
PROPERTY EveryCallEnds
PROPERTY ServerFollowsSessions
PROPERTY ServerFollowsUsers
PROPERTY WaitEnds
