\* Stated: "Signed in" comes only after the server answered a request with the new login. fx before the fix (CheckFirst FALSE) reports it as soon as the token exchange ends, so a login the server refuses is reported as signed in (the ClickState report).
CONSTANTS
    MaxLogins = 2
    MaxHosts = 2
    MaxLeases = 1
    Bridge = FALSE
    CheckFirst = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    SignedInOnlyAfterCheck
