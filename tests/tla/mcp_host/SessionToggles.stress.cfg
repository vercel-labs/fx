\* Two independently captured views share one project server across two roots.
\* The smoke config covers two-server independence; this bound adds a second view.
CONSTANTS
    Roots = {"first", "second"}
    Servers = {"shared"}
    Project = {"shared"}
    MaxViews = 2
    NoOverride = NoOverride
SPECIFICATION Spec
INVARIANTS
    TypeOK
    DefaultFollowsSaved
    OverrideWins
    OtherRootUnaffected
    RuntimeUnionWhenCurrent
    RawDisabledCanEnable
    RootGateHolds
    ProjectTrustHolds
    ChildWithinCapturedAccess
    ChildWithinProfile
    ChildWithinRoot
    ChildIntersectionComplete
    NoApprovalBypass
    ApprovedCallsAllowed
PROPERTIES
    ToggleIsRootLocal
    RootResetIsLocal
    ReloadPreservesOverrides
