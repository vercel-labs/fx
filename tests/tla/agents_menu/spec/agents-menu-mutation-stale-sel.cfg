\* Planted: the highlight stays on an agent that closed. SelListed must catch it.
CONSTANTS
    InstanceOrder <- MCInstanceOrder
    Subs <- MCSubs
    Parent <- MCParent
    InitOrder <- MCInitOrder
    EnvEvents = TRUE
    Mutation = "stale_sel"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT
    TypeOK
    WellFormed
    OnScreenListed
    LastInstanceStays
    SelListed
    ClosedNoSel
    ArmedIsSel
PROPERTY
    ScreenOnlyOnEnter
    EnterShowsSelection
    OpensOnScreen
    SelectionKept
    FallbackToScreen
    MoveOneRow
