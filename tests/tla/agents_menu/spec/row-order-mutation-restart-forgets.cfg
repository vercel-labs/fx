CONSTANTS
    StartOrder <- MCStartOrder
    MaxReplies = 3
    Mutation = "restart_forgets"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT
    TypeOK
    IdleRowIsApplied
    PlaceIgnoresEnd
PROPERTY
    PlaceChangesWithLabel
    EndIsOfAppliedTurn
    RestartKeepsLabel
