\* Every rule of AgentsMenu, on runs of the built fx. binary-to-spec.ts writes
\* TraceData.tla next to this file for each run, with the run's instances and
\* subagents.
CONSTANTS
    InstanceOrder <- TraceInstanceOrder
    Subs <- TraceSubs
    Parent <- TraceParent
    InitOrder <- TraceInitOrder
    EnvEvents = TRUE
    Mutation = "none"
SPECIFICATION TraceSpec
CHECK_DEADLOCK FALSE
INVARIANT
    StartsAtInit
    TypeOK
    WellFormed
    OnScreenListed
    LastInstanceStays
    SelListed
    ClosedNoSel
    ArmedIsSel
PROPERTY
    ConformsToSpec
    ScreenOnlyOnEnter
    EnterShowsSelection
    OpensOnScreen
    SelectionKept
    FallbackToScreen
    MoveOneRow
