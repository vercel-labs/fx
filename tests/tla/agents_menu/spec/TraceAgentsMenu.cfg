\* Every rule of AgentsMenu, on runs of the built fx. binary-to-spec.ts writes
\* TraceData.tla next to this file for each run, with the run's instances and
\* subagents.
CONSTANTS
    InstanceOrder <- TraceInstanceOrder
    Subs <- TraceSubs
    Parent <- TraceParent
    InitOrder <- TraceInitOrder
    EnvEvents = TRUE
    SearchKeys = TRUE
    Mutation = "none"
SPECIFICATION TraceSpec
CHECK_DEADLOCK FALSE
INVARIANT
    StartsAtInit
    TypeOK
    WellFormed
    OnScreenListed
    LastInstanceStays
    SelListed
    ClosedNoSel
    SearchHides
    ArmedIsSel
    OriginListed
PROPERTY
    ConformsToSpec
    PreviewOnMove
    PreviewOnSearch
    UpOnTopCloses
    CloseShowsRowAbove
    EnterShowsSelection
    BackToOrigin
    ScreenOnlyOnKeys
    OpensOnScreen
    OriginKept
    SelectionKept
    FallbackToScreen
    MoveOneRow
    RunNeverCloses
