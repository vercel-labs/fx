\* Planted: the label follows the worker flag alone, so a finished turn that is not applied shows idle and is placed by its older history. IdleRowIsApplied must catch it.
CONSTANTS
    StartOrder <- MCStartOrder
    MaxReplies = 3
    Mutation = "worker_flag"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT
    TypeOK
    IdleRowIsApplied
PROPERTY
    PlaceChangesWithLabel
