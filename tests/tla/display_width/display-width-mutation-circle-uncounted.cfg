\* Planted bug: the painter writes the dotted circle for a mark with no base,
\* but the layout still counts zero cells for it, so the cursor, the row end,
\* and a wrap are one cell short of where the terminal drew the text.
SPECIFICATION Spec
CONSTANTS
    Rule = "fixed"
    MaxLen = 5
    Cols = 3
    Margin = "fixed"
    Bare = "dotted-uncounted"
    Limit = "drop"
    Cap = 9
INVARIANTS
    TypeOK
    RowAligned
