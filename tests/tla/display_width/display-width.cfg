\* The change: Thai nonspacing marks measure zero cells, and the marks on a
\* character whose cell ends at the right margin reach the screen. Rows of
\* three cells make five units wrap.
SPECIFICATION Spec
CONSTANTS
    Rule = "fixed"
    MaxLen = 5
    Cols = 3
    Margin = "fixed"
INVARIANTS
    TypeOK
    CursorAligned
    RowAligned
    StopsAtCells
    MarksShown
