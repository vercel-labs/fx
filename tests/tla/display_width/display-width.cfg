\* The change: Thai nonspacing marks measure zero cells, and the marks on a
\* character whose cell ends at the right margin reach the screen. A mark with
\* no base takes a cell of its own on a dotted circle, and a cell drops the
\* marks past its limit and never fails a step. Rows of three cells make five
\* units wrap, and the limit is scaled down to nine bytes so that it binds.
SPECIFICATION Spec
CONSTANTS
    Rule = "fixed"
    MaxLen = 5
    Cols = 3
    Margin = "fixed"
    Bare = "dotted"
    Limit = "drop"
    Cap = 9
INVARIANTS
    TypeOK
    CursorAligned
    RowAligned
    StopsAtCells
    MarksShown
    Alive
    CellWithinCap
