\* The change in a window three columns wide: the row has one content cell. A
\* one-cell character keeps its marks, the next one wraps with its own, and a
\* two-cell character that cannot fit is not drawn and drops its marks.
SPECIFICATION Spec
CONSTANTS
    Rule = "fixed"
    MaxLen = 5
    Cols = 1
    Margin = "fixed"
INVARIANTS
    TypeOK
    CursorAligned
    RowAligned
    StopsAtCells
    MarksShown
