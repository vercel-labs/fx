\* The change in a window three columns wide: the row has one content cell. A
\* one-cell character keeps its marks, the next one wraps with its own, a
\* mark with no base takes the cell on its circle, and a two-cell character
\* that cannot fit is not drawn and drops its marks.
SPECIFICATION Spec
CONSTANTS
    Rule = "fixed"
    MaxLen = 5
    Cols = 1
    Margin = "fixed"
    Bare = "dotted"
    Limit = "drop"
    Cap = 9
INVARIANTS
    TypeOK
    CursorAligned
    RowAligned
    StopsAtCells
    MarksShown
    Alive
    CellWithinCap
