\* This change's head before the repair: only the first unit of the draft, or
\* of a line, is a mark with no base, so a mark after a zero-width character
\* (U+200B, U+200D, U+FEFF) is not bare, measures zero cells, and lands on the
\* prompt's space cell. The rest is the change.
SPECIFICATION Spec
CONSTANTS
    Rule = "fixed"
    MaxLen = 5
    Cols = 3
    Margin = "fixed"
    Bare = "first-unit"
    Limit = "drop"
    Cap = 9
INVARIANTS
    TypeOK
    MarksShown
