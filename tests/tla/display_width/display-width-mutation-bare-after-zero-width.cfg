\* Planted bug: a mark is bare when the unit before it is a zero-width
\* character, whatever comes before that, so a mark that sits on a base
\* through a zero-width character gets a circle in the middle of the row.
SPECIFICATION Spec
CONSTANTS
    Rule = "fixed"
    MaxLen = 5
    Cols = 3
    Margin = "fixed"
    Bare = "after-zero-width"
    Limit = "drop"
    Cap = 9
INVARIANTS
    TypeOK
    MarksShown
