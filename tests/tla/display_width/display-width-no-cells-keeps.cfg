\* Planted bug: in a window two columns wide or narrower the row has no content
\* cells, and the row builder returns before it sets its flag for a unit it
\* cannot draw, so the marks of every undrawn character land on the prefix
\* cell.
SPECIFICATION Spec
CONSTANTS
    Rule = "fixed"
    MaxLen = 5
    Cols = 0
    Margin = "cell-less-keeps"
INVARIANTS
    TypeOK
    MarksShown
