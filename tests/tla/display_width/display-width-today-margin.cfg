\* fx before the change at the right margin, with the widths fixed: the row
\* builder dropped the zero-width units after a full row, so the marks on a
\* character in the last column vanished, Latin marks included.
SPECIFICATION Spec
CONSTANTS
    Rule = "fixed"
    MaxLen = 5
    Cols = 3
    Margin = "row-drops"
    Bare = "dotted"
    Limit = "drop"
    Cap = 9
INVARIANTS
    TypeOK
    MarksShown
