\* fx before the change, a mark with no base: it measures zero cells and is
\* written onto the prompt's space cell, where it joins the prompt instead of
\* getting a cell and a circle of its own. The rest is the change.
SPECIFICATION Spec
CONSTANTS
    Rule = "fixed"
    MaxLen = 5
    Cols = 3
    Margin = "fixed"
    Bare = "joins-prefix"
    Limit = "drop"
    Cap = 9
INVARIANTS
    TypeOK
    MarksShown
