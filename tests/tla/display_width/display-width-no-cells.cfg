\* The change in a window two columns wide or narrower: the row has no content
\* cells, so it draws no unit and no mark, and the cursor, row end, and cursor
\* stops still follow the terminal's columns.
SPECIFICATION Spec
CONSTANTS
    Rule = "fixed"
    MaxLen = 5
    Cols = 0
    Margin = "fixed"
INVARIANTS
    TypeOK
    CursorAligned
    RowAligned
    StopsAtCells
    MarksShown
