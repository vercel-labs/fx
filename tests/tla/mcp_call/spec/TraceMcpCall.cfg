\* Every safety law of McpCall, on traces of the real core. Drained is a
\* liveness property and cannot be judged on a finite trace: here
\* ConformsToSpec makes each recorded answer move its request on, and
\* MCMcpCall.cfg proves Drained over the whole model. MaxIds only bounds the
\* model's requests per process, so it is set above any trace's length.
\* TraceData.tla is generated next to this file for each run.
CONSTANTS
    MaxInFlight = 2
    MaxIds = 64
SPECIFICATION TraceSpec
CHECK_DEADLOCK FALSE
INVARIANT
    StartsAtInit
    TypeOK
    Bounded
    IdsBelowNext
    EffectsCarryEntryOwner
    LiveWorkHasOwner
    ClosedIsQuiet
    CrashResets
PROPERTY
    AdmitOnlyValid
    RefusalsAreQuiet
    FreshIds
    CallOnlyFromAuthorizing
    StagesOnlyAdvance
    OneReplyPerRequest
    ReplyMatchesOutcome
    StaleIsQuiet
    DroppedStateIsLogged
    ConformsToSpec
