\* Every law of McpCall.tla over its whole state space with small constants:
\* two requests in flight, so a third finds the bridge busy, and three ids per
\* process, so ids are issued, retired, and checked for reuse. More specific
\* invariants come first, since TLC names the first one a state breaks.
CONSTANTS
    MaxInFlight = 2
    MaxIds = 3
SPECIFICATION Spec
INVARIANT
    TypeOK
    Bounded
    IdsBelowNext
    EffectsCarryEntryOwner
    LiveWorkHasOwner
    ClosedIsQuiet
    CrashResets
PROPERTY
    AdmitOnlyValid
    RefusalsAreQuiet
    FreshIds
    CallOnlyFromAuthorizing
    StagesOnlyAdvance
    OneReplyPerRequest
    ReplyMatchesOutcome
    StaleIsQuiet
    DroppedStateIsLogged
    Drained
