\* fx before the change, which waited and resent a malformed reply as a server failure. Searches are left out so only the stall rule can catch it; malformed-tool-call-mutation-search-reconcile covers them.
SPECIFICATION Spec
CONSTANTS
    Limits = {0, 1, 2}
    MaxRequests = 7
    ReplyKinds = {"tool", "text", "malformed", "malformed_bare", "transient"}
    Bug = "today"
CONSTRAINT Bounded
INVARIANTS
    TypeOK
    MalformedNeverRuns
    FeedbackOnlyAfterMalformed
    FeedbackRightAway
    FeedbackKeepsTools
    ServerFailuresWait
    SearchKeepsTools
    ReconcileMalformedStops
    EndsAfterThird
    EveryStallGetsFeedback
    StepsBounded
