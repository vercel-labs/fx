\* The second fix of #809: a contraction stem counts as English before any ending, as in Turkish "Can'a", and the clause splitter knows only ASCII spaces (see check.sh).
SPECIFICATION Spec
CONSTANTS
    Rule = "fixed"
    Bug = "second_cut"
    MaxRequests = 4
    AllowUnmarked = FALSE
CONSTRAINT Bounded
INVARIANTS
    TypeOK
    RequestedLanguageAccepted
    EnglishGuardKept
    OneCorrection
    CallsKept
    FailOnlyAfterCorrection
