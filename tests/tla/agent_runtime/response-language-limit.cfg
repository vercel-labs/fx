\* The known limits: a request that runs into the English with no punctuation, has only clauses of fewer than three words, has a stray backtick before its words, or shares only "the", "that", or a capital "I" with English.
SPECIFICATION Spec
CONSTANTS
    Rule = "fixed"
    Bug = "none"
    MaxRequests = 4
    AllowUnmarked = TRUE
CONSTRAINT Bounded
INVARIANTS
    TypeOK
    RequestedLanguageAccepted
    EnglishGuardKept
    OneCorrection
    CallsKept
    FailOnlyAfterCorrection
