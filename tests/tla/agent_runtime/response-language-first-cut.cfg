\* The first fix of #809: the letter scan stops at a lead byte that claims too many bytes and ignores combining accents, and the word list has words that other languages use (see check.sh).
SPECIFICATION Spec
CONSTANTS
    Rule = "fixed"
    Bug = "first_cut"
    MaxRequests = 4
    AllowUnmarked = FALSE
CONSTRAINT Bounded
INVARIANTS
    TypeOK
    RequestedLanguageAccepted
    EnglishGuardKept
    OneCorrection
    CallsKept
    FailOnlyAfterCorrection
