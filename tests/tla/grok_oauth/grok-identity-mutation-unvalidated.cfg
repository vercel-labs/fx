\* Planted bug: a Team principal_id is saved without the account id check. SavedAccountValid catches it on a sign-in.
SPECIFICATION Spec
CONSTANTS
    Cmds = {"login", "login_refresh"}
    Kinds = {"user", "opaque", "team", "team_bad_id"}
    TeamClaim = TRUE
    RefreshFields = "team"
    ValidateTeamId = FALSE
    UserFromClaim = FALSE
INVARIANTS
    TypeOK
    PersonalUsesUserinfo
    UsableSignInCompletes
    SavedAccountValid
    SignInNamesPrincipal
    BadTeamIdRefused
    NoTeamTokenToUserinfo
    RefreshKeepsAccount
    PersonalRefreshOmitsFields
    KillKeepsLogin
    UnusableSavedTeamRetired
CHECK_DEADLOCK FALSE
