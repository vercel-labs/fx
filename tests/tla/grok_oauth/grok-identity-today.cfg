\* fx before the fix: every account is named from userinfo, so a Team sign-in fails. UsableSignInCompletes catches it.
SPECIFICATION Spec
CONSTANTS
    Cmds = {"login", "login_refresh"}
    Kinds = {"user", "opaque", "team"}
    TeamClaim = FALSE
    RefreshFields = "none"
    ValidateTeamId = TRUE
    UserFromClaim = FALSE
INVARIANTS
    TypeOK
    PersonalUsesUserinfo
    UsableSignInCompletes
    SavedAccountValid
    SignInNamesPrincipal
    BadTeamIdRefused
    NoTeamTokenToUserinfo
    RefreshKeepsAccount
    PersonalRefreshOmitsFields
    KillKeepsLogin
    UnusableSavedTeamRetired
CHECK_DEADLOCK FALSE
