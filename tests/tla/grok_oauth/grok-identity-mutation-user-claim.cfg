\* Planted bug: a personal account is named from its principal_id claim instead of userinfo. PersonalUsesUserinfo catches it.
SPECIFICATION Spec
CONSTANTS
    Cmds = {"login", "login_refresh", "refresh", "refresh_killed", "fresh"}
    Kinds = {"user", "opaque", "team", "team_bad_id"}
    TeamClaim = TRUE
    RefreshFields = "team"
    ValidateTeamId = TRUE
    UserFromClaim = TRUE
INVARIANTS
    TypeOK
    PersonalUsesUserinfo
    UsableSignInCompletes
    SavedAccountValid
    SignInNamesPrincipal
    BadTeamIdRefused
    NoTeamTokenToUserinfo
    RefreshKeepsAccount
    PersonalRefreshOmitsFields
    KillKeepsLogin
    UnusableSavedTeamRetired
CHECK_DEADLOCK FALSE
