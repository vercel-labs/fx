\* fx before the fix, refresh only: the form sends no principal, so a Team login is refreshed into the personal account and retired. RefreshKeepsAccount catches it.
SPECIFICATION Spec
CONSTANTS
    Cmds = {"login", "login_refresh", "refresh", "refresh_killed", "fresh"}
    Kinds = {"user", "opaque", "team", "team_bad_id"}
    TeamClaim = TRUE
    RefreshFields = "none"
    ValidateTeamId = TRUE
    UserFromClaim = FALSE
INVARIANTS
    TypeOK
    PersonalUsesUserinfo
    UsableSignInCompletes
    SavedAccountValid
    SignInNamesPrincipal
    BadTeamIdRefused
    NoTeamTokenToUserinfo
    RefreshKeepsAccount
    PersonalRefreshOmitsFields
    KillKeepsLogin
    UnusableSavedTeamRetired
CHECK_DEADLOCK FALSE
