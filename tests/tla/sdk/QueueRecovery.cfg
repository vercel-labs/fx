\* libfx with the fix: it records the "libfx" namespace on run_created, and
\* its route acks a message with no prompt at once.
SPECIFICATION Spec
CONSTANTS
    LibfxRuns = {"s1", "s2"}
    AppRuns = {"w1"}
    RecordNamespace = TRUE
    AckBare = TRUE
    MaxRestarts = 3
    MaxAttempts = 3
INVARIANTS
    TypeOK
    LibfxRunsNotFailed
    RecoveryReachesOwner
    RecoveryAckedFirstTime
    AppRunsRun
