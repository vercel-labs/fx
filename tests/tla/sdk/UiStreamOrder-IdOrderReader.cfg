\* Another way to be safe: chunks land in any order, but the reader lists only
\* chunks whose lower ids are all on disk. A crash can still leave a gap, so
\* LandedIsPrefix is not claimed.
SPECIFICATION Spec
CONSTANTS
    Lines = 5
    WritePolicy = "Multi"
    WorldLands = "Parallel"
    Reader = "IdOrder"
INVARIANTS
    TypeOK
    DeliveredInOrder
