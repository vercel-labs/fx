\* The namespace without its other half: a session reaches libfx's route,
\* but a process whose agents all have names refuses its recovery message,
\* and the World delivers it again.
SPECIFICATION Spec
CONSTANTS
    LibfxRuns = {"s1", "s2"}
    AppRuns = {"w1"}
    RecordNamespace = TRUE
    AckBare = FALSE
    MaxRestarts = 3
    MaxAttempts = 3
INVARIANTS
    TypeOK
    LibfxRunsNotFailed
    RecoveryReachesOwner
    RecoveryAckedFirstTime
    AppRunsRun
