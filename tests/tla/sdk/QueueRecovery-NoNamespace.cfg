\* libfx before the fix: run_created records no namespace, so a restart's
\* recovery sends a session to the Workflow SDK, which fails it. Only the
\* failure a user sees is checked here; RecoveryReachesOwner breaks first.
SPECIFICATION Spec
CONSTANTS
    LibfxRuns = {"s1", "s2"}
    AppRuns = {"w1"}
    RecordNamespace = FALSE
    AckBare = FALSE
    MaxRestarts = 3
    MaxAttempts = 3
INVARIANTS
    TypeOK
    LibfxRunsNotFailed
