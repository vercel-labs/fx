\* libfx on local(), with the fix: one chunk per call. world-local 5.1.1 lands
\* a call's chunks in any order and its reader lists every chunk on disk, and
\* the viewer still sees the lines in order, and a crash leaves a prefix.
SPECIFICATION Spec
CONSTANTS
    Lines = 5
    WritePolicy = "OneByOne"
    WorldLands = "Parallel"
    Reader = "Exists"
INVARIANTS
    TypeOK
    DeliveredInOrder
    LandedIsPrefix
