\* libfx on local() before the fix: a batch goes to world-local 5.1.1 in one
\* writeMulti call, which lands its chunks in any order, and the reader shows
\* any chunk on disk. A chunk that lands late shows after the ones behind it.
\* Must fail DeliveredInOrder (check.sh).
SPECIFICATION Spec
CONSTANTS
    Lines = 5
    WritePolicy = "Multi"
    WorldLands = "Parallel"
    Reader = "Exists"
INVARIANTS
    TypeOK
    DeliveredInOrder
