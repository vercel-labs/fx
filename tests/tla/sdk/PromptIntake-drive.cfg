    TypeOK
    ImageOrder
    StoredIffAccepted
    CancelOnlyWhenSent
    WithdrawnNeverStored
    NeverStoredTwice
    ClosedStopsPreparing
    CancelledOnlyOwn
    NoRunAfterRejected
    RunsStored
