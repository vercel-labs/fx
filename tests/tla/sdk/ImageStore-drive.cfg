\* The graph drive-images.mjs walks: a plain engine with an image store, two
\* prompts, an image an older libfx saved inline, a window of one image, so
\* each prompt drops the image before it, and driver steps only once
\* the code has settled. ImageStore.cfg checks the durable session.
CONSTANTS
    N = 2
    Imgs = {"a", "b"}
    Old = TRUE
    Durable = FALSE
    MaxFaults = 1
    MaxCrashes = 2
    MaxLoss = 1
    StoreFirst = TRUE
    MarkOnlyStored = TRUE
    FailOnMissing = TRUE
    MaxRetries = 0
    DropRepeats = TRUE
    Window = 1
    LiveWindow = TRUE
    WindowAtOpen = TRUE
SPECIFICATION DriveSpec
INVARIANTS
    TypeOK
    NoDanglingRef
    OneCopy
    OpenExact
    KnownStoredIsStored
    FailsOnlyOnLoss
    FailsOnlyOnLossInWindow
    WindowHeld
