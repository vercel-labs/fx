\* The graph drive-images.mjs walks: a plain engine with an image store, two
\* prompts, an image an older libfx saved inline, a window of two images and
\* three units of bytes, where image b takes two, so a prompt drops the image
\* before it by count or by bytes, and driver steps only once the code has
\* settled. ImageStore.cfg checks the durable session.
CONSTANTS
    N = 2
    Imgs = {"a", "b"}
    Old = TRUE
    Durable = FALSE
    MaxFaults = 1
    MaxCrashes = 2
    MaxLoss = 1
    StoreFirst = TRUE
    MarkOnlyStored = TRUE
    FailOnMissing = TRUE
    MaxRetries = 0
    DropRepeats = TRUE
    RequestImages = 2
    RequestBytes = 3
    Big = "b"
    WindowImages = 2
    WindowBytes = 3
    LiveWindow = TRUE
    WindowAtOpen = TRUE
    CountInline = TRUE
    Tools = TRUE
    ToolStoreFirst = TRUE
SPECIFICATION DriveSpec
INVARIANTS
    TypeOK
    NoDanglingRef
    OneCopy
    OpenExact
    KnownStoredIsStored
    FailsOnlyOnLoss
    FailsOnlyOnLossInWindow
    WindowHeld
    HeldFitsRequest
    RequestSeesAll
