\* Another World, which keeps writeMulti: Vercel's World, or world-local 5.2
\* and later, lands the chunks of a call in order, so a batch needs no
\* one-by-one writes.
SPECIFICATION Spec
CONSTANTS
    Lines = 5
    WritePolicy = "Multi"
    WorldLands = "InOrder"
    Reader = "Exists"
INVARIANTS
    TypeOK
    DeliveredInOrder
    LandedIsPrefix
