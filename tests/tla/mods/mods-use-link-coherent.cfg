\* Design link: a use after a change and before the reload reads the new
\* version's files with the old version's index, so UseIsCoherent must be violated.
SPECIFICATION Spec
CONSTANTS
    NR = 2
    MaxVersion = 3
    Design = "link"
    Bug = "none"
INVARIANTS
    TypeOK
    UseIsCoherent
CHECK_DEADLOCK FALSE
