\* The fx login and an MCP credential together, each under its own lock in ~/.fx, with an older fx in the default profile for each, and processes that may die.
SPECIFICATION Spec
CONSTANTS
    NP = 2
    PerProfile = 1
    OldInDefault = TRUE
    OldInMoved = FALSE
    Backend = "keychain"
    Rule = "home"
    HomeUsable = TRUE
    LoadAfterLock = TRUE
    FileShares = FALSE
    Crashes = TRUE
    MaxVer = 10
    Items = {"login", "mcp"}
    McpRule = "home"
    LockUsable = TRUE
    OnUnusable = "profile"
    TraceFallback = TRUE
    FallOnBusy = FALSE
INVARIANTS
    TypeOK
    NoReuse
    NoValidLoginDeleted
    OneRefresher
    FileLockStaysInProfile
    NoSignInFailure
    FallbackTraced
