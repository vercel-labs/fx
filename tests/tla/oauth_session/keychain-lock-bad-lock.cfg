\* A ~/.fx lock that can't be taken (a symlink, a mode 644 file, a folder, a fifo): every process takes its profile's lock with a trace line, and no sign-in fails. The old race stays when the lock is in the profile (keychain-lock-fallback.cfg).
SPECIFICATION Spec
CONSTANTS
    NP = 2
    PerProfile = 1
    OldInDefault = FALSE
    OldInMoved = FALSE
    Backend = "keychain"
    Rule = "home"
    HomeUsable = TRUE
    LoadAfterLock = TRUE
    FileShares = FALSE
    Crashes = TRUE
    MaxVer = 10
    Items = {"login", "mcp"}
    McpRule = "home"
    LockUsable = FALSE
    OnUnusable = "profile"
    TraceFallback = TRUE
    FallOnBusy = FALSE
INVARIANTS
    TypeOK
    NoSignInFailure
    FallbackTraced
