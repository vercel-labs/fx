\* The PR's first head: ~/.fx opens but its lock can't be taken, and sign-in fails in every FX_HOME profile with CredentialStorageUnavailable.
SPECIFICATION Spec
CONSTANTS
    NP = 2
    PerProfile = 1
    OldInDefault = FALSE
    OldInMoved = FALSE
    Backend = "keychain"
    Rule = "home"
    HomeUsable = TRUE
    LoadAfterLock = TRUE
    FileShares = FALSE
    Crashes = TRUE
    MaxVer = 10
    Items = {"login", "mcp"}
    McpRule = "home"
    LockUsable = FALSE
    OnUnusable = "fail"
    TraceFallback = TRUE
    FallOnBusy = FALSE
INVARIANTS
    TypeOK
    NoSignInFailure
