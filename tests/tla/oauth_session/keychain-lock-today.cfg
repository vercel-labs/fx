\* fx before the change: each profile locks its own folder, so a second profile refreshes the same token, is refused, and deletes the login the first just saved.
SPECIFICATION Spec
CONSTANTS
    NP = 3
    PerProfile = 1
    OldInDefault = TRUE
    OldInMoved = FALSE
    Backend = "keychain"
    Rule = "profile"
    HomeUsable = TRUE
    LoadAfterLock = TRUE
    FileShares = FALSE
    Crashes = TRUE
    MaxVer = 7
    Items = {"login"}
    McpRule = "profile"
    LockUsable = TRUE
    OnUnusable = "profile"
    TraceFallback = TRUE
    FallOnBusy = FALSE
INVARIANTS
    TypeOK
    NoValidLoginDeleted
