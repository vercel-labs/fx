\* Planted: a shared lock another process holds sends the process to its profile's lock, so two of them hold the credential's lock at once.
SPECIFICATION Spec
CONSTANTS
    NP = 3
    PerProfile = 1
    OldInDefault = TRUE
    OldInMoved = FALSE
    Backend = "keychain"
    Rule = "home"
    HomeUsable = TRUE
    LoadAfterLock = TRUE
    FileShares = FALSE
    Crashes = TRUE
    MaxVer = 12
    Items = {"mcp"}
    McpRule = "home"
    LockUsable = TRUE
    OnUnusable = "profile"
    TraceFallback = TRUE
    FallOnBusy = TRUE
INVARIANTS
    TypeOK
    OneRefresher
