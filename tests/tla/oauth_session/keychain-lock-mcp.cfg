\* The MCP credential, like the login: with the Keychain every profile takes the refresh lock in ~/.fx/mcp-credentials. Three profiles with one fx each, an older fx in the default profile, and processes that may die.
SPECIFICATION Spec
CONSTANTS
    NP = 3
    PerProfile = 1
    OldInDefault = TRUE
    OldInMoved = FALSE
    Backend = "keychain"
    Rule = "home"
    HomeUsable = TRUE
    LoadAfterLock = TRUE
    FileShares = FALSE
    Crashes = TRUE
    MaxVer = 12
    Items = {"mcp"}
    McpRule = "home"
    LockUsable = TRUE
    OnUnusable = "profile"
    TraceFallback = TRUE
    FallOnBusy = FALSE
INVARIANTS
    TypeOK
    NoReuse
    NoValidLoginDeleted
    OneRefresher
    FileLockStaysInProfile
