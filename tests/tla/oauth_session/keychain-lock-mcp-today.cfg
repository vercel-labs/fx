\* fx before the change: each profile locks its own mcp-credentials folder, so a second profile sends the MCP refresh token the first just used, and is refused. The credential stays (removeIfSame); the reuse is what an issuer may answer by revoking the login.
SPECIFICATION Spec
CONSTANTS
    NP = 3
    PerProfile = 1
    OldInDefault = TRUE
    OldInMoved = FALSE
    Backend = "keychain"
    Rule = "home"
    HomeUsable = TRUE
    LoadAfterLock = TRUE
    FileShares = FALSE
    Crashes = TRUE
    MaxVer = 12
    Items = {"mcp"}
    McpRule = "profile"
    LockUsable = TRUE
    OnUnusable = "profile"
    TraceFallback = TRUE
    FallOnBusy = FALSE
INVARIANTS
    TypeOK
    NoReuse
