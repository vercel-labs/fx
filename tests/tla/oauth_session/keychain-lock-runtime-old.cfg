\* The alternative left out: a per-user folder outside ~/.fx. An older fx in the default profile locks ~/.fx/auth.lock, so it and a new fx hold the login's lock at once.
SPECIFICATION Spec
CONSTANTS
    NP = 3
    PerProfile = 1
    OldInDefault = TRUE
    OldInMoved = FALSE
    Backend = "keychain"
    Rule = "runtime"
    HomeUsable = TRUE
    LoadAfterLock = TRUE
    FileShares = FALSE
    Crashes = TRUE
    MaxVer = 7
INVARIANTS
    TypeOK
    OneRefresher
