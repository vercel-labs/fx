\* Planted: the MCP lock in a per-user folder outside ~/.fx. An older fx in the default profile locks ~/.fx/mcp-credentials, so it and a new fx hold the credential's lock at once.
SPECIFICATION Spec
CONSTANTS
    NP = 3
    PerProfile = 1
    OldInDefault = TRUE
    OldInMoved = FALSE
    Backend = "keychain"
    Rule = "home"
    HomeUsable = TRUE
    LoadAfterLock = TRUE
    FileShares = FALSE
    Crashes = TRUE
    MaxVer = 12
    Items = {"mcp"}
    McpRule = "runtime"
    LockUsable = TRUE
    OnUnusable = "profile"
    TraceFallback = TRUE
    FallOnBusy = FALSE
INVARIANTS
    TypeOK
    OneRefresher
