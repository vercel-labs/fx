\* The design before the Keychain read joined it: every parse and writer wipes, but the Keychain reply keeps the caller's allocator, so a realloc that moves it gives the old block back unwiped.
SPECIFICATION Spec
CONSTANTS
    Blocks = {1, 2}
    Policy = "head"
    MaxEvents = 3
CONSTRAINT Bounded
INVARIANTS
    TypeOK
    NoSecretMoved
