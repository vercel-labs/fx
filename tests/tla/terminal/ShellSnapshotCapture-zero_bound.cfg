\* A bound of zero captures: every command runs with the full startup and the
\* snapshot is never taken, so the startup files run for every command:
\* FullOnlyAfterRecapture.
CONSTANTS
    FilterRule = "fixed"
    ZdotdirRule = "zero_bound"
    MaxEdits = 1
    MaxRuns = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    FullOnlyAfterRecapture
