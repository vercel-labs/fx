\* fx before this change reads ZDOTDIR only from the environment, so a
\* command never sees an unexported one: ZdotdirAsLogin.
CONSTANTS
    FilterRule = "fixed"
    ZdotdirRule = "env_only"
    MaxEdits = 1
    MaxRuns = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    HelpersCallable
    StubsStayOut
    FxPrivateOut
    NamesComplete
    FreshAfterEdit
    ZdotdirAsLogin
