\* fx with the ZDOTDIR watch, before the repair of the failed state: the
\* failure's stamps are laid out for the generation's ZDOTDIR and compared with
\* stamps laid out for none, so fx sees a change that never happened:
\* FailedChangeIsReal.
CONSTANTS
    FilterRule = "fixed"
    ZdotdirRule = "failed_layout"
    MaxEdits = 1
    MaxRuns = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    FailedChangeIsReal
