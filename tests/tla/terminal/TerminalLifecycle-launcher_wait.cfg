\* Planted bug: the launcher waits for the release byte after its shell is gone, so it never closes the PTY.
\* The checker must reject it with NoHolderAfterCleanExit.
CONSTANTS
    Procs = {p1, p2}
    Ttys = {t1, t2}
    MaxInst = 2
    Mutation = "launcher_wait"

SPECIFICATION SafetySpec

INVARIANTS
    TypeOK
    OrphansOnlyAfterCrash
    ShownLiveIsOwned
    NoBadInteract
    NoWrongEnd
    NoIndexBeforeStartReturns
    NoHolderAfterCleanExit

