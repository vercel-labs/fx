\* Planted bug: the host collects the launcher as soon as it has ended, even though its session still holds a late child, so the exit close finds no entry to end the child by.
\* The checker must reject it with NoHolderAfterCleanExit. The design's LauncherHeldWhileSessionHasMembers is left out here, because it names the step before.
CONSTANTS
    Procs = {p1, p2}
    Ttys = {t1, t2}
    MaxInst = 2
    Mutation = "early_reap"

SPECIFICATION SafetySpec

INVARIANTS
    TypeOK
    OrphansOnlyAfterCrash
    ShownLiveIsOwned
    NoBadInteract
    NoWrongEnd
    NoIndexBeforeStartReturns
    NoHolderAfterCleanExit
