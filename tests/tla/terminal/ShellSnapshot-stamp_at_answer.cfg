\* Planted bug: ApprovalMatchesAnswer must be violated. The answer records the epoch
\* current when the person answers, not the epoch the question was shown in, so a
\* refresh while the question is open lets the call run without a new question.
CONSTANTS
    Cmds = {c1, c2, c3}
    Sessions = {"s1", "s2"}
    FirstSession = {c1}
    MaxGen = 2
    Mutation = "stamp_at_answer"

SPECIFICATION SafetySpec

INVARIANTS
    TypeOK
    SingleFlight
    NoUseAfterFree
    FreeOnlyUnleased
    RunsCompleteSnapshot
    NoLeak
    DotfilesPaidOnce
    GrantMatchesEpoch
    NoticeOncePerEpisode
    FreshWhenClean
    NoReuseOfBroken
    ApprovalMatchesAnswer
