\* One session, two commands, MaxGen 3: three shell generations with one session.
\* Design model: every invariant and liveness property must hold.
CONSTANTS
    Cmds = {c1, c2}
    Sessions = {"s1"}
    FirstSession = {c1, c2}
    MaxGen = 3
    Mutation = "stale_grant"

SPECIFICATION SafetySpec

INVARIANTS
    TypeOK
    SingleFlight
    NoUseAfterFree
    FreeOnlyUnleased
    RunsCompleteSnapshot
    NoLeak
    DotfilesPaidOnce
    GrantMatchesEpoch
    NoticeOncePerEpisode
    FreshWhenClean
    NoReuseOfBroken

