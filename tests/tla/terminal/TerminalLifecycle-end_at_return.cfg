\* Design model: every invariant and liveness property must hold.
CONSTANTS
    Procs = {p1, p2}
    Ttys = {t1, t2}
    MaxInst = 2
    Mutation = "end_at_return"

SPECIFICATION SafetySpec

INVARIANTS
    TypeOK
    OrphansOnlyAfterCrash
    ShownLiveIsOwned
    NoBadInteract
    NoWrongEnd
    NoIndexBeforeStartReturns
