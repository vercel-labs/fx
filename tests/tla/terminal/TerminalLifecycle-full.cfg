\* Full design model, run locally: every invariant and liveness property must hold with two terminals.
\* CI runs TerminalLifecycle.cfg, the same properties with one terminal, which is about 60 times smaller.
CONSTANTS
    Procs = {p1, p2}
    Ttys = {t1, t2}
    MaxInst = 2
    Mutation = "none"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OrphansOnlyAfterCrash
    ShownLiveIsOwned
    NoBadInteract
    NoWrongEnd
    NoIndexBeforeStartReturns
    NoHolderAfterCleanExit
    LauncherHeldWhileSessionHasMembers

PROPERTIES
    ExitCompletes
    OrphansEnd
    StartReturns
    StartIndexed
    LauncherCollected
