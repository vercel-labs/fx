\* One session, two commands, MaxGen 3: three shell generations with one session.
\* Planted bug: StoredGrantMatchesAnswer must be violated. The write of a
\* remembered answer stamps the epoch current at the write, not the epoch the
\* answer was given under, so a refresh between the two makes the grant match.
CONSTANTS
    Cmds = {c1, c2}
    Sessions = {"s1"}
    FirstSession = {c1, c2}
    MaxGen = 3
    Mutation = "store_stamps_current"

SPECIFICATION SafetySpec

INVARIANTS
    TypeOK
    SingleFlight
    NoUseAfterFree
    FreeOnlyUnleased
    RunsCompleteSnapshot
    NoLeak
    DotfilesPaidOnce
    GrantMatchesEpoch
    NoticeOncePerEpisode
    FreshWhenClean
    NoReuseOfBroken
    ApprovalMatchesAnswer

PROPERTIES
    StoredGrantMatchesAnswer
