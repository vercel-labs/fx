\* Design model that CI runs: every invariant and liveness property must hold. One terminal keeps it small:
\* the late child, the held launcher and its collect all concern one terminal, and a second terminal only
\* multiplies the states. TerminalLifecycle-full.cfg has two and runs locally.
CONSTANTS
    Procs = {p1, p2}
    Ttys = {t1}
    MaxInst = 2
    Mutation = "none"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OrphansOnlyAfterCrash
    ShownLiveIsOwned
    NoBadInteract
    NoWrongEnd
    NoIndexBeforeStartReturns
    NoHolderAfterCleanExit
    LauncherHeldWhileSessionHasMembers

PROPERTIES
    ExitCompletes
    OrphansEnd
    StartReturns
    StartIndexed
    LauncherCollected
