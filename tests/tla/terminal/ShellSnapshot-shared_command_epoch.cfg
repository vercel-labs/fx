\* Planted bug: AdmissionUsesCurrentEpoch must be violated. Two sessions share the owner.
CONSTANTS
    Cmds = {c1, c2, c3}
    Sessions = {"s1", "s2"}
    FirstSession = {c1}
    MaxGen = 2
    Mutation = "shared_command_epoch"

SPECIFICATION SafetySpec

