    TypeOK
    SingleFlight
    NoUseAfterFree
    FreeOnlyUnleased
    RunsCompleteSnapshot
    NoLeak
    DotfilesPaidOnce
    GrantMatchesEpoch
    NoticeOncePerEpisode
    FreshWhenClean
    NoReuseOfBroken

PROPERTIES
    AdmissionUsesCurrentEpoch
