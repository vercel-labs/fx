\* A witness, not a mutation: with fx's rules a command does run with the full
\* startup when the watched files change at every capture, so NoFullRun must be
\* violated.
CONSTANTS
    FilterRule = "fixed"
    ZdotdirRule = "fixed"
    MaxEdits = 1
    MaxRuns = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoFullRun
