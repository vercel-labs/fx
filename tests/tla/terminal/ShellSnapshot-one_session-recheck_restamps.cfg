\* One session, two commands, MaxGen 3: three shell generations with one session.
\* Planted bug: ApprovalMatchesAnswer must be violated. The run-time recheck
\* restamps the approval with the current epoch, so a refresh after the answer
\* does not ask again.
CONSTANTS
    Cmds = {c1, c2}
    Sessions = {"s1"}
    FirstSession = {c1, c2}
    MaxGen = 3
    Mutation = "recheck_restamps"

SPECIFICATION SafetySpec

INVARIANTS
    TypeOK
    SingleFlight
    NoUseAfterFree
    FreeOnlyUnleased
    RunsCompleteSnapshot
    NoLeak
    DotfilesPaidOnce
    GrantMatchesEpoch
    NoticeOncePerEpisode
    FreshWhenClean
    NoReuseOfBroken
    ApprovalMatchesAnswer
