\* fx before the bound on the captures one command starts: a startup file that
\* renews the files fx watches at every start keeps every capture stale, so the
\* command waits for ever: CapturesBounded.
CONSTANTS
    FilterRule = "fixed"
    ZdotdirRule = "unbounded"
    MaxEdits = 1
    MaxRuns = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    CapturesBounded
