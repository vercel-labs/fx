\* Planted bug: the exit close kills only the tree it recorded, so a late child survives it.
\* The checker must reject it with NoHolderAfterCleanExit.
CONSTANTS
    Procs = {p1, p2}
    Ttys = {t1, t2}
    MaxInst = 2
    Mutation = "record_once"

SPECIFICATION SafetySpec

INVARIANTS
    TypeOK
    OrphansOnlyAfterCrash
    ShownLiveIsOwned
    NoBadInteract
    NoWrongEnd
    NoIndexBeforeStartReturns
    NoHolderAfterCleanExit
