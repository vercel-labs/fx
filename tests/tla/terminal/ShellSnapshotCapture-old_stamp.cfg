\* fx with the ZDOTDIR watch but before the capture-start rule stamps the
\* folder the startup files moved ZDOTDIR to when the capture finishes, so an
\* edit made while the capture runs is the baseline: CurrentIsFresh.
CONSTANTS
    FilterRule = "fixed"
    ZdotdirRule = "stamp_late"
    MaxEdits = 1
    MaxRuns = 2

SPECIFICATION Spec

INVARIANTS
    TypeOK
    CurrentIsFresh
