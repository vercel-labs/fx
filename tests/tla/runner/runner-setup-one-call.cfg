\* Design: one call with every runner request, every rule and floor, every login and every destination, record and sandbox state. The decide rules are per call, so this config checks them over every input. Must pass.
SPECIFICATION Spec
CONSTANTS
    Calls = {"c1"}
    SubCalls = {}
    Repos = {"r1"}
    Requests = {"none", "local", "remote"}
    RuleChoices = {"none", "local", "remote", "isolated"}
    FloorChoices = {"none", "remote", "isolated"}
    SurfaceChoices = {"interactive", "headless"}
    LoginChoices = {"none", "expired", "valid", "other_user"}
    ConfiguredChoices = {TRUE, FALSE}
    ValidChoices = {TRUE, FALSE}
    DestChoices = {TRUE, FALSE}
    SandboxChoices = {TRUE, FALSE}
    RecordChoices = {"none", "dest", "other"}
    MaxAttempts = 1
    MaxTurns = 2
    Bug = "none"
INVARIANTS
    TypeOK
    IsolatedFloor
    RuleWins
    NoLocalFallback
    NoCopyWithoutConsent
    NoVercelWriteBeforeYes
    ConsentOnlyByPerson
    NoPromptWithoutChannel
    SinglePrompt
    NoPromptAfterDecline
    RemoteNeedsReady
    NoWriteAfterEarlyCancel
    NoPromptAfterCancel
PROPERTIES
    EventuallyEnds
