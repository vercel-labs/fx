\* Design: one call with every runner request. IsolatedFloor, RuleWins and NoLocalFallback are per call and depend only on that call's inputs, so this config checks them over every input. Must pass.
SPECIFICATION Spec
CONSTANTS
    Calls = {"c1"}
    SubCalls = {}
    MaxAttempts = 1
    MaxTurns = 2
    Requests = {"none", "local", "remote"}
    Bug = "none"
INVARIANTS
    TypeOK
    IsolatedFloor
    RuleWins
    NoLocalFallback
    ConfigOnlyByUser
    SinglePrompt
    NoWaitWithoutChannel
    NoPromptAfterDecline
    RemoteNeedsReady
    NoWriteAfterEarlyCancel
    NoPromptAfterCancel
    WriteOnlyAfterProjectAccept
PROPERTIES
    EventuallyEnds
