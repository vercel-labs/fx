\* Design a with the done line written twice: a plain member gets two done lines
\* for one completed compaction. PlainGetsExactlyOneDone must be violated.
SPECIFICATION SafetySpec
CONSTANTS
    Members = {m1, m2, m3}
    Main = m1
    Lists = {m1, m2}
    Design = "a"
    Class = "nonideal"
    Mutation = "two_done"
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    PlainGetsExactlyOneDone
