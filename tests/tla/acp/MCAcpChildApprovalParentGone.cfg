\* The design: a parent's own request whose registry entry is gone ends its wait with a refusal that reads as closed, as a subagent's does, and not as the person's denial.
CONSTANTS
    Children = {c1}
    Route = "host"
    AtomicGate = TRUE
    StopCancelsWait = TRUE
    MaxPrompts = 2
    FinishCards = TRUE
    SpawnClosesGate = TRUE
    PrefixIds = TRUE
    ReserveSlot = TRUE
    ResendCancel = TRUE
    OthersMayAsk = TRUE
    Capacity = 3
    OneRun = FALSE
    Track = {"gone"}
    Fixed = {"seq", "steerCloses", "parentRefuses"}
    Kinds = {}
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ParentReadsTrue
    ParentNeverStarved
    NoStrandedRequest
    ShownRequestIsOpen
CHECK_DEADLOCK FALSE
