\* Design b with no churn while an end is pending: the window between the two
\* steps stays empty, so design b must pass here.
SPECIFICATION Spec
CONSTANTS
    Members = {m1, m2, m3}
    Main = m1
    Lists = {m1, m2}
    Design = "b"
    Class = "ideal"
    Mutation = "none"
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    OnlyListingGetsUpdates
    ProgressThenEnd
    ListingGetsProgress
    ListingGetsEnd
    ListingGetsNoDone
    PlainGetsExactlyOneDone
    JoinerSeesSameAsPresent
    ExactlyOneEndOrDone
PROPERTIES
    ListingEndDelivered
