\* Planted bug: one held tail for every source, so stdout and stderr mix.
\* Must violate NothingLost.
CONSTANTS
    Sources = {"stdout", "stderr"}
    Classes = {"A", "C", "L2", "L4", "X"}
    MaxLen = 4
    MaxChunk = 2
    Carry = TRUE
    SharedTail = TRUE
    Flush = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ProgressValidUtf8
    TailBounded
    NothingLost

CHECK_DEADLOCK FALSE
