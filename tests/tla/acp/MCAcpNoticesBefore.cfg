\* fx before this rule: a notices client gets fx's own text as agent
\* messages. Must violate OperationalAsNotice.
CONSTANTS
    Mode = "before"
    MaxSteps = 4

SPECIFICATION Spec

INVARIANTS
    OperationalAsNotice
    TypeOK
    NoticeNeedsCapability
    PlainClientUnchanged
    FailureReportIsMessage
    ConversationStaysMessages
    OneNoticePerMessage
    NoticeSeverity
    AssistantSplit

CHECK_DEADLOCK FALSE
