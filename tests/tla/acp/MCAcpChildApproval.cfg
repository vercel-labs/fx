\* The design: a subagent asks through its host's prompter, gated on the open prompt, with one card, unique ids, the parent's slot kept, and a cancel in the gap withdrawn.
CONSTANTS
    Children = {c1, c2}
    Route = "host"
    AtomicGate = TRUE
    StopCancelsWait = TRUE
    MaxPrompts = 2
    FinishCards = TRUE
    SpawnClosesGate = TRUE
    PrefixIds = TRUE
    ReserveSlot = TRUE
    ResendCancel = TRUE
    OthersMayAsk = TRUE
    Capacity = 3
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoRunWithoutAllow
    NoStrandedRequest
    ShownRequestIsOpen
    UniqueIds
    ParentNeverStarved
    CardMatchesResult
PROPERTIES
    CloseEndsWait
    StopEndsWait
    CardEnds
    CardFinalIsFinal
CHECK_DEADLOCK FALSE
