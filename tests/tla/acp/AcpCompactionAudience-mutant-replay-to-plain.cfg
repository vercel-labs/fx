\* Design a with the joiner's replay guard removed: a joiner after in_progress
\* gets the kept line whatever it lists. OnlyListingGetsUpdates must be violated.
SPECIFICATION SafetySpec
CONSTANTS
    Members = {m1, m2, m3}
    Main = m1
    Lists = {m1, m2}
    Design = "a"
    Class = "nonideal"
    Mutation = "replay_to_plain"
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    OnlyListingGetsUpdates
