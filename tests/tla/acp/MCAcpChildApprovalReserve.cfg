    Children = {c1, c2}
    Route = "host"
    AtomicGate = TRUE
    StopCancelsWait = TRUE
    MaxPrompts = 2
    FinishCards = TRUE
    SpawnClosesGate = TRUE
    PrefixIds = TRUE
    ReserveSlot = TRUE
    ResendCancel = TRUE
