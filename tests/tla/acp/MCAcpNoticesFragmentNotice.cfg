\* Planted: every fragment its own notice, the "\n" after a line too.
\* Must violate OneNoticePerMessage.
CONSTANTS
    Mode = "fragment_notice"
    MaxSteps = 4

SPECIFICATION Spec

INVARIANTS
    OneNoticePerMessage
    TypeOK
    NoticeNeedsCapability
    PlainClientUnchanged
    FailureReportIsMessage
    ConversationStaysMessages
    OperationalAsNotice
    NoticeSeverity
    AssistantSplit

