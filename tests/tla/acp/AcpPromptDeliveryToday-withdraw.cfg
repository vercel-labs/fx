\* fx's ACP path today, before the sh.fx steering rules. $/cancel_request and
\* session/close answer a waiting steer with success, where the rules say -32800.
\* MaxCancels is 0, so the checked stops are withdrawals and closes only. TLC
\* must report PendingRefused violated.
CONSTANTS
    Rules = FALSE
    Msgs <- MCMsgs
    MaxTools = 1
    MaxCancels = 0
    AllowClose = TRUE
INIT Init
NEXT Next
PROPERTY
    PendingRefused
CHECK_DEADLOCK FALSE
