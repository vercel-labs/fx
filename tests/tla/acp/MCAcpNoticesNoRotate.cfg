\* Planted: a notice leaves the message open, so the reply after it joins
\* the message before it. Must violate AssistantSplit.
CONSTANTS
    Mode = "no_rotate"
    MaxSteps = 4

SPECIFICATION Spec

INVARIANTS
    AssistantSplit
    TypeOK
    NoticeNeedsCapability
    PlainClientUnchanged
    FailureReportIsMessage
    ConversationStaysMessages
    OperationalAsNotice
    OneNoticePerMessage
    NoticeSeverity

CHECK_DEADLOCK FALSE
