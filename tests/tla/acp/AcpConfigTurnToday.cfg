\* fx acp before these rules, where a change during a turn fails with -32600. TLC
\* must report AnswersDuringTurn violated.
CONSTANTS
    Rules = FALSE
    Providers <- MCProviders
    MaxTurns = 2
    MaxRequests = 2
    MaxChanges = 2
INIT Init
NEXT Next
INVARIANT
    AnswersDuringTurn
CHECK_DEADLOCK FALSE
