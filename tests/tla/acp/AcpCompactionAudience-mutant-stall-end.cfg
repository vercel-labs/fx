\* Design a where a listing member never reads its end, so the end stays pending
\* while the member stays present. Delivery fairness does not help: the read is
\* never enabled. ListingEndDelivered must be violated (temporal).
SPECIFICATION Spec
CONSTANTS
    Members = {m1, m2, m3}
    Main = m1
    Lists = {m1, m2}
    Design = "a"
    Class = "nonideal"
    Mutation = "stall_end"
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
PROPERTIES
    ListingEndDelivered
