\* Today's code in a session where no member lists session.compaction: the hook
\* binds only when the main client lists it, so no plain member gets its done
\* line. PlainGetsExactlyOneDone must be violated.
SPECIFICATION SafetySpec
CONSTANTS
    Members = {m1, m2, m3}
    Main = m1
    Lists = {}
    Design = "a"
    Class = "nonideal"
    Mutation = "today"
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    PlainGetsExactlyOneDone
