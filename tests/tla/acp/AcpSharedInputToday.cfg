\* fx before this branch's follower input: a follower only watches. Its prompt,
\* steer and cancel are refused, and its load's system prompt is ignored. A steer
\* or queued prompt from the follower is answered, but no turn ever takes it, so
\* TLC must report FollowerPromptRuns violated, and nothing else is checked.
