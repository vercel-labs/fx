\* Design a when the main client does not list session.compaction. The joiner
\* m2 lists it, so it must still get in_progress and the end.
SPECIFICATION Spec
CONSTANTS
    Members = {m1, m2, m3}
    Main = m1
    Lists = {m2}
    Design = "a"
    Class = "nonideal"
    Mutation = "none"
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    OnlyListingGetsUpdates
    ProgressThenEnd
    ListingGetsProgress
    ListingGetsEnd
    ListingGetsNoDone
    PlainGetsExactlyOneDone
    JoinerSeesSameAsPresent
    ExactlyOneEndOrDone
PROPERTIES
    ListingEndDelivered
