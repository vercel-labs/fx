\* Planted bug: the held bytes are dropped when a source ends. Must violate
\* NothingLost.
CONSTANTS
    Sources = {"stdout", "stderr"}
    Classes = {"A", "C", "L2", "L4", "X"}
    MaxLen = 4
    MaxChunk = 2
    Carry = TRUE
    SharedTail = FALSE
    Flush = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ProgressValidUtf8
    TailBounded
    NothingLost

CHECK_DEADLOCK FALSE
