\* Design a with the listing guard on the done line removed: a completed
\* compaction's done line goes to a listing member too. ListingGetsNoDone must be
\* violated.
SPECIFICATION SafetySpec
CONSTANTS
    Members = {m1, m2, m3}
    Main = m1
    Lists = {m1, m2}
    Design = "a"
    Class = "nonideal"
    Mutation = "done_to_listing"
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    ListingGetsNoDone
