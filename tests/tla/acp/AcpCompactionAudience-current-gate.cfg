\* Today's code: the gate is the main client's listing, applied to every member,
\* and a joiner gets the kept in_progress whatever it lists. OnlyListingGetsUpdates
\* must be violated.
SPECIFICATION SafetySpec
CONSTANTS
    Members = {m1, m2, m3}
    Main = m1
    Lists = {m1, m2}
    Design = "a"
    Class = "nonideal"
    Mutation = "today"
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    OnlyListingGetsUpdates
