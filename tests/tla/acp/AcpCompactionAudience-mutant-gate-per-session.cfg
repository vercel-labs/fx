\* Design a with the per-member gate removed: the gate is the main client's
\* listing, for every member. OnlyListingGetsUpdates must be violated.
SPECIFICATION SafetySpec
CONSTANTS
    Members = {m1, m2, m3}
    Main = m1
    Lists = {m1, m2}
    Design = "a"
    Class = "nonideal"
    Mutation = "gate_per_session"
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    OnlyListingGetsUpdates
