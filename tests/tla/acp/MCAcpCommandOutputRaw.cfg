\* fx before the fix: each raw chunk is sent as it is. Must violate
\* ProgressValidUtf8.
CONSTANTS
    Sources = {"stdout", "stderr"}
    Classes = {"A", "C", "L2", "L4", "X"}
    MaxLen = 4
    MaxChunk = 2
    Carry = FALSE
    SharedTail = FALSE
    Flush = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ProgressValidUtf8
    TailBounded
    NothingLost

CHECK_DEADLOCK FALSE
