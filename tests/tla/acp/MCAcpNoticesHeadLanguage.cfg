\* fx before the turn-failure notice: the response-language failure exit sends its text as a
\* system notice, so a notices client gets the text that ends the turn as a
\* warning notice it may ignore. Must violate NoTurnEndingNotice.
CONSTANTS
    Mode = "head_language"
    MaxSteps = 4

SPECIFICATION Spec

INVARIANTS
    NoTurnEndingNotice
    TypeOK
    NoticeNeedsCapability
    PlainClientUnchanged
    FailureReportIsMessage
    ConversationStaysMessages
    OperationalAsNotice
    OneNoticePerMessage
    NoticeSeverity
    AssistantSplit

CHECK_DEADLOCK FALSE
