\* fx acp before sh.fx/commandResult, for a client that lists every part:
\* each shell call's command_result sits at the root of its
\* tool_call_update, so StandardOnly fails.
CONSTANTS
    Rules = TRUE
    CommandMeta = FALSE
    Parts = {"progress", "calls", "usage", "compaction", "command"}
    Ks = {1, 2}
    MaxProgress = 2
    MaxCalls = 1
    MaxShells = 1
    MaxTurns = 2
INIT Init
NEXT Next
INVARIANTS
    TypeOK
    OptIn
    Lifecycle
    Complete
    BeforeResponse
    StandardOnly
CHECK_DEADLOCK FALSE
