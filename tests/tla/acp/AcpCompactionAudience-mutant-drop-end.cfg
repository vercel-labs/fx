\* Design a where a listing member present at the end never gets its end.
\* ListingGetsEnd must be violated.
SPECIFICATION SafetySpec
CONSTANTS
    Members = {m1, m2, m3}
    Main = m1
    Lists = {m1, m2}
    Design = "a"
    Class = "nonideal"
    Mutation = "drop_end"
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    ListingGetsEnd
