\* The fixed rule: ACP names for fx acp, fx's own names for libfx, and a
\* step-limit stop that names itself and keeps its turn.
CONSTANTS
    Mapped = TRUE
    LibfxMapped = FALSE
    StepLimitNamed = TRUE
    StepLimitDropped = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AcpStopReasonValid
    LibfxKeepsNames
    OneNamedReason
    RefusalLeavesTurnOut
    TurnLimitKeepsTurn

CHECK_DEADLOCK FALSE
