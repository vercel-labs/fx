\* Design b: the end, then the done line in a second step, without the lock. The
\* replay of the copy gives a joiner the same as a member present from the start,
\* so JoinerSeesSameAsPresent holds. A member present at the end that leaves before
\* the second step gets no done line, so PlainGetsExactlyOneDone is checked here
\* and reports which rule design b breaks.
SPECIFICATION Spec
CONSTANTS
    Members = {m1, m2, m3}
    Main = m1
    Lists = {m1, m2}
    Design = "b"
    Class = "nonideal"
    Mutation = "none"
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    OnlyListingGetsUpdates
    ProgressThenEnd
    ListingGetsProgress
    ListingGetsEnd
    ListingGetsNoDone
    PlainGetsExactlyOneDone
    JoinerSeesSameAsPresent
    ExactlyOneEndOrDone
PROPERTIES
    ListingEndDelivered
