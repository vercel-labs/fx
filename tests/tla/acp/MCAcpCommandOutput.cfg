\* The fixed carry: two sources interleaved, chunks of up to two bytes and
\* four bytes per source, so a 4-byte character can be held at three bytes.
\* L3 follows the same rule as L2 and L4 with another length.
CONSTANTS
    Sources = {"stdout", "stderr"}
    Classes = {"A", "C", "L2", "L4", "X"}
    MaxLen = 4
    MaxChunk = 2
    Carry = TRUE
    SharedTail = FALSE
    Flush = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ProgressValidUtf8
    TailBounded
    NothingLost

CHECK_DEADLOCK FALSE
