\* Design a where a plain member never gets its done line. ExactlyOneEndOrDone
\* must be violated.
SPECIFICATION SafetySpec
CONSTANTS
    Members = {m1, m2, m3}
    Main = m1
    Lists = {m1, m2}
    Design = "a"
    Class = "nonideal"
    Mutation = "drop_done"
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    ExactlyOneEndOrDone
