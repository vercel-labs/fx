\* Design a where a listing member present when in_progress starts never gets it.
\* ListingGetsProgress must be violated.
SPECIFICATION SafetySpec
CONSTANTS
    Members = {m1, m2, m3}
    Main = m1
    Lists = {m1, m2}
    Design = "a"
    Class = "nonideal"
    Mutation = "drop_progress"
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    ListingGetsProgress
