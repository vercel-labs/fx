\* fx acp before S8d, for a client that lists every part: Complete fails.
\* Its shell calls are in AcpTurnEventsRootField.cfg, so it makes none.
CONSTANTS
    Rules = FALSE
    CommandMeta = FALSE
    Parts = {"progress", "calls", "usage", "compaction", "command"}
    Ks = {1, 2}
    MaxProgress = 2
    MaxCalls = 1
    MaxShells = 0
    MaxTurns = 2
INIT Init
NEXT Next
INVARIANTS
    TypeOK
    OptIn
    Lifecycle
    Complete
    BeforeResponse
    StandardOnly
CHECK_DEADLOCK FALSE
