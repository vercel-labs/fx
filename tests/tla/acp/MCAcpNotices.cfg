\* Every rule holds: failure text, the text that ends a turn for any cause, and
\* saved replies stay messages, the rest reaches a notices client as one notice
\* per message, a plain client as before.
CONSTANTS
    Mode = "fixed"
    MaxSteps = 4

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoticeNeedsCapability
    PlainClientUnchanged
    FailureReportIsMessage
    NoTurnEndingNotice
    ConversationStaysMessages
    OperationalAsNotice
    OneNoticePerMessage
    NoticeSeverity
    AssistantSplit

CHECK_DEADLOCK FALSE
