\* Every rule holds: failure text and saved replies stay messages, the rest
\* reaches a notices client as one notice per message, a plain client as before.
CONSTANTS
    Mode = "fixed"
    MaxSteps = 4

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoticeNeedsCapability
    PlainClientUnchanged
    FailureReportIsMessage
    ConversationStaysMessages
    OperationalAsNotice
    OneNoticePerMessage
    NoticeSeverity
    AssistantSplit

CHECK_DEADLOCK FALSE
