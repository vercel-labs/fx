\* Design a in a session where no member lists session.compaction. The hook
\* binds on every turn, so each plain member present at the end still gets its
\* done line. Every safety rule must hold. The liveness property is left out:
\* with no listing member it is a tautology, which TLC refuses to check.
SPECIFICATION Spec
CONSTANTS
    Members = {m1, m2, m3}
    Main = m1
    Lists = {}
    Design = "a"
    Class = "nonideal"
    Mutation = "none"
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    OnlyListingGetsUpdates
    ProgressThenEnd
    ListingGetsProgress
    ListingGetsEnd
    ListingGetsNoDone
    PlainGetsExactlyOneDone
    JoinerSeesSameAsPresent
    ExactlyOneEndOrDone
