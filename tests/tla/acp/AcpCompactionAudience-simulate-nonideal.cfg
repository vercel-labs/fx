\* Random runs of design a with joins and leaves at any time. Every safety rule
\* must hold on each run.
SPECIFICATION SafetySpec
CONSTANTS
    Members = {m1, m2, m3}
    Main = m1
    Lists = {m1, m2}
    Design = "a"
    Class = "nonideal"
    Mutation = "none"
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    OnlyListingGetsUpdates
    ProgressThenEnd
    ListingGetsProgress
    ListingGetsEnd
    ListingGetsNoDone
    PlainGetsExactlyOneDone
    JoinerSeesSameAsPresent
    ExactlyOneEndOrDone
