\* Exhaustive check of the speed contract over three catalog shapes:
\* a model with both lanes, one with Fast only, and one with neither.
CONSTANTS
    Models <- MCModels
    SupFast <- MCSupFast
    SupUltra <- MCSupUltra

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Exclusive
    UltraValid
    SwitchClearsFast
    RequestHonored
    RequestHonoredUltra
    RejectOnlyUnsupported
    AcceptOnlySupported
    UnknownRejected
    PromptLaneSupported

CHECK_DEADLOCK FALSE
