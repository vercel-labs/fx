\* Design a where a main failover resends the lost message, with the old main's
\* params, to the new main. The old main lists the capability and the oldest
\* remaining member does not, so OnlyListingGetsUpdates must be violated.
SPECIFICATION SafetySpec
CONSTANTS
    Members = {m1, m2, m3}
    Main = m1
    Lists = {m1, m2}
    Design = "a"
    Class = "nonideal"
    Mutation = "failover_resend"
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    OnlyListingGetsUpdates
