\* fx before #1584 was fixed: every resume after an interruption adds a
\* notice, so a turn resumed twice carries two. AtMostOneNotice must fail.
SPECIFICATION Spec
CONSTANTS
    MaxCrashes = 3
    MaxTurns = 2
    MaxSteps = 2
    MaxYields = 2
    Rule = "each"
INVARIANTS
    TypeOK
    AtMostOneNotice
