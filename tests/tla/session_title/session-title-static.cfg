\* The design with a static key: every rule holds.
SPECIFICATION Spec
CONSTANTS
    Refreshable = FALSE
    MaxRotations = 2
    MaxRevocations = 2
    OtherTeam = FALSE
    Bug = "none"
CONSTRAINT StateBound
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    FirstPromptStartsTitle
    AtMostOneTitleRequest
    TitleFromFirstPrompt
    TitleFirstSendUsesStore
    CatalogFirstSendUsesStore
    TitleAtMostOneReplay
    CatalogAtMostOneReplay
    StaticKeyNeverReplays
    BackgroundNeverRefreshes
    NeverSendsOtherTeam
    TitleGivesUpOnlyWhenUnrecoverable
    CatalogFallsBackOnlyWhenUnrecoverable
PROPERTIES
    TitleSettles
    CatalogSettles
