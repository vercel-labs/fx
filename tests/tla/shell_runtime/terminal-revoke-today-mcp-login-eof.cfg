\* fx before the paste wait's fix, against the end-of-input law: a read that
\* failed on a terminal that is gone did not end fx mcp login
\* (GoneReadStopsLogin); it went round again. The spin bound leaves a
\* deadlock, which is not the point here.
SPECIFICATION Spec
CONSTANTS
    MaxSpins = 2
    MaxIntr = 2
    Bug = "mcp_login_spins"
INVARIANTS
    TypeOK
PROPERTIES
    GoneReadStopsLogin
CHECK_DEADLOCK FALSE
