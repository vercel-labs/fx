\* fx before the prompts' fix: a terminal macOS revoked answers the prompts'
\* restore with ENOENT, which std.posix.tcsetattr reports as an unexpected
\* errno, and Debug builds print it (GoneQuietly).
SPECIFICATION Spec
CONSTANTS
    MaxSpins = 2
    MaxIntr = 2
    Bug = "prompts_strict"
INVARIANTS
    TypeOK
    GoneQuietly
