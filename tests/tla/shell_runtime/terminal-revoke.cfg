\* The design: every rule holds, and a terminal that goes away ends fx,
\* including where a revoked terminal fails reads with EIO (eio), under job
\* control, and at a prompt, which never reads again after the end of input.
SPECIFICATION Spec
CONSTANTS
    MaxSpins = 2
    MaxIntr = 2
    Bug = "none"
INVARIANTS
    TypeOK
    NoBusyLoop
    CleanupNeverCrashes
    RestoredWhenLive
    GoneQuietly
    InputClosedOnlyWhenGone
    ReadErrorOnlyWhenLive
    JobControlKeepsFx
PROPERTIES
    GoneEndsLoop
    NoReadAfterEof
