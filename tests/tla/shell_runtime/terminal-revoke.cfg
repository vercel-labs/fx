\* The design: every rule holds, and a terminal that goes away ends fx,
\* including where a revoked terminal fails reads with EIO (eio), and under
\* job control.
SPECIFICATION Spec
CONSTANTS
    MaxSpins = 2
    MaxIntr = 2
    Bug = "none"
INVARIANTS
    TypeOK
    NoBusyLoop
    CleanupNeverCrashes
    RestoredWhenLive
    GoneQuietly
    InputClosedOnlyWhenGone
    ReadErrorOnlyWhenLive
    JobControlKeepsFx
PROPERTIES
    GoneEndsLoop
