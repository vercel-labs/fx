\* The design: every rule holds, and a terminal that goes away ends fx,
\* including where a revoked terminal fails reads with EIO (eio), under job
\* control, at a prompt, which never reads again after the end of input, and in
\* the paste wait of fx mcp login, which ends on a failed read and reports a
\* sign-in that finished as done, not as failed.
SPECIFICATION Spec
CONSTANTS
    MaxSpins = 2
    MaxIntr = 2
    Bug = "none"
INVARIANTS
    TypeOK
    NoBusyLoop
    CleanupNeverCrashes
    RestoredWhenLive
    GoneQuietly
    InputClosedOnlyWhenGone
    ReadErrorOnlyWhenLive
    JobControlKeepsFx
    FinishedSignInNeverFails
    DoneOnlyWhenSignedIn
PROPERTIES
    GoneEndsLoop
    NoReadAfterEof
    GoneReadStopsLogin
