\* fx before the picker's fix: once the terminal was revoked, the team picker
\* read 0 again and again and never ended (GoneEndsLoop). The spin bound
\* leaves a deadlock, which is not the point here.
SPECIFICATION Spec
CONSTANTS
    MaxSpins = 2
    MaxIntr = 2
    Bug = "picker_ignores_eof"
INVARIANTS
    TypeOK
CHECK_DEADLOCK FALSE
PROPERTIES
    GoneEndsLoop
