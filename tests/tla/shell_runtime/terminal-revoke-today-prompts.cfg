\* fx before the prompts' fix: the interactive shell restores the terminal
\* through tcsetattrBestEffort, but the team picker and the masked key prompt
\* still restore through std.posix.tcsetattr, so the restore of a closed
\* descriptor reaches its unreachable for EBADF (CleanupNeverCrashes).
SPECIFICATION Spec
CONSTANTS
    MaxSpins = 2
    MaxIntr = 2
    Bug = "prompts_strict"
INVARIANTS
    TypeOK
    CleanupNeverCrashes
