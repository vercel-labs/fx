\* fx mcp login's paste wait before the sign-in re-check: the handler of a
\* failed read on a terminal that is gone ended the login without reading
\* whether the sign-in had finished while the read ran. A callback and a revoke
\* in one slice then reported a signed-in server as failed
\* (FinishedSignInNeverFails). Every other rule holds here, so the missing
\* re-check is the only defect.
SPECIFICATION Spec
CONSTANTS
    MaxSpins = 2
    MaxIntr = 2
    Bug = "mcp_login_done_ignored"
INVARIANTS
    TypeOK
    NoBusyLoop
    CleanupNeverCrashes
    RestoredWhenLive
    GoneQuietly
    InputClosedOnlyWhenGone
    ReadErrorOnlyWhenLive
    JobControlKeepsFx
    FinishedSignInNeverFails
    DoneOnlyWhenSignedIn
PROPERTIES
    GoneReadStopsLogin
