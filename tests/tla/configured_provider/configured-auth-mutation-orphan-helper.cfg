\* Planted defect orphan-helper: cancelling the last waiting request leaves the helper running. The rule check.sh names must catch it.
SPECIFICATION Spec
CONSTANTS
    Requests = {"r1", "r2", "r3"}
    MaxGen = 2
    Design = "b"
    Bug = "orphan_helper"
    Nonideal = TRUE
INVARIANTS
    TypeOK
    TokenFromHelper
    TokenStaysWithItsConnection
    OneRunPerConnection
    RefreshCapped
    ResendHasNewToken
    NoExpiredTokenSent
    NoOrphanRun
    WaitingHasRun
    FailureSaysSo
    RejectedOnlyAfterRefresh
PROPERTIES RequestSettles
CHECK_DEADLOCK FALSE
