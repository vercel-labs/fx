\* Planted defect refresh-loop: a 401 runs the helper again and again. The rule check.sh names must catch it.
SPECIFICATION Spec
CONSTANTS
    Requests = {"r1", "r2", "r3"}
    MaxGen = 2
    Design = "b"
    Bug = "refresh_loop"
    Nonideal = TRUE
INVARIANTS
    TypeOK
    TokenFromHelper
    TokenStaysWithItsConnection
    OneRunPerConnection
    RefreshCapped
    ResendHasNewToken
    NoExpiredTokenSent
    NoOrphanRun
    WaitingHasRun
    FailureSaysSo
    RejectedOnlyAfterRefresh
PROPERTIES RequestSettles
CHECK_DEADLOCK FALSE
