\* Planted defect shared-cache: a request sends another connection's cached token. The rule check.sh names must catch it.
SPECIFICATION Spec
CONSTANTS
    Requests = {"r1", "r2", "r3"}
    MaxGen = 2
    Design = "b"
    Bug = "shared_cache"
    Nonideal = TRUE
INVARIANTS
    TypeOK
    TokenFromHelper
    TokenStaysWithItsConnection
    OneRunPerConnection
    RefreshCapped
    ResendHasNewToken
    NoExpiredTokenSent
    NoOrphanRun
    WaitingHasRun
    FailureSaysSo
    RejectedOnlyAfterRefresh
PROPERTIES RequestSettles
CHECK_DEADLOCK FALSE
