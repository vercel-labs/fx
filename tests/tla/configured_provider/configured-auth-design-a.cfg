\* Design a: the helper runs once for every request. Every rule holds.
SPECIFICATION Spec
CONSTANTS
    Requests = {"r1", "r2", "r3"}
    MaxGen = 2
    Design = "a"
    Bug = "none"
    Nonideal = TRUE
INVARIANTS
    TypeOK
    TokenFromHelper
    TokenStaysWithItsConnection
    OneRunPerConnection
    RefreshCapped
    ResendHasNewToken
    NoExpiredTokenSent
    NoOrphanRun
    WaitingHasRun
    FailureSaysSo
    RejectedOnlyAfterRefresh
PROPERTIES RequestSettles
CHECK_DEADLOCK FALSE
