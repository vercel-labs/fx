\* Planted defect silent-failure: a failed request does not say why. The rule check.sh names must catch it.
SPECIFICATION Spec
CONSTANTS
    Requests = {"r1", "r2", "r3"}
    MaxGen = 2
    Design = "b"
    Bug = "silent_failure"
    Nonideal = TRUE
INVARIANTS
    TypeOK
    TokenFromHelper
    TokenStaysWithItsConnection
    OneRunPerConnection
    RefreshCapped
    ResendHasNewToken
    NoExpiredTokenSent
    NoOrphanRun
    WaitingHasRun
    FailureSaysSo
    RejectedOnlyAfterRefresh
PROPERTIES RequestSettles
CHECK_DEADLOCK FALSE
