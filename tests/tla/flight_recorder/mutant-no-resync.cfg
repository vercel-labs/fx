\* Mutant: Reopen stops at the first reservation hole (no resync), so committed frames after it are neither recovered nor counted.
SPECIFICATION Spec
CONSTANTS
    Design = "mmap"
    Mutant = "no_resync"
    AllowFaults = TRUE
    AllowReset = FALSE
    MaxEvents = 2
    SegCap = 2
    MaxSegs = 2
    RingCap = 2
    MaxInstances = 2
    MaxConv = 1
INVARIANTS
    NoSilentLoss
