\* Mutant: both producers open a successor segment when overflowing the same segment without CAS.
SPECIFICATION Spec
CONSTANTS
    Design = "mmap"
    Mutant = "switch_without_cas"
    AllowFaults = TRUE
    AllowReset = FALSE
    MaxEvents = 2
    SegCap = 2
    MaxSegs = 2
    RingCap = 2
    MaxInstances = 2
    MaxConv = 1
INVARIANTS
    OneSwitchPerSegment
