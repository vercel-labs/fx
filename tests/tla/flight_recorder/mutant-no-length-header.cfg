\* Mutant: Reserve omits the length header, so Reopen cannot skip a torn middle frame.
SPECIFICATION Spec
CONSTANTS
    Design = "mmap"
    Mutant = "no_length_header"
    AllowFaults = TRUE
    AllowReset = FALSE
    MaxEvents = 2
    SegCap = 2
    MaxSegs = 2
    RingCap = 2
    MaxInstances = 2
    MaxConv = 1
INVARIANTS
    TornOnlyInFlight
