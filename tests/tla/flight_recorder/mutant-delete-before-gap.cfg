\* Mutant: Evict deletes the segment first, then writes the gap record; crash between them loses the count.
SPECIFICATION Spec
CONSTANTS
    Design = "mmap"
    Mutant = "delete_before_gap"
    AllowFaults = TRUE
    AllowReset = FALSE
    MaxEvents = 3
    SegCap = 2
    MaxSegs = 2
    RingCap = 2
    MaxInstances = 2
    MaxConv = 1
INVARIANTS
    NoSilentLoss
