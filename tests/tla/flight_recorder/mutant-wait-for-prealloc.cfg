\* Mutant: producer waits for Prealloc when no next segment is ready.
SPECIFICATION Spec
CONSTANTS
    Design = "mmap"
    Mutant = "wait_for_prealloc"
    AllowFaults = TRUE
    AllowReset = FALSE
    MaxEvents = 2
    SegCap = 2
    MaxSegs = 2
    RingCap = 2
    MaxInstances = 2
    MaxConv = 1
INVARIANTS
    UiNeverWaitsOnDisk
