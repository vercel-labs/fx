\* Mutant: EvictWriteGap records only committed frames, omitting the evicted segment's mapped dropped counter.
SPECIFICATION Spec
CONSTANTS
    Design = "mmap"
    Mutant = "gap_without_drops"
    AllowFaults = TRUE
    AllowReset = FALSE
    MaxEvents = 2
    SegCap = 1
    MaxSegs = 1
    RingCap = 2
    MaxInstances = 2
    MaxConv = 1
INVARIANTS
    NoSilentLoss
