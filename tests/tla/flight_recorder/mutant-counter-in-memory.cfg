\* Mutant: dropped-events counter lives in volatile memory instead of mapped header.
SPECIFICATION Spec
CONSTANTS
    Design = "mmap"
    Mutant = "counter_in_memory"
    AllowFaults = TRUE
    AllowReset = FALSE
    MaxEvents = 2
    SegCap = 2
    MaxSegs = 2
    RingCap = 2
    MaxInstances = 2
    MaxConv = 1
INVARIANTS
    NoSilentLoss
