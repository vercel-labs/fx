\* Always-on mmap design: every requirement R1-R8 and EvictOnlySealed must hold.
SPECIFICATION Spec
CONSTANTS
    Design = "mmap"
    Mutant = "none"
    AllowFaults = TRUE
    AllowReset = FALSE
    MaxEvents = 2
    SegCap = 2
    MaxSegs = 2
    RingCap = 2
    MaxInstances = 3
    MaxConv = 1
INVARIANTS
    TypeOK
    NoSilentLoss
    PowerLossBounded
    TornOnlyInFlight
    OrderKept
    InstanceEndKnown
    SessionIsolated
    UiNeverWaitsOnDisk
    DeleteRemovesAll
    EvictOnlySealed
    OneSwitchPerSegment
