\* Random simulation of mmap under ideal conditions: no crash, power loss, or disk full.
SPECIFICATION Spec
CONSTANTS
    Design = "mmap"
    Mutant = "none"
    AllowFaults = FALSE
    AllowReset = FALSE
    MaxEvents = 3
    SegCap = 2
    MaxSegs = 2
    RingCap = 2
    MaxInstances = 3
    MaxConv = 2
INVARIANTS
    TypeOK
    NoSilentLoss
    PowerLossBounded
    TornOnlyInFlight
    OrderKept
    InstanceEndKnown
    SessionIsolated
    UiNeverWaitsOnDisk
    DeleteRemovesAll
    EvictOnlySealed
    OneSwitchPerSegment
