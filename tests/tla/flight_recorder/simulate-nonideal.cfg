\* Random simulation of mmap under non-ideal conditions: crashes, power loss, and disk full.
SPECIFICATION Spec
CONSTANTS
    Design = "mmap"
    Mutant = "none"
    AllowFaults = TRUE
    AllowReset = FALSE
    MaxEvents = 3
    SegCap = 2
    MaxSegs = 2
    RingCap = 2
    MaxInstances = 3
    MaxConv = 2
INVARIANTS
    TypeOK
    NoSilentLoss
    PowerLossBounded
    TornOnlyInFlight
    OrderKept
    InstanceEndKnown
    SessionIsolated
    UiNeverWaitsOnDisk
    DeleteRemovesAll
    EvictOnlySealed
    OneSwitchPerSegment
