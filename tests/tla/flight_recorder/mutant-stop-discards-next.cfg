\* Mutant: CleanExit (Stop) discards Writer.next even when frames were committed in it (before ClearNext ran).
SPECIFICATION Spec
CONSTANTS
    Design = "mmap"
    Mutant = "stop_discards_next"
    AllowFaults = TRUE
    AllowReset = FALSE
    MaxEvents = 2
    SegCap = 2
    MaxSegs = 2
    RingCap = 2
    MaxInstances = 2
    MaxConv = 1
INVARIANTS
    NoSilentLoss
