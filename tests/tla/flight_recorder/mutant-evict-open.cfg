\* Mutant: Evict can delete an unsealed segment or a segment with a reserved frame in it.
SPECIFICATION Spec
CONSTANTS
    Design = "mmap"
    Mutant = "evict_open"
    AllowFaults = TRUE
    AllowReset = FALSE
    MaxEvents = 3
    SegCap = 2
    MaxSegs = 2
    RingCap = 2
    MaxInstances = 2
    MaxConv = 1
INVARIANTS
    EvictOnlySealed
