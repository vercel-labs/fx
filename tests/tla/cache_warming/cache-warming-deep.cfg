\* The design with a 3-TTL cap, answers as slow as a TTL, and long sleeps.
SPECIFICATION Spec
CONSTANTS
    TTL = 20
    Cap = 60
    MaxSend = 20
    MaxSleep = 12
    Bug = "none"
INVARIANTS
    TypeOK
    NoWritingPing
    KeepsAlive
    PingsBounded
    NoPingWhileSending
    NoPingAfterShutdown
    NoStaleStop
PROPERTIES
    PingWithinCap
