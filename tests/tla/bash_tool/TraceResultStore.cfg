\* Every store rule of ResultStore's design, on recorded traces of the real result store.
\* ConformsToSpec makes each recorded step a step of the model. tests/tla/drivers/bash_tool/
\* writes TraceData.tla next to this file for each run, and checks the witnesses and planted bugs
\* with configs it writes.
SPECIFICATION TraceSpec
CHECK_DEADLOCK FALSE
INVARIANT
    StartsAtInit
    TypeOK
    NoReuse
    IndexNamesFile
    FullNoticed
    SavedBeforeShown
PROPERTY
    ConformsToSpec
    StoreAppendOnly
