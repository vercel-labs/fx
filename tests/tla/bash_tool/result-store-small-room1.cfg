\* The design with two programs and room for 1 result file(s). The driver walks every distinct
\* step of this instance on the real code: the three-program design has 1,100,789 states, too many to
\* walk (see tests/tla/drivers/bash_tool/verify.ts). Every rule holds.
SPECIFICATION Spec
CONSTANTS
    Programs = {"p1", "p2"}
    Room = 1
    MaxRestarts = 1
    Mutation = "none"
INVARIANTS TypeOK RunOnce OneAtATime SavedBeforeShown NoReuse IndexNamesFile FullNoticed StateNeverTorn EndedSaves RefusalNoticed NeverLoadsDamaged LossNoticed ReportedBeforeRun
PROPERTIES StoreAppendOnly EverySentIsSaved
\* A run ends when every program is sent and its result shown; that end is not a deadlock.
CHECK_DEADLOCK FALSE
