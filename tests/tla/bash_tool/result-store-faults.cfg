\* The design with two programs and room for 2 result file(s), with the failure steps on
\* (Faults = TRUE): a file or an index line that cannot be written is reported, and every
\* rule holds, liveness included. The driver walks the same instance (result-store-small-room2.cfg).
SPECIFICATION Spec
CONSTANTS
    Programs = {"p1", "p2"}
    Room = 2
    MaxRestarts = 1
    Faults = TRUE
    Mutation = "none"
INVARIANTS TypeOK RunOnce OneAtATime SavedBeforeShown NoReuse IndexNamesFile FullNoticed StateNeverTorn EndedSaves RefusalNoticed NeverLoadsDamaged LossNoticed ReportedBeforeRun
PROPERTIES StoreAppendOnly EverySentIsSaved
\* A run ends when every program is sent and its result shown; that end is not a deadlock.
CHECK_DEADLOCK FALSE
