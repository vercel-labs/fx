name: Publish libfx

on:
  workflow_run:
    workflows: [CI, Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: npm channel to publish
        required: true
        type: choice
        options:
          - dev
          - stable

permissions:
  contents: read

concurrency:
  group: publish-libfx-${{ (github.event.workflow_run.name == 'Release' || inputs.channel == 'stable') && 'stable' || 'dev' }}
  cancel-in-progress: false

jobs:
  metadata:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.metadata.outputs.channel }}
      npm_tag: ${{ steps.metadata.outputs.npm_tag }}
      sha: ${{ steps.metadata.outputs.sha }}
      should_publish: ${{ steps.metadata.outputs.should_publish }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.workflow_run.head_sha }}

      - name: Resolve channel and version
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CHANNEL="$REQUESTED_CHANNEL"
            SHA=$(git rev-parse HEAD)
          else
            SHA="$WORKFLOW_SHA"
            if [ "$WORKFLOW_NAME" = "Release" ]; then
              CHANNEL=stable
            else
              CHANNEL=dev
            fi
          fi

          BASE_VERSION=$(grep 'pub const version' src/main.zig | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if ! [[ "$BASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::src/main.zig version is not strict SemVer"
            exit 1
          fi
          SHOULD_PUBLISH=true
          if [ "$CHANNEL" = "stable" ]; then
            TAG="v${BASE_VERSION}"
            if git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null; then
              TAG_SHA=$(git rev-list -n 1 "$TAG")
              if [ "$TAG_SHA" != "$SHA" ]; then
                if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                  echo "::error::Stable tag ${TAG} points to ${TAG_SHA}, not ${SHA}"
                  exit 1
                fi
                echo "Release workflow did not publish ${SHA}; skipping libfx stable publish"
                SHOULD_PUBLISH=false
              fi
            else
              if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                echo "::error::Stable tag ${TAG} does not exist"
                exit 1
              fi
              echo "Release workflow did not create ${TAG}; skipping libfx stable publish"
              SHOULD_PUBLISH=false
            fi
            VERSION="$BASE_VERSION"
            NPM_TAG=latest
          else
            SHORT_SHA=$(printf '%s' "$SHA" | cut -c1-12)
            VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}.g${SHORT_SHA}"
            NPM_TAG=dev
          fi

          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "npm_tag=${NPM_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "should_publish=${SHOULD_PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing libfx@${VERSION} on the ${CHANNEL} channel (${NPM_TAG})"

  native:
    needs: metadata
    if: needs.metadata.outputs.should_publish == 'true'
    name: Native (${{ matrix.package_platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            package_platform: linux-x64
            target_flags: -Dtarget=x86_64-linux-gnu.2.34 -Dcpu=baseline
            runtime_image: public.ecr.aws/lambda/nodejs@sha256:2472f0273d8848d8b2aa6528f5526b8a514b70703596199efe5a4b84d3d59b0b
          - runner: ubuntu-24.04-arm
            package_platform: linux-arm64
            target_flags: -Dtarget=aarch64-linux-gnu.2.34 -Dcpu=baseline
            runtime_image: public.ecr.aws/lambda/nodejs@sha256:104527dd19c1907b4aaf328b5b3af1ac0c5db6bb9c76be8cb73fb295ec58b0fe
          - runner: macos-15-intel
            package_platform: darwin-x64
          - runner: macos-15
            package_platform: darwin-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.17.0"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Build ReleaseSafe addon
        run: zig build libfx-napi -Dnapi-surface=core -Doptimize=ReleaseSafe -Dupdate-channel=${{ needs.metadata.outputs.channel }} ${{ matrix.target_flags }}

      - name: Check Linux ABI baseline
        if: startsWith(matrix.package_platform, 'linux-')
        run: |
          python3 sdk/tests/test-linux-abi.py
          python3 sdk/scripts/check-linux-abi.py zig-out/lib/libfx.node

      - name: Test Linux addon on Amazon Linux 2023
        if: startsWith(matrix.package_platform, 'linux-')
        run: |
          docker run --rm --network none --entrypoint /bin/bash \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            '${{ matrix.runtime_image }}' -euc '
              node -e '\''const assert = require("node:assert/strict"); assert.equal(process.report.getReport().header.glibcVersionRuntime, "2.34");'\''
              node sdk/tests/test-native-core-ready.mjs
              node sdk/tests/test-host-tools.mjs native
              node sdk/tests/test-host-tool-cancel.mjs native
            '

      - name: Test native addon
        run: npm run --prefix sdk test:node-napi

      - name: Name native addon for package discovery
        shell: bash
        run: |
          mkdir -p native-addons
          cp zig-out/lib/libfx.node native-addons/libfx.${{ matrix.package_platform }}.node

      - name: Upload native addon
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libfx-native-${{ matrix.package_platform }}
          path: native-addons/libfx.${{ matrix.package_platform }}.node
          if-no-files-found: error

  wasm:
    needs: metadata
    if: needs.metadata.outputs.should_publish == 'true'
    name: WebAssembly (ReleaseSmall)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.17.0"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Build ReleaseSmall WebAssembly surfaces
        run: |
          zig build -Dwasm-surface=core -Doptimize=ReleaseSmall -Dupdate-channel=${{ needs.metadata.outputs.channel }}
          zig build -Dwasm-surface=term -Doptimize=ReleaseSmall -Dupdate-channel=${{ needs.metadata.outputs.channel }}

      - name: Shrink WebAssembly surfaces with wasm-opt
        run: |
          npm ci --prefix sdk/tools
          node sdk/scripts/optimize-wasm.mjs zig-out/bin/fx-core.wasm zig-out/bin/fx-term.wasm

      - name: Install terminal test dependencies
        run: npm ci --prefix sdk/node

      - name: Test Node and WebAssembly
        run: npm run --prefix sdk test:node-wasm

      - name: Upload WebAssembly artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libfx-wasm
          path: |
            zig-out/bin/fx-core.wasm
            zig-out/bin/fx-term.wasm
          if-no-files-found: error

  package:
    needs: [metadata, native, wasm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: libfx-native-*
          path: native-addons
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libfx-wasm
          path: wasm-artifacts

      - name: Install the durable Worlds
        run: npm ci --prefix sdk/durable

      - name: Assemble package
        env:
          LIBFX_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p zig-out/bin zig-out/lib
          cp wasm-artifacts/*.wasm zig-out/bin/
          cp native-addons/libfx.linux-x64.node zig-out/lib/libfx.node
          jq -e '
            .name == "libfx" and
            .type == "module" and
            .scripts != null and
            (.scripts | keys | all(startswith("test:"))) and
            (.dependencies == null) and
            (.devDependencies == null) and
            (.optionalDependencies == null) and
            (.peerDependencies == null) and
            (.bin == null)
          ' sdk/package.json >/dev/null

          # LIBFX_VERSION sets the version of libfx, of each platform's
          # package, and of the optional dependencies that pin them.
          node sdk/scripts/package-libfx.mjs sdk/dist native-addons/*.node
          cp sdk/dist/libfx/package.json /tmp/libfx-manifest.json
          npm pack ./sdk/dist/libfx --ignore-scripts --json > /tmp/libfx-pack.json
          mv "$(jq -r '.[0].filename' /tmp/libfx-pack.json)" libfx-package.tgz
          mkdir libfx-native
          for package in sdk/dist/libfx-*/; do
            npm pack "./$package" --ignore-scripts --pack-destination libfx-native --json
          done | jq -s add > /tmp/libfx-native-pack.json
          sha256sum libfx-package.tgz libfx-native/*.tgz > libfx-packages.sha256

      - name: Validate package archive
        run: |
          node -e '
            const report = require("/tmp/libfx-pack.json")[0];
            const names = new Set(report.files.map(({ path }) => path));
            const required = [
              "package.json", "README.md", "LICENSE", "browser.js", "browser-agent.js", "browser-terminal.js", "node.js", "node.cjs", "node-wasm.js", "bundled-asset.js", "fx-sdk.js", "engine.js", "xterm.js", "wasm-runtime.js", "wasm-terminal.js", "wasm-module.js",
              "core-output.js", "tool-observation.js", "fetch-cleanup.js", "mcp.js", "skills.js", "skills-node.js", "subscription.js", "oauth.js", "chatgpt.js", "chatgpt-sign-in.js", "grok.js", "grok-sign-in.js", "custom-provider.js",
              "durable.js", "fx-harness.js", "durable/local.mjs", "durable/vercel.mjs", "durable/world.mjs", "durable/local.mjs.map", "durable/vercel.mjs.map", "durable/world.mjs.map",
              "types/browser.d.ts", "types/chatgpt.d.ts", "types/durable-local.d.ts", "types/durable-vercel.d.ts", "types/durable-world.d.ts", "types/grok.d.ts", "types/libfx.d.cts", "types/mcp.d.ts", "types/node.d.cts", "types/node.d.ts", "types/skills-node.d.ts", "types/skills.d.ts", "types/wasm.d.ts",
              "fx-core.wasm", "fx-term.wasm",
            ];
            if (names.size !== required.length) throw new Error(`unexpected package file count: ${names.size}`);
            for (const name of required) {
              if (!names.has(name)) throw new Error(`package is missing ${name}`);
            }
            console.log(`validated ${report.name}@${report.version}: ${report.files.length} files, ${report.size} bytes packed`);
          '

      # libfx pins one package per platform. Each must be packed at the pinned
      # version and carry exactly its addon and its loader.
      - name: Validate platform package archives
        run: |
          node -e '
            const manifest = require("/tmp/libfx-manifest.json");
            const reports = require("/tmp/libfx-native-pack.json");
            const pinned = manifest.optionalDependencies;
            const names = reports.map(({ name }) => name).sort();
            if (names.join() !== Object.keys(pinned).sort().join()) throw new Error(`packed platform packages ${names.join(", ")} do not match the pinned ${Object.keys(pinned).join(", ")}`);
            for (const report of reports) {
              if (report.version !== manifest.version || pinned[report.name] !== manifest.version) throw new Error(`${report.name}@${report.version} does not match libfx@${manifest.version}`);
              const files = report.files.map(({ path }) => path).sort();
              if (files.join() !== "LICENSE,README.md,index.js,libfx.node,package.json") throw new Error(`${report.name} has unexpected files: ${files.join(", ")}`);
              console.log(`validated ${report.name}@${report.version}: ${report.size} bytes packed`);
            }
          '

      # Pull request CI runs the full package qualification (Next, resilience,
      # every module format). Publishing only proves this exact archive installs
      # and runs on each backend.
      - name: Smoke test the installed package
        run: |
          node sdk/tests/test-packed-example.mjs libfx-package.tgz native esm --native-dir libfx-native
          node --experimental-wasm-jspi sdk/tests/test-packed-example.mjs libfx-package.tgz wasm esm

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libfx-package
          path: |
            libfx-package.tgz
            libfx-native/*.tgz
            libfx-packages.sha256
          if-no-files-found: error

  publish:
    needs: [metadata, package]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libfx-package
      - run: sha256sum --check libfx-packages.sha256

      - name: Confirm dev publish still targets main
        if: needs.metadata.outputs.channel == 'dev'
        env:
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$MAIN_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::main advanced to ${MAIN_SHA}; refusing to move the dev channel to stale ${RELEASE_SHA}"
            exit 1
          fi

      - name: Publish the verified archive with npm trusted publishing
        env:
          LIBFX_VERSION: ${{ needs.metadata.outputs.version }}
          NPM_TAG: ${{ needs.metadata.outputs.npm_tag }}
        run: |
          set -euo pipefail
          if npm view "libfx@${LIBFX_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "libfx@${LIBFX_VERSION} is already published; leaving ${NPM_TAG} unchanged"
            exit 0
          fi
          declare -A archives
          for archive in libfx-native/*.tgz; do
            archives[$(tar -xzOf "$archive" package/package.json | jq -r .name)]=$archive
          done
          # libfx carries no native addon of its own, so every platform package
          # it pins goes first. Without them, installs fall back to WebAssembly.
          # A rerun after a partial publish skips the packages already there.
          for package in $(tar -xzOf libfx-package.tgz package/package.json | jq -r '.optionalDependencies | keys[]'); do
            archive=${archives[$package]:-}
            if [ -z "$archive" ]; then
              echo "::error::no archive for ${package}; refusing to publish libfx without it"
              exit 1
            fi
            if npm view "${package}@${LIBFX_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "${package}@${LIBFX_VERSION} is already published"
              continue
            fi
            if ! npm publish "./$archive" --ignore-scripts --access public --tag "$NPM_TAG" --provenance; then
              echo "::error::publishing ${package} failed. A new package needs its first version published by hand and a trusted publisher for this workflow; see sdk/NAPI.md"
              exit 1
            fi
          done
          npm publish ./libfx-package.tgz --ignore-scripts --access public --tag "$NPM_TAG" --provenance

  verify-published:
    needs: [metadata, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libfx-package
      # Byte-identical registry archives are the packages that already passed
      # the smoke test above, so comparing bytes is the whole verification.
      - name: Download and compare the immutable registry versions
        env:
          LIBFX_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum --check libfx-packages.sha256
          mkdir registry
          for archive in libfx-package.tgz libfx-native/*.tgz; do
            name=$(tar -xzOf "$archive" package/package.json | jq -r .name)
            npm pack "${name}@${LIBFX_VERSION}" --ignore-scripts --registry=https://registry.npmjs.org/ --pack-destination registry --json > /tmp/libfx-registry-pack.json
            cmp "$archive" "registry/$(jq -r '.[0].filename' /tmp/libfx-registry-pack.json)"
            echo "verified ${name}@${LIBFX_VERSION}"
          done
