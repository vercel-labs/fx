name: TLA+ mod store

# Checks the mod store model in tests/tla/mods/: TLC on every config, planted
# mutations included, then the driver, which walks src/core/mods/store.zig
# along every edge of ModStore.tla through its lab, with a real SIGKILL for
# each crash, and plants three bugs that it must catch. Every push to main
# runs it. A pull request runs it only with the ci:tla-mods label; dispatch
# this workflow to run it on any branch.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  # Adding some other label starts a run that skips the check, so it gets its
  # own group instead of cancelling a check in progress.
  group: tla-mods-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci:tla-mods' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: TLA+ mod store model
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:tla-mods') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:tla-mods'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      # The driver builds a lab around the store module.
      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: "0.17.1"
          cache-key: ci-tla-mods
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Model-check the mod store and walk the real store along the model
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl -fsSL -o "$jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | sha256sum -c -
          export TLA2TOOLS_JAR="$jar"
          tests/tla/mods/check.sh
          bun tests/tla/drivers/mods/driver.ts --self-check
