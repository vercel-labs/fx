name: Release Candidate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-candidate
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux
          - name: linux-aarch64
            target: aarch64-linux
          - name: macos-x86_64
            target: x86_64-macos
          - name: macos-aarch64
            target: aarch64-macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build dev binary
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} -Dupdate-channel=dev

      - name: Package
        run: |
          package_dir="$RUNNER_TEMP/fx-package-${{ matrix.name }}"
          mkdir -p "$package_dir"
          cp zig-out/bin/fx LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf fx-${{ matrix.name }}.tar.gz -C "$package_dir" fx LICENSE THIRD_PARTY_NOTICES.md
          sha256sum fx-${{ matrix.name }}.tar.gz > fx-${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fx-${{ matrix.name }}
          path: |
            fx-${{ matrix.name }}.tar.gz
            fx-${{ matrix.name }}.tar.gz.sha256

  web:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: Build web artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build terminal WASM
        run: zig build -Doptimize=ReleaseSafe -Dwasm-surface=term

      - name: Package web artifacts
        run: |
          cp sdk/fx-sdk.js fx-sdk.js
          cp zig-out/bin/fx-term.wasm fx-term.wasm
          sha256sum fx-sdk.js > fx-sdk.js.sha256
          sha256sum fx-term.wasm > fx-term.wasm.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fx-web
          path: |
            fx-sdk.js
            fx-sdk.js.sha256
            fx-term.wasm
            fx-term.wasm.sha256

  publish:
    needs: [build, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true

      - name: Confirm candidate still targets main
        run: |
          set -euo pipefail
          MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$MAIN_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::main advanced to ${MAIN_SHA}; refusing to publish stale candidate ${RELEASE_SHA}"
            exit 1
          fi

      - name: Create candidate manifest
        run: |
          set -euo pipefail
          VERSION=$(grep 'pub const version' src/main.zig | head -1 | sed 's/.*"\(.*\)".*/\1/')
          jq -n --arg version "$VERSION" --arg commit "$RELEASE_SHA" \
            '{version: $version, commit: $commit}' > dev.json
          sha256sum --check fx-sdk.js.sha256
          sha256sum --check fx-term.wasm.sha256

      - name: Move candidate tag
        run: |
          set -euo pipefail
          git tag --force dev "$RELEASE_SHA"
          git push --force origin refs/tags/dev

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: dev
          name: O MyFX release candidate
          body: Automated release candidate for `${{ github.event.workflow_run.head_sha }}`.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dev.json
            fx-*.tar.gz
            fx-*.tar.gz.sha256
            fx-sdk.js
            fx-sdk.js.sha256
            fx-term.wasm
            fx-term.wasm.sha256
