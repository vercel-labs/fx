name: Dev Release

# Every 30 minutes, take main's newest commit, run the jobs of CI a dev build
# waits for (the dev gate), and publish the commit to the dev channel when
# they pass. The rest of CI, such as the durable-session model check and the
# TLA+ models, still runs on every push to main, but a dev build does not wait
# for it. A manual dispatch runs the gate and the builds on its own branch and
# never publishes.
on:
  schedule:
    # GitHub can start a scheduled run some minutes late, and late more often
    # at the top of the hour.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Runs for different commits overlap, so a slow gate does not hold back the
# next commit. A second run for the same commit waits for the first.
concurrency:
  group: dev-release-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
    steps:
      - name: Decide whether this commit needs a dev build
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != schedule ]; then
            echo "A manual dispatch always runs the gate."
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT_SHA=$(curl -fsS --max-time 30 https://releases.fx.sh/dev.json | jq -r '.commit // empty') || CURRENT_SHA=""
          if [ "$CURRENT_SHA" = "$BUILD_SHA" ]; then
            echo "The dev channel already names ${BUILD_SHA}."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "The dev channel names ${CURRENT_SHA:-no readable commit}; build ${BUILD_SHA}."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  gate:
    name: Dev gate
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      dev_gate: true

  build:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux
          - name: linux-aarch64
            target: aarch64-linux
          - name: macos-x86_64
            target: x86_64-macos
          - name: macos-aarch64
            target: aarch64-macos
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number counts main's history (build.zig readBuildNumber).
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.1"

      - name: Build dev binary
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} -Dupdate-channel=dev

      - name: Package
        run: |
          package_dir="$RUNNER_TEMP/fx-package-${{ matrix.name }}"
          mkdir -p "$package_dir"
          cp zig-out/bin/fx LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf fx-${{ matrix.name }}.tar.gz -C "$package_dir" fx LICENSE THIRD_PARTY_NOTICES.md
          sha256sum fx-${{ matrix.name }}.tar.gz > fx-${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-fx-${{ matrix.name }}
          path: |
            fx-${{ matrix.name }}.tar.gz
            fx-${{ matrix.name }}.tar.gz.sha256

  web:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    name: Build web artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.1"

      - name: Build terminal WASM
        run: zig build -Doptimize=ReleaseSafe -Dwasm-surface=term

      - name: Package web artifacts
        run: |
          cp sdk/fx-sdk.js fx-sdk.js
          cp sdk/core-output.js core-output.js
          cp sdk/tool-observation.js tool-observation.js
          cp sdk/wasm-module.js wasm-module.js
          cp zig-out/bin/fx-term.wasm fx-term.wasm
          sha256sum fx-sdk.js > fx-sdk.js.sha256
          sha256sum core-output.js > core-output.js.sha256
          sha256sum tool-observation.js > tool-observation.js.sha256
          sha256sum wasm-module.js > wasm-module.js.sha256
          sha256sum fx-term.wasm > fx-term.wasm.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-fx-web
          path: |
            fx-sdk.js
            fx-sdk.js.sha256
            core-output.js
            core-output.js.sha256
            tool-observation.js
            tool-observation.js.sha256
            wasm-module.js
            wasm-module.js.sha256
            fx-term.wasm
            fx-term.wasm.sha256

  publish:
    needs: [gate, build, web]
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Gates for different commits can end in any order, so publishes go one at
    # a time and each reads the channel the one before it wrote.
    concurrency:
      group: dev-release-publish
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ github.sha }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      FX_WEB_DEPLOY_HOOK_URL: ${{ secrets.FX_WEB_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The dev channel step compares this commit with the one in dev.json.
          fetch-depth: 0

      # The gate's CI jobs upload artifacts to this run too, such as a
      # differently built fx-term.wasm, so take only this workflow's own.
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dev-*
          merge-multiple: true

      - name: Publish immutable dev artifacts
        run: |
          set -euo pipefail

          for FILE in fx-*.tar.gz fx-*.tar.gz.sha256; do
            [ -f "$FILE" ] || continue
            CONTENT_TYPE="application/octet-stream"
            [[ "$FILE" == *.sha256 ]] && CONTENT_TYPE="text/plain"
            [[ "$FILE" == *.tar.gz ]] && CONTENT_TYPE="application/gzip"

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PUT "https://blob.vercel-storage.com/cli/dev/${RELEASE_SHA}/${FILE}" \
              -H "Authorization: Bearer ${BLOB_READ_WRITE_TOKEN}" \
              -H "x-api-version: 7" \
              -H "x-content-type: ${CONTENT_TYPE}" \
              -H "x-add-random-suffix: 0" \
              -H "x-cache-control-max-age: 31536000" \
              --data-binary "@${FILE}")
            echo "Uploaded ${FILE} for ${RELEASE_SHA} ($HTTP_CODE)"
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "::error::Failed to upload ${FILE} to the dev channel ($HTTP_CODE)"
              exit 1
            fi
          done

      - name: Publish immutable web artifacts
        run: |
          set -euo pipefail

          sha256sum --check fx-sdk.js.sha256
          sha256sum --check core-output.js.sha256
          sha256sum --check tool-observation.js.sha256
          sha256sum --check wasm-module.js.sha256
          sha256sum --check fx-term.wasm.sha256

          for FILE in fx-sdk.js fx-sdk.js.sha256 core-output.js core-output.js.sha256 tool-observation.js tool-observation.js.sha256 wasm-module.js wasm-module.js.sha256 fx-term.wasm fx-term.wasm.sha256; do
            CONTENT_TYPE="application/octet-stream"
            [[ "$FILE" == *.js ]] && CONTENT_TYPE="text/javascript"
            [[ "$FILE" == *.wasm ]] && CONTENT_TYPE="application/wasm"
            [[ "$FILE" == *.sha256 ]] && CONTENT_TYPE="text/plain"

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PUT "https://blob.vercel-storage.com/cli/dev/${RELEASE_SHA}/web/${FILE}" \
              -H "Authorization: Bearer ${BLOB_READ_WRITE_TOKEN}" \
              -H "x-api-version: 7" \
              -H "x-content-type: ${CONTENT_TYPE}" \
              -H "x-add-random-suffix: 0" \
              -H "x-cache-control-max-age: 31536000" \
              --data-binary "@${FILE}")
            echo "Uploaded web/${FILE} for ${RELEASE_SHA} ($HTTP_CODE)"
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "::error::Failed to upload ${FILE} to the dev web channel ($HTTP_CODE)"
              exit 1
            fi
          done

      - name: Decide whether the dev channel moves
        id: forward
        run: |
          set -euo pipefail
          # dev.json is read through the CDN, which caches it for 60 seconds.
          # Publishes go one at a time, and each waits until the CDN serves
          # its write, so the read sees the previous publish's write.
          CURRENT_SHA=$(curl -fsS --max-time 30 https://releases.fx.sh/dev.json | jq -r '.commit // empty') || CURRENT_SHA=""
          if [ -z "$CURRENT_SHA" ]; then
            echo "::warning::could not read a commit from dev.json; only main's newest commit may replace it"
          fi
          MAIN_SHA=$(timeout 60 git ls-remote origin refs/heads/main | cut -f1) || MAIN_SHA=""
          bash scripts/dev-channel-forward.sh "$CURRENT_SHA" "$RELEASE_SHA" "$MAIN_SHA"

      - name: Point dev channel at this commit
        id: point-dev
        if: steps.forward.outputs.move == 'true'
        run: |
          set -euo pipefail
          VERSION=$(grep 'pub const version' src/main.zig | head -1 | sed 's/.*"\(.*\)".*/\1/')
          # The same number the binary carries (build.zig readBuildNumber).
          # fx installs a dev build only when this number is higher.
          BUILD=$(git rev-list --count --first-parent "$RELEASE_SHA")
          jq -n --arg version "$VERSION" --arg commit "$RELEASE_SHA" --argjson build "$BUILD" \
            '{version: $version, commit: $commit, build: $build}' > /tmp/dev.json

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "https://blob.vercel-storage.com/cli/dev.json" \
            -H "Authorization: Bearer ${BLOB_READ_WRITE_TOKEN}" \
            -H "x-api-version: 7" \
            -H "x-content-type: application/json" \
            -H "x-add-random-suffix: 0" \
            -H "x-cache-control-max-age: 60" \
            --data-binary "@/tmp/dev.json")
          echo "Updated dev.json to ${RELEASE_SHA} ($HTTP_CODE)"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Failed to update dev.json ($HTTP_CODE)"
            exit 1
          fi
          echo "updated=true" >> "$GITHUB_OUTPUT"

      # The next publish reads dev.json through the CDN to decide whether the
      # channel moves, so hold the publish slot until the CDN serves this write.
      - name: Wait until releases.fx.sh serves this commit
        if: steps.point-dev.outputs.updated == 'true'
        run: |
          set -uo pipefail
          attempts=30
          for attempt in $(seq 1 "$attempts"); do
            SERVED_SHA=$(curl -fsS --max-time 30 https://releases.fx.sh/dev.json | jq -r '.commit // empty') || SERVED_SHA=""
            if [ "$SERVED_SHA" = "$RELEASE_SHA" ]; then
              echo "releases.fx.sh serves ${RELEASE_SHA} after ${attempt} reads"
              exit 0
            fi
            [ "$attempt" -lt "$attempts" ] && sleep 10
          done
          echo "::error::after ${attempts} reads, releases.fx.sh still names ${SERVED_SHA:-no readable commit}, not ${RELEASE_SHA}"
          exit 1

      - name: Deploy fx-web
        if: steps.point-dev.outputs.updated == 'true' && env.FX_WEB_DEPLOY_HOOK_URL != ''
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --max-time 30 \
            -X POST "$FX_WEB_DEPLOY_HOOK_URL"
