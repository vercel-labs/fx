name: TLA+ bash tool

# Checks the bash tool's result store in tests/tla/bash_tool/: TLC on ResultStore.tla
# and its recorded traces, then the Bun driver that runs the real result files, bash
# results, and program output along the model, and every planted bug. Every push to
# main runs the full check. A pull request runs the quick check only with the
# ci:tla-bash-tool label. Dispatch this workflow to run quick mode (the default) or the
# full check on any branch. The TLC part also runs in Build & Test on every pull request.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full check instead of quick mode
        type: boolean
        default: false

concurrency:
  # Adding some other label starts a run that skips the check, so it gets its
  # own group instead of cancelling a check in progress.
  group: tla-bash-tool-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci:tla-bash-tool' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: TLA+ bash tool model and driver
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:tla-bash-tool') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:tla-bash-tool'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      # The driver builds a harness around the real result store with Zig.
      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: "0.17.1"
          cache-key: ci-tla-bash-tool
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Model-check the bash tool's result store and drive the real store along it
        env:
          # Quick mode on pull requests and on a dispatch without `full`. Pushes to main run the full check.
          FX_TLA_BASH_TOOL_QUICK: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.full)) && '1' || '0' }}
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl -fsSL -o "$jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | sha256sum -c -
          TLA2TOOLS_JAR="$jar" tests/tla/bash_tool/check.sh
