name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check if release needed
        id: check
        run: |
          VERSION=$(grep 'pub const version' src/main.zig | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::src/main.zig version is not strict SemVer"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} exists, no release needed"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} missing, release needed"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux
          - name: linux-aarch64
            target: aarch64-linux
          - name: macos-x86_64
            target: x86_64-macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Package
        # sha256sum is available on all ubuntu runners used in this workflow
        run: |
          package_dir="$RUNNER_TEMP/fx-package-${{ matrix.name }}"
          mkdir -p "$package_dir"
          cp zig-out/bin/fx LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf fx-${{ matrix.name }}.tar.gz -C "$package_dir" fx LICENSE THIRD_PARTY_NOTICES.md
          sha256sum fx-${{ matrix.name }}.tar.gz > fx-${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fx-${{ matrix.name }}
          path: |
            fx-${{ matrix.name }}.tar.gz
            fx-${{ matrix.name }}.tar.gz.sha256

  build-macos-arm64:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/pgso-macos-arm64.yml
    with:
      package_release: true

  release:
    needs: [check-version, build, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: fx-*
          merge-multiple: true

      - name: Create git tag
        env:
          RELEASE_TAG: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git tag -- "$RELEASE_TAG"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Extract changelog entry
        run: |
          awk '/<!-- release:start -->/{found=1; next} /<!-- release:end -->/{found=0} found{print}' CHANGELOG.md > /tmp/release-notes.md
          LINES=$(wc -l < /tmp/release-notes.md | tr -d ' ')
          if [ "$LINES" -lt 2 ]; then
            echo "Error: No release notes found between <!-- release:start --> and <!-- release:end --> markers in CHANGELOG.md"
            exit 1
          fi
          echo "Extracted release notes ($LINES lines)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          body_path: /tmp/release-notes.md
          files: |
            fx-*.tar.gz
            fx-*.tar.gz.sha256

      - name: Publish to CDN
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          CDN_BASE="cli"

          for FILE in fx-*.tar.gz fx-*.tar.gz.sha256; do
            [ -f "$FILE" ] || continue
            CONTENT_TYPE="application/octet-stream"
            [[ "$FILE" == *.sha256 ]] && CONTENT_TYPE="text/plain"
            [[ "$FILE" == *.tar.gz ]] && [[ "$FILE" != *.sha256 ]] && CONTENT_TYPE="application/gzip"

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PUT "https://blob.vercel-storage.com/${CDN_BASE}/${VERSION}/${FILE}" \
              -H "Authorization: Bearer ${BLOB_READ_WRITE_TOKEN}" \
              -H "x-api-version: 7" \
              -H "x-content-type: ${CONTENT_TYPE}" \
              -H "x-add-random-suffix: 0" \
              -H "x-cache-control-max-age: 31536000" \
              --data-binary "@${FILE}")
            echo "Uploaded ${FILE} -> ${CDN_BASE}/${VERSION}/${FILE} ($HTTP_CODE)"
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "::error::Failed to upload ${FILE} to CDN ($HTTP_CODE)"
              exit 1
            fi
          done

          echo -n "$VERSION" > /tmp/latest.txt
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "https://blob.vercel-storage.com/${CDN_BASE}/latest.txt" \
            -H "Authorization: Bearer ${BLOB_READ_WRITE_TOKEN}" \
            -H "x-api-version: 7" \
            -H "x-content-type: text/plain" \
            -H "x-add-random-suffix: 0" \
            -H "x-cache-control-max-age: 60" \
            --data-binary "@/tmp/latest.txt")
          echo "Updated latest.txt to $VERSION ($HTTP_CODE)"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Failed to update latest.txt ($HTTP_CODE)"
            exit 1
          fi

  deploy-fx-web:
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Deploy fx-web
        env:
          FX_WEB_DEPLOY_HOOK_URL: ${{ secrets.FX_WEB_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$FX_WEB_DEPLOY_HOOK_URL" ]; then
            echo "::error::FX_WEB_DEPLOY_HOOK_URL is not configured"
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --max-time 30 \
            -X POST "$FX_WEB_DEPLOY_HOOK_URL"
