name: TLA+ fx mcp call

# Checks the `fx mcp call` bridge model in tests/tla/mcp_call/: TLC on
# McpCall.tla, the core's tests, both driver directions against the real core,
# every planted bug, and DESIGN.md traceability. Every push to main runs it. A
# pull request runs it only with the ci:tla-mcp-call label; dispatch this
# workflow to run it on any branch.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  # Adding some other label starts a run that skips the check, so it gets its
  # own group instead of cancelling a check in progress.
  group: tla-mcp-call-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci:tla-mcp-call' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: TLA+ fx mcp call model
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:tla-mcp-call') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:tla-mcp-call'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      # The check builds the core's tests and a harness around the real core.
      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: "0.17.0"
          cache-key: ci-tla-mcp-call
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Model-check fx mcp call and drive the real core along the model
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl -fsSL -o "$jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | sha256sum -c -
          TLA2TOOLS_JAR="$jar" tests/tla/mcp_call/check.sh
