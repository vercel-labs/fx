name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig_mode:
    name: Build & Test (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - optimize: ReleaseSafe
            test_timeout_seconds: 900
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          cache-key: ci-unit-${{ matrix.optimize }}

      - name: Check formatting
        run: zig fmt --check src/

      - name: Validate PGSO corpus classification
        run: python3 -m scripts.pgso.corpus --manifest scripts/pgso/corpus.json --list

      - name: Audit public surface
        run: ./scripts/check-public-surface.sh

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Test
        env:
          TEST_TIMEOUT_SECONDS: ${{ matrix.test_timeout_seconds }}
        run: |
          started_at=$SECONDS
          trap 'printf "Unit tests elapsed: %ss\n" "$((SECONDS - started_at))"' EXIT
          timeout "${TEST_TIMEOUT_SECONDS}s" zig build test -Doptimize=${{ matrix.optimize }}

  zig:
    name: Build & Test
    if: ${{ always() }}
    needs: zig_mode
    runs-on: ubuntu-latest
    steps:
      - name: Require ReleaseSafe
        env:
          MATRIX_RESULT: ${{ needs.zig_mode.result }}
        run: test "$MATRIX_RESULT" = success

  sdk-node-wasm:
    name: SDK (Node + WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build WASM surfaces (ReleaseSmall)
        run: |
          zig build -Dwasm-surface=core -Doptimize=ReleaseSmall
          zig build -Dwasm-surface=term -Doptimize=ReleaseSmall

      - name: Install terminal test dependencies
        run: npm ci --prefix sdk/node

      - name: Test Node + WASM
        run: npm run --prefix sdk test:node-wasm

      - name: Test libfx Wasm integrations
        run: |
          node --experimental-wasm-jspi sdk/tests/test-host-tools.mjs wasm
          node --experimental-wasm-jspi sdk/tests/test-host-tool-cancel.mjs wasm
          node --experimental-wasm-jspi sdk/tests/test-mcp-adapter.mjs http wasm
          node --experimental-wasm-jspi sdk/tests/test-skills-adapter.mjs host wasm

  sdk-node-napi:
    name: SDK (Node + N-API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build N-API addon (ReleaseSafe)
        run: zig build -Dnapi-surface=core -Doptimize=ReleaseSafe

      - name: Test Node + N-API
        run: npm run --prefix sdk test:node-napi

      - name: Test minimal native integrations
        run: |
          node sdk/tests/test-minimal-api.mjs
          node sdk/tests/test-host-tools.mjs native
          node sdk/tests/test-host-tool-cancel.mjs native
          node sdk/tests/test-mcp-adapter.mjs stdio native
          node sdk/tests/test-skills-adapter.mjs disk native

  sdk-bun:
    name: SDK (Bun + N-API/WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Build SDK artifacts
        run: |
          zig build -Dnapi-surface=core -Doptimize=ReleaseSafe
          zig build -Dwasm-surface=core -Doptimize=ReleaseSmall
          zig build -Dwasm-surface=term -Doptimize=ReleaseSmall

      - name: Install terminal test dependencies
        run: npm ci --prefix sdk/node

      - name: Test Bun + N-API
        run: bun sdk/tests/test-node-napi.mjs

      - name: Test Bun + WASM
        run: bun sdk/tests/test-node-wasm.mjs

      - name: Test Bun benchmark path
        run: bun sdk/tests/test-libfx-benchmark.mjs

      - name: Test Bun cross-backend integrations
        run: |
          bun sdk/tests/test-agent-bootstrap.mjs auto
          bun sdk/tests/test-checkpoint.mjs native wasm
          bun sdk/tests/test-checkpoint.mjs wasm native
          bun sdk/tests/test-host-tools.mjs native
          bun sdk/tests/test-host-tools.mjs wasm
          bun sdk/tests/test-host-tool-cancel.mjs native
          bun sdk/tests/test-host-tool-cancel.mjs wasm
          bun sdk/tests/test-mcp-adapter.mjs stdio native
          bun sdk/tests/test-mcp-adapter.mjs http wasm
          bun sdk/tests/test-skills-adapter.mjs disk native
          bun sdk/tests/test-skills-adapter.mjs host wasm

  sdk-browser-wasm:
    name: SDK (Browser + WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Build WASM surfaces (ReleaseSmall)
        run: |
          zig build -Dwasm-surface=core -Doptimize=ReleaseSmall
          zig build -Dwasm-surface=term -Doptimize=ReleaseSmall

      - name: Test Browser + WASM
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run --prefix sdk test:browser-wasm

  e2e_mode:
    name: E2E (deterministic, ${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimize: [ReleaseSafe]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          cache-key: ci-e2e-${{ matrix.optimize }}

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install e2e deps
        run: bun install
        working-directory: tests/e2e

      - name: Install isolated MCP conformance package
        run: npm ci
        working-directory: tests/e2e/conformance

      - name: Install tmux
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tmux
          fi

      - name: Run CLI tests
        run: bun test cli.test.ts
        working-directory: tests/e2e

      - name: Run ACP tests (no-key subset)
        run: bun test acp.test.ts
        working-directory: tests/e2e

      - name: Run legacy stdio MCP tool lifecycle test
        run: bun test gateway-stream-lifecycle.test.ts --test-name-pattern "selected dynamic MCP review cautions with zero sends and clears exactly once"
        working-directory: tests/e2e

      - name: Run stdio MCP dispatcher lifecycle tests
        run: bun test mcp-stdio.test.ts
        working-directory: tests/e2e

      - name: Run modern MCP Streamable HTTP tests
        run: bun test mcp-http.test.ts
        working-directory: tests/e2e

      - name: Run legacy MCP remote compatibility tests
        run: bun test mcp-legacy-remote.test.ts
        working-directory: tests/e2e

      - name: Run isolated MCP conformance baseline
        run: npm test
        working-directory: tests/e2e/conformance
        env:
          FX_SOUND: "0"

      - name: Run persistence tests
        run: bun test config-persistence.test.ts session-recovery.test.ts prompt-history.test.ts
        working-directory: tests/e2e

      - name: Run gateway lifecycle recovery regressions
        run: bun test ./gateway-stream-lifecycle.test.ts --test-name-pattern "saved malformed recovery resumes without re-executing the historical call|OS filesystem access denial reaches the next gateway request"
        working-directory: tests/e2e

      - name: Run lean Auto Mode reliability contract
        run: bun test auto-mode-reliability.test.ts
        working-directory: tests/e2e
        env:
          AI_GATEWAY_API_KEY: ""
          VERCEL_OIDC_TOKEN: ""
          FX_REQUIRE_TMUX: "1"

      - name: Run Vision route and headless SIGINT regressions
        run: |
          bun test vision-route-fake-gateway.test.ts
          bun test ./tui-command-permissions.test.ts --test-name-pattern "fx ask SIGINT during classifier wait terminates before decision or execution"
        working-directory: tests/e2e
        env:
          AI_GATEWAY_API_KEY: ""
          VERCEL_OIDC_TOKEN: ""

      - name: Run TUI input line deletion regression
        run: |
          tmux -V
          bun test tui-input-line-delete.test.ts
        working-directory: tests/e2e
        env:
          AI_GATEWAY_API_KEY: ""
          VERCEL_OIDC_TOKEN: ""
          FX_REQUIRE_TMUX: "1"

      - name: Run multiline input navigation TUI tests
        run: |
          tmux -V
          bun test tui-input-navigation.test.ts
        working-directory: tests/e2e
        env:
          AI_GATEWAY_API_KEY: ""
          VERCEL_OIDC_TOKEN: ""
          FX_REQUIRE_TMUX: "1"

      - name: Run valid question recovery TUI regression
        run: |
          tmux -V
          bun test ./tui-decision-prompts.test.ts --test-name-pattern "valid serialized ask control with matching identity opens the question and continues"
        working-directory: tests/e2e
        env:
          AI_GATEWAY_API_KEY: ""
          VERCEL_OIDC_TOKEN: ""
          FX_REQUIRE_TMUX: "1"

      - name: Run streamed lifecycle, direct-write, and command scrollback regressions
        run: |
          tmux -V
          bun test tui-gateway-stream-lifecycle.test.ts tui-direct-write-audit.test.ts
          bun test ./tui-command-permissions.test.ts --test-name-pattern "TUI preserves completed transcript when a later auto-approved command starts|TUI isolates approved foreground commands from terminal ownership"
        working-directory: tests/e2e
        env:
          AI_GATEWAY_API_KEY: ""
          VERCEL_OIDC_TOKEN: ""
          FX_REQUIRE_TMUX: "1"

  e2e:
    name: E2E (deterministic)
    if: ${{ always() }}
    needs: e2e_mode
    runs-on: ubuntu-latest
    steps:
      - name: Require ReleaseSafe
        env:
          MATRIX_RESULT: ${{ needs.e2e_mode.result }}
        run: test "$MATRIX_RESULT" = success

  cross-target:
    name: Cross-target Compile (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux
          - name: linux-aarch64
            target: aarch64-linux
          - name: macos-x86_64
            target: x86_64-macos
          - name: macos-aarch64
            target: aarch64-macos
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          cache-key: ci-cross-target-${{ matrix.name }}

      - name: Build target
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Report binary size
        run: |
          bytes=$(stat -c%s zig-out/bin/fx)
          mib=$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1048576 }')
          echo "${{ matrix.name }}: $bytes bytes ($mib MiB)"
          echo "${{ matrix.name }}: $bytes bytes ($mib MiB)" >> "$GITHUB_STEP_SUMMARY"

  lint-scripts:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck Fx scripts
        run: |
          scripts=(
            benchmarks/startup.sh
            scripts/check-public-surface.sh
          )
          bash -n "${scripts[@]}"
          shellcheck "${scripts[@]}"

  e2e_acp_full_mode:
    name: E2E ACP (full, ${{ matrix.optimize }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        optimize: [ReleaseSafe]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          cache-key: ci-acp-full-${{ matrix.optimize }}

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install e2e deps
        run: bun install
        working-directory: tests/e2e

      - name: Run full ACP tests
        run: bun test acp.test.ts
        working-directory: tests/e2e
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}

  e2e-acp-full:
    name: E2E ACP (full)
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: e2e_acp_full_mode
    runs-on: ubuntu-latest
    steps:
      - name: Require ReleaseSafe
        env:
          MATRIX_RESULT: ${{ needs.e2e_acp_full_mode.result }}
        run: test "$MATRIX_RESULT" = success
