name: TLA+ custom model connections

# Checks the custom model connection models in tests/tla/configured_provider/:
# TLC on every config, planted mutations included, then the driver, which
# runs the built fx along the models against local fake servers, walks
# src/gateway/request_deadlines.zig through its lab, and plants bugs that it
# must catch. It runs only on request: on a pull request labeled
# ci:tla-configured-provider, or when this workflow is dispatched on a branch.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  # Adding some other label starts a run that skips the check, so it gets its
  # own group instead of cancelling a check in progress.
  group: tla-configured-provider-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci:tla-configured-provider' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: TLA+ custom model connections model
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:tla-configured-provider') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:tla-configured-provider'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
      FX_SOUND: "0"
    steps:
      - uses: actions/checkout@v4
      # The driver runs the built binary and builds a lab around the deadline module.
      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: "0.17.0"
          cache-key: ci-tla-configured-provider
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Build fx
        run: zig build
      - name: Model-check custom model connections and drive the real code along the models
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl -fsSL -o "$jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | sha256sum -c -
          export TLA2TOOLS_JAR="$jar"
          tests/tla/configured_provider/check.sh
          bun tests/tla/drivers/configured_provider/driver.ts --self-check
