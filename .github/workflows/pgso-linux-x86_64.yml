name: Linux x86_64 PGSO candidate

# Pull requests run PGSO only when the PGSO pipeline itself changes. Dispatch
# this workflow on any branch to qualify other changes; the stable release
# always runs it. One job builds and qualifies the candidate, because
# distributed builds don't carry the startup profiles that Linux candidates
# need.
on:
  workflow_call:
    inputs:
      evidence-retention-days:
        description: Days to keep the qualified evidence
        type: number
        default: 14
    outputs:
      artifact-id:
        description: Qualified PGSO evidence artifact ID
        value: ${{ jobs.candidate.outputs.artifact-id }}
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/pgso/**
      - "!scripts/pgso/corpus.json"
      - .github/actions/setup-pgso/**
      - .github/workflows/pgso-linux-x86_64.yml

concurrency:
  group: pgso-linux-x86_64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AI_GATEWAY_API_KEY: ""
  VERCEL_OIDC_TOKEN: ""
  FX_SOUND: "0"

jobs:
  candidate:
    name: Linux x86_64 PGSO candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require native x86_64 host
        run: test "$(uname -m)" = x86_64

      - name: Setup pinned tools
        id: setup
        uses: ./.github/actions/setup-pgso
        with:
          llvm: "true"
          bun: "true"
          hyperfine: "true"

      - name: Test the PGSO driver
        env:
          FX_PGSO_LLVM_BIN: ${{ steps.setup.outputs.llvm-bin }}
        run: python3 -m unittest discover -s scripts/pgso/tests -v

      - name: Install E2E dependencies
        run: bun install --frozen-lockfile
        working-directory: tests/e2e

      - name: Build and qualify the candidate
        run: |
          python3 -m scripts.pgso all \
            --llvm-bin "${{ steps.setup.outputs.llvm-bin }}" \
            --output-dir "$RUNNER_TEMP/fx-pgso" \
            --target x86_64-linux \
            --update-channel stable \
            --samples 50 \
            --bun "${{ steps.setup.outputs.bun-bin }}" \
            --hyperfine "${{ steps.setup.outputs.hyperfine-bin }}"

      - name: Upload evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pgso-linux-x86_64-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fx-pgso/manifest.json
            ${{ runner.temp }}/fx-pgso/logs
            ${{ runner.temp }}/fx-pgso/measurements
            ${{ runner.temp }}/fx-pgso/candidate/fx
          if-no-files-found: warn
          retention-days: ${{ inputs.evidence-retention-days || 14 }}
