name: fx bug report
description: Report a problem with fx
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        If useful, run `/trace` and attach the output after reviewing and removing sensitive information.

  - type: textarea
    id: description
    attributes:
      label: Issue details
      description: Describe the issue, expected behavior, and steps to reproduce it.
    validations:
      required: true

  - type: textarea
    id: trace
    attributes:
      label: Trace
      description: Optional. Paste or attach the reviewed and redacted output from `/trace`.
    validations:
      required: false

  - type: checkboxes
    id: sanitized
    attributes:
      label: Sensitive information
      options:
        - label: I reviewed the information above and removed secrets and other sensitive data.
          required: true
