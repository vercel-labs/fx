<!doctype html>
<meta charset="utf-8">
<title>libfx browser terminal test</title>
<script type="module">
  import { createFxTerminal, supportsJspi } from "./browser.js";

  const decoder = new TextDecoder();
  const liveDraft = "INPUT_DURING_STREAM";
  let output = "";
  let streamSourceClosed = false;
  let streamChunkCount = 0;
  const dataListeners = new Set();
  const resizeListeners = new Set();
  const terminal = {
    cols: 80,
    rows: 24,
    write(value) {
      const text = typeof value === "string" ? value : decoder.decode(value, { stream: true });
      output += text;
    },
    drain() {},
    onData(callback) {
      dataListeners.add(callback);
      return () => dataListeners.delete(callback);
    },
    onResize(callback) {
      resizeListeners.add(callback);
      return () => resizeListeners.delete(callback);
    },
  };

  const testState = window.__fxBrowserTerminalTest = { state: "starting", stage: "boot" };
  try {
    if (!supportsJspi()) throw new Error("JSPI unavailable");
    const encoded = new TextEncoder();
    let runtime;
    let inputTaskRan = false;
    let inputTaskChunkCount;
    let fetchCount = 0;
    let activeClearFetchAborted = false;
    let activeClearSessionRendered = false;
    let activeClearFollowupFresh = false;
    let signalFetchStarted;
    let releaseBufferedStream;
    let finishBufferedStream;
    const fetchStarted = new Promise((resolve) => { signalFetchStarted = resolve; });
    const bufferedStreamReleased = new Promise((resolve) => { releaseBufferedStream = resolve; });
    const bufferedStreamFinished = new Promise((resolve) => { finishBufferedStream = resolve; });
    const completedResponse = (text) => {
      let sent = false;
      return new Response(new ReadableStream({
        pull(controller) {
          if (sent) return;
          sent = true;
          controller.enqueue(encoded.encode(`data: ${JSON.stringify({ type: "text-delta", id: "browser_followup_1", delta: text })}\n\n`));
          controller.enqueue(encoded.encode('data: {"type":"finish","finishReason":{"unified":"stop","raw":"stop"},"usage":{"inputTokens":{"total":1},"outputTokens":{"total":1}}}\n\n'));
          controller.enqueue(encoded.encode("data: [DONE]\n\n"));
          controller.close();
        },
      }), { status: 200, headers: { "content-type": "text/event-stream" } });
    };
    const mockFetch = async (_url, init) => {
      fetchCount += 1;
      const requestBody = new TextDecoder().decode(init.body);
      if (fetchCount === 2) {
        return new Promise((_, reject) => {
          init.signal.addEventListener("abort", () => {
            activeClearFetchAborted = true;
            reject(new DOMException("aborted", "AbortError"));
          }, { once: true });
        });
      }
      if (fetchCount > 2) {
        activeClearFollowupFresh = requestBody.includes("follow-up prompt") &&
          !requestBody.includes("clear active turn") &&
          !requestBody.includes("STREAM_STARTED");
        return completedResponse("BROWSER_FOLLOWUP_OK");
      }
      signalFetchStarted();
      return new Response(new ReadableStream({
        async pull(controller) {
          await bufferedStreamReleased;
          streamChunkCount += 1;
          testState.chunks = streamChunkCount;
          if (streamChunkCount === 1) {
            controller.enqueue(encoded.encode('data: {"type":"text-delta","delta":"STREAM_STARTED"}\n\n'));
            return;
          }
          if (streamChunkCount <= 128) {
            controller.enqueue(encoded.encode('data: {"type":"text-delta","delta":"."}\n\n'));
            return;
          }
          await bufferedStreamFinished;
          controller.enqueue(encoded.encode('data: {"type":"text-delta","delta":"STREAM_FINISHED"}\n\n'));
          controller.enqueue(encoded.encode('data: {"type":"finish","finishReason":{"unified":"stop"},"usage":{"inputTokens":{"total":1},"outputTokens":{"total":2}}}\n\n'));
          controller.enqueue(encoded.encode("data: [DONE]\n\n"));
          controller.close();
          streamSourceClosed = true;
        },
      }), { status: 200, headers: { "content-type": "text/event-stream" } });
    };
    testState.stage = "creating-runtime";
    runtime = await createFxTerminal({
      wasm: "../zig-out/bin/fx-term.wasm",
      terminal,
      env: { AI_GATEWAY_API_KEY: "browser-terminal-test-key" },
      fetch: mockFetch,
    });
    testState.stage = "waiting-interactive";
    await runtime.interactive;
    testState.stage = "waiting-startup";
    const deadline = performance.now() + 10000;
    while (!output.includes("Run /help for commands")) {
      if (performance.now() >= deadline) throw new Error("startup output missing");
      await new Promise((resolve) => setTimeout(resolve, 10));
    }
    testState.stage = "starting-stream";
    runtime.write("stream please\r");
    await fetchStarted;
    testState.stage = "releasing-stream";
    setTimeout(() => {
      inputTaskRan = true;
      inputTaskChunkCount = streamChunkCount;
      runtime.write(liveDraft);
    }, 0);
    releaseBufferedStream();
    testState.stage = "waiting-live-input";
    while (!inputTaskRan || !output.includes(liveDraft)) {
      if (streamSourceClosed) throw new Error("terminal rendered browser input only after the stream source closed");
      if (performance.now() >= deadline) throw new Error("browser input did not render during the stream");
      await new Promise((resolve) => setTimeout(resolve, 10));
    }
    const inputTaskRanDuringStream = inputTaskChunkCount < 128;
    const draftRenderedDuringStream = !streamSourceClosed;
    finishBufferedStream();
    testState.stage = "waiting-stream-finish";
    while (!streamSourceClosed) {
      if (performance.now() >= deadline) throw new Error("stream source did not finish");
      await new Promise((resolve) => setTimeout(resolve, 10));
    }
    runtime.write("\x7f".repeat(liveDraft.length));
    const freshWelcomeOffset = output.length;
    testState.stage = "starting-active-clear";
    runtime.write("clear active turn\r");
    const activeDeadline = performance.now() + 10000;
    while (fetchCount < 2 || !output.includes("Thinking")) {
      if (performance.now() >= activeDeadline) throw new Error("active clear prompt did not start");
      await new Promise((resolve) => setTimeout(resolve, 10));
    }
    testState.stage = "clearing-active-turn";
    runtime.write("/clear\r");
    while (!activeClearFetchAborted) {
      if (performance.now() >= activeDeadline) throw new Error("active clear did not abort browser fetch");
      await new Promise((resolve) => setTimeout(resolve, 10));
    }
    while (!output.slice(freshWelcomeOffset).includes("Run /help for commands")) {
      if (performance.now() >= activeDeadline) throw new Error("active clear did not render a fresh session");
      await new Promise((resolve) => setTimeout(resolve, 10));
    }
    activeClearSessionRendered = true;
    testState.stage = "running-followup";
    runtime.write("follow-up prompt\r");
    while (fetchCount < 3 || !activeClearFollowupFresh) {
      if (performance.now() >= activeDeadline) throw new Error("browser follow-up did not start with fresh session history");
      await new Promise((resolve) => setTimeout(resolve, 10));
    }
    runtime.write("/exit\r");
    const code = await runtime.exited;
    window.__fxBrowserTerminalTest = {
      state: "completed",
      code,
      output,
      inputTaskRanDuringStream,
      draftRenderedDuringStream,
      activeClearFetchAborted,
      activeClearSessionRendered,
      activeClearFollowupFresh,
      dataListeners: dataListeners.size,
      resizeListeners: resizeListeners.size,
    };
  } catch (error) {
    window.__fxBrowserTerminalTest = { state: "failed", error: error?.stack || String(error), output };
  }
</script>
