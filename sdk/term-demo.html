<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fx terminal WebAssembly demo</title>
  <script>
    // The production packager replaces these defaults with content-addressed values.
    const fxWasmAsset = "./fx-term.wasm";
    const fxWasmIntegrity = "";
    const fxWasmUrl = fxWasmAsset === "./fx-term.wasm" &&
      (location.hostname === "localhost" || location.hostname === "127.0.0.1")
      ? "../zig-out/bin/fx-term.wasm"
      : fxWasmAsset;
    globalThis.__fxWasmModule = null;
    if (typeof WebAssembly.Suspending === "function" && typeof WebAssembly.promising === "function") {
      const response = fetch(fxWasmUrl, fxWasmIntegrity ? { integrity: fxWasmIntegrity } : undefined);
      globalThis.__fxWasmModule = typeof WebAssembly.compileStreaming === "function"
        ? WebAssembly.compileStreaming(response)
        : response.then((value) => value.arrayBuffer()).then((bytes) => WebAssembly.compile(bytes));
      globalThis.__fxWasmModule.catch(() => {});
    }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/+esm">
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/+esm">
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css">
  <style>
    @font-face {
      font-family: "Geist Mono";
      src: url("https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/GeistMono-Variable.woff2") format("woff2");
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body, #terminal { width: 100%; height: 100%; margin: 0; }
    html, body { overflow: hidden; background: #111; }
    #terminal .xterm {
      width: 100%;
      height: 100%;
      padding: 12px;
      font-variant-ligatures: none;
    }
    #terminal .xterm-viewport {
      background: #111 !important;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "@xterm/xterm": "https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/+esm",
        "@xterm/addon-fit": "https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/+esm"
      }
    }
  </script>
</head>
<body>
  <div id="terminal"></div>
  <script type="module">
    import { Terminal } from "@xterm/xterm";
    import { FitAddon } from "@xterm/addon-fit";
    import { createFxTerminal, supportsJspi, xtermAdapter } from "./browser.js";

    const terminal = new Terminal({
      cursorBlink: true,
      cursorStyle: "bar",
      cursorWidth: 1,
      fontFamily: '"Geist Mono", monospace',
      fontSize: 14,
      fontWeight: 400,
      fontWeightBold: 600,
      lineHeight: 1.25,
      letterSpacing: 0,
      scrollback: 5000,
      scrollOnUserInput: true,
      theme: {
        background: "#111111",
        foreground: "#f2f2f2",
        cursor: "#f2f2f2",
        cursorAccent: "#111111",
        selectionBackground: "#333333",
      },
    });
    await document.fonts.load('14px "Geist Mono"');
    const fitAddon = new FitAddon();
    terminal.loadAddon(fitAddon);
    terminal.open(document.querySelector("#terminal"));
    fitAddon.fit();

    let fitFrame = null;
    const resizeObserver = new ResizeObserver(() => {
      if (fitFrame !== null) return;
      fitFrame = requestAnimationFrame(() => {
        fitFrame = null;
        fitAddon.fit();
      });
    });
    resizeObserver.observe(document.querySelector("#terminal"));
    terminal.focus();

    const configStore = {
      get(id) { return localStorage.getItem(`fx.core.config.${id}`); },
      set(id, value) { localStorage.setItem(`fx.core.config.${id}`, value); },
    };
    const promptHistoryStore = {
      load(workspaceRoot, limit) {
        const values = JSON.parse(localStorage.getItem(`fx.term.history.${workspaceRoot}`) || "[]");
        return values.slice(-limit);
      },
      append(workspaceRoot, value) {
        const key = `fx.term.history.${workspaceRoot}`;
        const values = JSON.parse(localStorage.getItem(key) || "[]");
        if (values.at(-1) === value) return "duplicate";
        values.push(value);
        localStorage.setItem(key, JSON.stringify(values.slice(-100)));
      },
      clear(workspaceRoot) { localStorage.removeItem(`fx.term.history.${workspaceRoot}`); },
    };
    if (!supportsJspi()) {
      terminal.write("fx requires Chrome or Edge 137+ with JSPI support.\r\n");
      window.__fxTerminal = { terminal, fitAddon, resizeObserver, unsupported: true };
    } else {
      const runtime = await createFxTerminal({
        wasm: globalThis.__fxWasmModule,
        terminal: xtermAdapter(terminal),
        env: { AI_GATEWAY_API_KEY: localStorage.getItem("FX_API_KEY") || "" },
        configStore,
        promptHistoryStore,
      });
      window.__fxTerminal = { runtime, terminal, fitAddon, resizeObserver };
    }
  </script>
</body>
</html>
